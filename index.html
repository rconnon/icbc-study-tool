<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>BC Commercial Licence Study — Classes 1–4</title>
<style>
:root{
  --ground:#f2f4f7; --surface:#ffffff; --surface2:#f7f9fb;
  --ink:#1a2330; --ink2:#4d5a6b; --muted:#8493a5;
  --line:#dde3ea; --line-soft:#e9edf2;
  --accent:#1e5fa8; --accent-ink:#ffffff; --accent-wash:rgba(30,95,168,.09);
  --good:#1a7f4e; --good-wash:rgba(26,127,78,.10);
  --warn:#9a6b00; --warn-wash:rgba(154,107,0,.10);
  --bad:#b3372f; --bad-wash:rgba(179,55,47,.09);
  --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.14);
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#11161d; --surface:#1a212b; --surface2:#151c25;
    --ink:#e7ecf2; --ink2:#a8b4c2; --muted:#6e7c8c;
    --line:#2a3441; --line-soft:#232c37;
    --accent:#6da8e8; --accent-ink:#0d1725; --accent-wash:rgba(109,168,232,.13);
    --good:#4fbc85; --good-wash:rgba(79,188,133,.12);
    --warn:#d9a53f; --warn-wash:rgba(217,165,63,.12);
    --bad:#e07b74; --bad-wash:rgba(224,123,116,.12);
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;background:var(--ground);color:var(--ink);
  font:16px/1.5 var(--ui);-webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0;
  -webkit-tap-highlight-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.wrap{max-width:720px;margin:0 auto;padding:0 16px 64px}
header.top{position:sticky;top:0;z-index:10;background:var(--ground);
  padding:10px 0 8px;display:flex;align-items:center;gap:10px;min-height:52px}
header.top .back{font-size:15px;color:var(--accent);font-weight:600;padding:6px 10px 6px 0;
  white-space:nowrap}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
header.top .spacer{flex:1}

.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 6px}
h2.big{font-size:26px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em}
p.lede{color:var(--ink2);margin:0 0 18px;font-size:15px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:16px}
.card+.card{margin-top:12px}
button.rowcard{display:block;width:100%;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:15px 16px;margin-top:12px}
button.rowcard:active{transform:scale(.99)}
.rowcard .rc-top{display:flex;align-items:baseline;gap:10px}
.rowcard .rc-title{font-size:17px;font-weight:700}
.rowcard .rc-badge{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);
  white-space:nowrap}
.rowcard .rc-sub{color:var(--ink2);font-size:13.5px;margin-top:3px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;
  padding:6px 13px;font-size:13.5px;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);font-weight:600}

.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);font-weight:700;
  border-radius:10px;padding:12px 18px;font-size:15.5px;text-align:center}
.btn.block{display:block;width:100%}
.btn.ghost{background:var(--surface);color:var(--accent);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn+.btn{margin-top:10px}

/* flash cards */
.flash{perspective:1200px;margin-top:14px}
.flash .inner{position:relative;width:100%;min-height:300px;border-radius:16px;
  transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
  padding:22px;display:flex;flex-direction:column;overflow-y:auto}
.face.back{transform:rotateY(180deg);background:var(--surface2)}
.face .tag{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:10px;
  text-transform:uppercase;letter-spacing:.07em}
.face .txt{font-size:18.5px;line-height:1.45;margin:auto 0;white-space:pre-line}
.face.back .txt{font-size:16.5px}
.face .hint{color:var(--muted);font-size:12.5px;margin-top:14px;text-align:center}
.flashbtns{display:flex;gap:10px;margin-top:12px}
.flashbtns .btn{flex:1;margin:0}
.btn.again{background:var(--warn-wash);color:var(--warn);border:1px solid var(--line)}
.btn.got{background:var(--good-wash);color:var(--good);border:1px solid var(--line)}
.flashnav{display:flex;align-items:center;justify-content:space-between;margin-top:10px;
  color:var(--muted);font-family:var(--mono);font-size:12px}
.flashnav button{color:var(--accent);font-weight:600;font-size:14px;padding:8px 10px}

/* quiz */
.progress{height:6px;border-radius:3px;background:var(--line-soft);overflow:hidden;margin:8px 0 16px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;
  transition:width .3s}
.qtext{font-size:18px;font-weight:650;line-height:1.4;margin:4px 0 14px}
.qmeta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
button.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-top:9px;font-size:15.5px;line-height:1.4}
button.opt .k{font-family:var(--mono);font-size:12.5px;color:var(--muted);
  border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-top:1px;flex:none}
button.opt[data-state="picked"]{border-color:var(--accent);background:var(--accent-wash)}
button.opt[data-state="correct"]{border-color:var(--good);background:var(--good-wash)}
button.opt[data-state="correct"] .k{border-color:var(--good);color:var(--good);font-weight:700}
button.opt[data-state="wrong"]{border-color:var(--bad);background:var(--bad-wash)}
button.opt[data-state="wrong"] .k{border-color:var(--bad);color:var(--bad);font-weight:700}
button.opt:disabled{cursor:default}
.explain{margin-top:14px;border-left:3px solid var(--accent);background:var(--surface2);
  border-radius:0 10px 10px 0;padding:12px 14px;font-size:14.5px;color:var(--ink2)}
.explain b{color:var(--ink)}
.explain .src{display:block;margin-top:6px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}

/* results + readiness */
.scorehero{text-align:center;padding:26px 16px 20px}
.scorehero .n{font-size:52px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.scorehero .d{color:var(--ink2);font-size:14.5px;margin-top:2px}
.verdict{display:flex;align-items:center;gap:10px;border-radius:12px;padding:12px 14px;
  font-weight:700;font-size:15.5px;margin-top:14px}
.verdict.pass{background:var(--good-wash);color:var(--good)}
.verdict.fail{background:var(--bad-wash);color:var(--bad)}
.verdict.mid{background:var(--warn-wash);color:var(--warn)}
.verdict .ic{font-size:18px}
.verdict .sub{font-weight:400;font-size:13px;color:var(--ink2)}

.meter-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;
  align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.meter-row:last-child{border-bottom:none}
.meter-row .lbl{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meter-row .val{font-family:var(--mono);font-size:12px;color:var(--ink2);
  font-variant-numeric:tabular-nums;text-align:right}
.meter-row .bar{grid-column:1/-1;height:5px;border-radius:3px;background:var(--line-soft)}
.meter-row .bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.meter-row.low .bar i{background:var(--bad)}
.meter-row.mid .bar i{background:var(--warn)}
.meter-row.na .val{color:var(--muted)}

.checklist{margin:8px 0 0;padding:0;list-style:none}
.checklist li{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);
  font-size:14.5px;align-items:flex-start}
.checklist li:last-child{border-bottom:none}
.checklist .ic{flex:none;font-weight:800;font-family:var(--mono)}
.checklist li.ok .ic{color:var(--good)}
.checklist li.no .ic{color:var(--warn)}
.checklist .why{color:var(--ink2);font-size:13px;display:block}

details.tips{margin-top:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow);padding:0 16px}
details.tips summary{padding:14px 0;font-weight:700;cursor:pointer;font-size:15.5px}
details.tips ul{margin:0 0 14px;padding-left:20px;color:var(--ink2);font-size:14.5px}
details.tips li{margin:6px 0}

/* learn module */
.objlist{margin:8px 0 0;padding:0;list-style:none}
.objlist li{display:flex;gap:10px;padding:7px 0;font-size:14.5px;color:var(--ink2);
  border-bottom:1px solid var(--line-soft);align-items:flex-start}
.objlist li:last-child{border-bottom:none}
.objlist .ic{color:var(--accent);font-weight:800;flex:none}
.lsteps{display:flex;gap:5px;margin:10px 0 16px}
.lsteps i{flex:1;height:5px;border-radius:3px;background:var(--line-soft)}
.lsteps i.done{background:var(--accent)}
.lsteps i.cur{background:var(--accent);opacity:.45}
.lsec-title{font-size:20px;font-weight:750;letter-spacing:-.01em;margin:2px 0 10px}
.lpoints{margin:0;padding:0;list-style:none}
.lpoints li{position:relative;padding:8px 0 8px 22px;font-size:15.5px;line-height:1.5;
  border-bottom:1px solid var(--line-soft)}
.lpoints li:last-child{border-bottom:none}
.lpoints li::before{content:"";position:absolute;left:4px;top:15px;width:7px;height:7px;
  border-radius:50%;background:var(--accent);opacity:.7}
.mustknow{margin-top:14px;background:var(--warn-wash);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px}
.mustknow h4{margin:0 0 6px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--warn);display:flex;gap:7px;align-items:center}
.mustknow ul{margin:0;padding-left:18px;font-size:14.5px;color:var(--ink)}
.mustknow li{margin:4px 0}
.checkhdr{margin:20px 0 2px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:700}
.modrow-status{font-family:var(--mono);font-size:11px;white-space:nowrap}
.modrow-status.done{color:var(--good)}
.modrow-status.due{color:var(--warn)}
.review-item{border-top:1px solid var(--line-soft);padding:14px 0}
.review-item .rq{font-weight:650;font-size:15px}
.review-item .ra{font-size:14px;margin-top:6px}
.review-item .ra .no{color:var(--bad)}
.review-item .ra .yes{color:var(--good)}
.footer-note{color:var(--muted);font-size:12.5px;margin-top:26px;text-align:center;line-height:1.6}
.footer-note a{color:var(--accent)}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;border:1px solid var(--line);
  border-radius:99px;padding:2px 9px;color:var(--ink2);margin-left:6px;vertical-align:middle}
.examtimer{font-family:var(--mono);font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.qgrid{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.qgrid button{width:38px;height:34px;border:1px solid var(--line);border-radius:8px;
  font-family:var(--mono);font-size:12.5px;color:var(--ink2);background:var(--surface)}
.qgrid button.answered{background:var(--accent-wash);border-color:var(--accent);color:var(--ink)}
.qgrid button.current{outline:2px solid var(--accent)}
</style>
</head>
<body>
<script type="application/json" id="study-data">{"chapters":{"1":{"title":"getting your driver's licence","cards":[{"front":"What vehicles can you drive with a Class 1 licence, and what is the minimum age?","back":"Semi-trailer trucks and all other motor vehicles or combinations of vehicles except motorcycles. Minimum age is 19.","topic":"Licence classes","id":"1-c0","chapter":1},{"front":"What vehicles can you drive with a Class 2 licence?","back":"Buses, including school buses, special activity buses and special vehicles. Trailers or towed vehicles may not exceed 4,600 kg — they may exceed 4,600 kg only if the bus and trailers do not have air brakes. Also any motor vehicle or combination in Class 4. Minimum age 19.","topic":"Licence classes","id":"1-c1","chapter":1},{"front":"What vehicles can you drive with a Class 3 licence?","back":"Trucks with more than two axles (such as dump trucks and large tow trucks), but not a bus being used to transport passengers. Trailers may not exceed 4,600 kg unless the truck and trailers have no air brakes. Also a tow car towing a vehicle of any weight, a mobile truck crane, and any Class 5 vehicle. Minimum age 18.","topic":"Licence classes","id":"1-c2","chapter":1},{"front":"What is the difference between a Class 4 unrestricted and a Class 4 restricted licence?","back":"Class 4 unrestricted: buses with a maximum seating capacity of 25 persons (including the driver), including school buses, special activity buses and special vehicles for people with disabilities, plus taxis, limousines, ride-hailing vehicles and ambulances. Class 4 restricted: taxis, limousines and ride-hailing vehicles up to 10 persons (including the driver), ambulances, and special vehicles seating not more than 10 persons used to transport people with disabilities.","topic":"Licence classes","id":"1-c3","chapter":1},{"front":"What does a heavy trailer endorsement (code 20) allow you to do?","back":"On a Class 4 or 5 licence, it allows you to tow trailers of any weight provided that neither the truck nor the trailer has air brakes. Minimum age 18.","topic":"Heavy trailer endorsement","id":"1-c4","chapter":1},{"front":"When do you need an air brake endorsement (code 15)?","back":"To operate vehicles equipped with air brakes on a highway (other than a vehicle defined as a construction vehicle). It is also required to operate most vehicles equipped with air-over-hydraulic brakes. The code 15 endorsement is shown in the 'restrictions' section of the driver's licence.","topic":"Air brake endorsement","id":"1-c5","chapter":1},{"front":"What five things are checked during the commercial driver vision screening?","back":"Visual acuity (reading from a distance), peripheral vision (seeing objects on each side), depth perception (telling how close objects are), diplopia (whether you have double vision), and colour perception (distinguishing red, green and amber). Commercial drivers must meet a higher vision standard than Class 5 drivers.","topic":"Vision","id":"1-c6","chapter":1},{"front":"What medical steps happen when you apply for a commercial driver's licence?","back":"You'll be asked about medical conditions that may affect your fitness, complete a declaration form about medical conditions, be given a Driver's Medical Examination form for your doctor to complete and send to RoadSafetyBC, and complete a vision screening. RoadSafetyBC determines your fitness to drive commercial vehicles.","topic":"Medical fitness","id":"1-c7","chapter":1},{"front":"What prerequisites must you meet before applying for a Class 1, 2, 3 or 4 licence?","back":"Hold or have held a full-privilege Class 5 or Class 6 licence (or out-of-province equivalent); have an acceptable driving record with fewer than four penalty-point offences in the previous two years and zero motor-vehicle-related Criminal Code convictions in the previous three years; meet the minimum age; have no outstanding fines or debts owed to the Court, Government or ICBC; and meet the required medical standards.","topic":"Applying for a licence","id":"1-c8","chapter":1},{"front":"What is MELT and who must take it?","back":"Mandatory Entry Level Training — a requirement for all new Class 1 applicants since October 18, 2021. It aligns with the national Class 1 entry-level training standard, includes theory, practical training and on-highway driving, and covers air brakes. It is a one-time requirement offered by ICBC-approved driving schools. You must qualify for your Class 1 learner licence before starting MELT.","topic":"MELT","id":"1-c9","chapter":1},{"front":"Who is exempt from taking B.C.'s MELT when moving to B.C.?","back":"Holders of a Canadian Class 1 licence with more than 24 consecutive months of Class 1 experience, provided the licence has not been expired for more than three years. With 12 to 24 months of experience (and no accepted MELT course), you get two road test attempts before MELT is required; with less than 12 months you must take B.C.'s MELT. B.C. accepts MELT from Saskatchewan, Manitoba, Ontario and Alberta. All Class 1 drivers with a licence issued outside Canada must take B.C.'s MELT.","topic":"MELT","id":"1-c10","chapter":1},{"front":"What are the key facts about the commercial knowledge tests?","back":"You take knowledge tests whenever you apply for a new licence. All knowledge tests are conducted only in English, must be completed without assistance, and are all multiple choice. The answers to all knowledge test questions are in the guide. One of the tests is a traffic signs test.","topic":"Knowledge tests","id":"1-c11","chapter":1},{"front":"What does a commercial road test consist of, and how long does it take?","back":"A pre-trip inspection, an air brake pre-trip inspection (if the vehicle has air brakes), and a road test. You must demonstrate a pre-trip inspection including a written trip inspection report, basic vehicle control skills, and handling the vehicle in traffic. A Class 1 road test takes about two hours; Class 2, 3, 4 and heavy trailer endorsement road tests take less than two hours.","topic":"Road tests","id":"1-c12","chapter":1},{"front":"What are the rules for driving on a commercial learner's licence?","back":"The learner's licence is valid for one year and allows you to practise with a supervisor. The supervisor must be at least 19 years old, hold the appropriate licence for the vehicle, and sit beside you (or immediately behind and to the right if there's no seat beside the driver). In a bus, taxi, ride-hailing vehicle or ambulance, no passengers are permitted other than your supervisor and other learners training for the same class.","topic":"Learner's licence","id":"1-c13","chapter":1},{"front":"How often must commercial drivers submit a Driver's Medical Examination Report?","back":"At ages 25, 30, 35, 40 and 45; then 48, 51, 54, 57, 60 and 63; then every year upon reaching age 66. Your licence may be cancelled if you don't submit the form. The doctor's fee is not covered by MSP, ICBC or RoadSafetyBC.","topic":"Keeping your licence","id":"1-c14","chapter":1},{"front":"What are the two types of air brake courses?","back":"A certified course: 7 hours of classroom theory plus four hours of practical training on air brake pre-trip inspections — if you pass the provider's pre-trip assessment, you may not need to take ICBC's air brake pre-trip inspection test. A non-certified course: 7 hours of classroom theory only, at a licensed driver training school or college.","topic":"Air brake courses","id":"1-c15","chapter":1}],"questions":[{"q":"Which vehicles require the driver to hold an air brake endorsement to operate them on a highway?","choices":["Only semi-trailer trucks over 4,600 kg","Any vehicle with more than two axles","Vehicles equipped with air brakes (other than construction vehicles), and most vehicles with air-over-hydraulic brakes","Only buses and school buses"],"answerIndex":2,"explanation":"An air brake endorsement (code 15) is required to operate air-brake-equipped vehicles on a highway, except construction vehicles, and is also required for most vehicles with air-over-hydraulic brakes.","topic":"Air brake endorsement","page":5,"id":"1-q0","chapter":1},{"q":"Which licence class allows you to drive a school bus with a maximum seating capacity of 25 persons, including the driver?","choices":["Class 4 (unrestricted)","Class 4 (restricted)","Class 5","Class 3"],"answerIndex":0,"explanation":"A Class 4 unrestricted licence covers buses with a maximum seating capacity of 25 persons including the driver, including school buses. Class 4 restricted vehicles are limited to 10 persons, and Class 3 does not cover a bus transporting passengers.","topic":"Licence classes","page":4,"id":"1-q1","chapter":1},{"q":"Which licence allows you to tow a trailer equipped with air brakes that weighs over 4,600 kg?","choices":["Class 4 or 5 with a heavy trailer endorsement (code 20)","Class 1","Class 3","Class 2"],"answerIndex":1,"explanation":"Only Class 1 covers all combinations of vehicles. Class 2 and 3 trailers may exceed 4,600 kg only if the vehicles do not have air brakes, and the heavy trailer endorsement applies only when neither truck nor trailer has air brakes.","topic":"Licence classes","page":3,"id":"1-q2","chapter":1},{"q":"Which tests must you pass to get an air brake endorsement?","choices":["A knowledge test and a road test","A road test only","A knowledge test, pre-trip inspection test and road test","The air brake knowledge test and the air brake pre-trip inspection test — a road test is not required"],"answerIndex":3,"explanation":"For an air brake endorsement you take the air brake knowledge test and the air brake pre-trip inspection test; the manual states a road test is not required.","topic":"Air brake endorsement","page":6,"id":"1-q3","chapter":1},{"q":"How long are air brake knowledge test results valid?","choices":["Six months","One year","Two years","Three years"],"answerIndex":1,"explanation":"Air brake knowledge test results are only valid for one year — drivers who haven't had the endorsement placed on their licence within one year of passing must re-take the test.","topic":"Air brake endorsement","page":5,"id":"1-q4","chapter":1},{"q":"What happens if you fail to qualify on the air brake knowledge test after three attempts?","choices":["You must complete or repeat an approved 7-hour air brake training course","You must wait one year before testing again","You are permanently barred from an air brake endorsement","You must take a road test instead"],"answerIndex":0,"explanation":"An applicant who fails the air brake knowledge test after three attempts must complete or repeat an approved 7-hour air brake training course.","topic":"Air brake endorsement","page":5,"id":"1-q5","chapter":1},{"q":"What is the minimum age to apply for a Class 3 licence?","choices":["16","21","18","19"],"answerIndex":2,"explanation":"The minimum age for a Class 3 licence is 18. Class 1, 2 and 4 require a minimum age of 19.","topic":"Licence classes","page":3,"id":"1-q6","chapter":1},{"q":"What driving record must you show to qualify for a commercial driver's licence?","choices":["No penalty points at all in the previous five years","Fewer than two offences in the previous year","Zero Criminal Code convictions of any kind in the previous ten years","Fewer than four penalty-point offences in the previous two years and zero motor-vehicle-related Criminal Code convictions in the previous three years"],"answerIndex":3,"explanation":"An acceptable driving record shows fewer than four offences carrying penalty points in the previous two years and zero motor-vehicle-related Criminal Code convictions in the previous three years.","topic":"Applying for a licence","page":6,"id":"1-q7","chapter":1},{"q":"How long is a commercial learner's licence valid?","choices":["One year","Six months","Two years","Ninety days"],"answerIndex":0,"explanation":"The learner's licence is valid for one year and allows you to practise driving with a supervisor.","topic":"Learner's licence","page":7,"id":"1-q8","chapter":1},{"q":"Who may supervise you while you practise on a commercial learner's licence?","choices":["Anyone at least 25 years old with any full licence","A person at least 19 years old who holds the appropriate licence for the vehicle you're practising on","Any licensed driving instructor only","A person at least 18 years old with a Class 5 licence"],"answerIndex":1,"explanation":"The supervisor must be at least 19 years old and hold the appropriate licence for the vehicle — for example, a Class 1 licence if you're practising on a Class 1 tractor-trailer combination.","topic":"Learner's licence","page":7,"id":"1-q9","chapter":1},{"q":"Since when has MELT been required for all new Class 1 applicants in B.C.?","choices":["January 1, 2019","April 1, 2000","July 1, 2020","October 18, 2021"],"answerIndex":3,"explanation":"B.C.'s MELT program became a requirement for all new Class 1 applicants on October 18, 2021.","topic":"MELT","page":7,"id":"1-q10","chapter":1},{"q":"You move to B.C. holding a Canadian Class 1 licence with more than 24 consecutive months of Class 1 experience, not expired more than three years. What are your MELT requirements?","choices":["You must take the full B.C. MELT course","You must take only the air brake portion of MELT","You are not required to take MELT","You must pass two road tests before being exempted"],"answerIndex":2,"explanation":"Drivers with more than 24 consecutive months of Canadian Class 1 experience, whose licence has not been expired for more than three years, are not required to take MELT.","topic":"MELT","page":8,"id":"1-q11","chapter":1},{"q":"From which provinces does B.C. currently accept MELT courses?","choices":["Saskatchewan, Manitoba, Ontario and Alberta","All Canadian provinces and territories","Alberta and Ontario only","Quebec, Ontario and Alberta"],"answerIndex":0,"explanation":"B.C. currently accepts MELT courses from Saskatchewan, Manitoba, Ontario and Alberta.","topic":"MELT","page":8,"id":"1-q12","chapter":1},{"q":"In what language are the commercial licensing knowledge tests conducted?","choices":["English or French","Only in English, and you must complete them without assistance","Any language with an approved interpreter","English, French or Punjabi"],"answerIndex":1,"explanation":"All knowledge tests referred to in the guide are conducted only in English, and you must be able to complete them without assistance.","topic":"Knowledge tests","page":9,"id":"1-q13","chapter":1},{"q":"Approximately how long does a Class 1 road test take?","choices":["Thirty minutes","Four hours","One hour","About two hours"],"answerIndex":3,"explanation":"A Class 1 road test takes about two hours. Class 2, 3, 4 and heavy trailer endorsement road tests take less than two hours.","topic":"Road tests","page":10,"id":"1-q14","chapter":1},{"q":"When must you pay a fee for missing a scheduled road test?","choices":["Never — road test appointments can be missed without penalty","Any time you miss an appointment, regardless of notice","If you don't show up and don't provide either 48 hours notice or a valid reason for not attending","Only if you miss two appointments in a row"],"answerIndex":2,"explanation":"You'll have to pay a fee if you don't show up for your scheduled road test and don't provide either 48 hours notice or a valid reason for not attending.","topic":"Road tests","page":10,"id":"1-q15","chapter":1},{"q":"What happens if you take your Class 1, 2 or 3 road test in a vehicle with an automatic transmission?","choices":["Your licence will be restricted to automatic transmissions only","Nothing — the transmission type doesn't matter","You must take a second test in a manual vehicle within a year","You will fail the road test"],"answerIndex":0,"explanation":"If you take your Class 1, 2 or 3 road test using an automatic transmission, your licence will be restricted to automatic transmissions only.","topic":"Road tests","page":11,"id":"1-q16","chapter":1},{"q":"What are the minimum requirements for a Class 1 road test vehicle?","choices":["Any tractor-trailer combination, loaded or empty","A loaded tandem or tridem rear axle tractor-trailer combination with air brakes, on-road loaded weight of at least 28,000 kg, with a semi-trailer at least 13 metres long (7.5 metres if a pintle hitch trailer)","An empty tractor-trailer with air brakes at least 10 metres long","A loaded truck and trailer without air brakes weighing at least 4,600 kg"],"answerIndex":1,"explanation":"The Class 1 road test vehicle must be a loaded tandem or tridem rear axle tractor-trailer combination with air brakes, with an on-road loaded weight of at least 28,000 kg and a semi-trailer at least 13 metres long (7.5 metres if pintle hitch trailer).","topic":"Road test vehicles","page":12,"id":"1-q17","chapter":1},{"q":"For which road tests must you demonstrate coupling and uncoupling a tractor unit from a trailer?","choices":["All commercial road tests","Class 2 and Class 3 road tests","Class 4 unrestricted road tests","A Class 1 road test or heavy trailer endorsement (code 20)"],"answerIndex":3,"explanation":"Coupling and uncoupling a tractor unit from a trailer must be demonstrated on a Class 1 road test or for a heavy trailer endorsement (code 20).","topic":"Road tests","page":11,"id":"1-q18","chapter":1},{"q":"Once you reach age 66, how often must you submit a routine Driver's Medical Examination Report to keep a commercial licence?","choices":["Every year","Every three years","Every five years","Only when RoadSafetyBC suspects a problem"],"answerIndex":0,"explanation":"Medical report forms are sent at ages 25, 30, 35, 40, 45, then 48, 51, 54, 57, 60 and 63, and every year upon reaching the age of 66.","topic":"Keeping your licence","page":14,"id":"1-q19","chapter":1}]},"2":{"title":"heavy vehicle braking","cards":[{"front":"What is a brake, in terms of energy?","back":"A heat conversion machine that works exactly opposite to an engine. Brakes convert the energy of motion back into the energy of heat through friction between the brake drums or rotors and the brake linings or pads.","topic":"Braking principles","id":"2-c0","chapter":2},{"front":"What is the final factor in stopping (and moving) a vehicle?","back":"The contact between the vehicle and the road through the tires. Even though the energy of motion turns the wheels, the vehicle won't go anywhere unless there's traction between the tires and the road surface. Bald or defective tires may degrade braking performance.","topic":"Braking principles","id":"2-c1","chapter":2},{"front":"How is brake heat dissipated?","back":"The heat is absorbed and dissipated into the atmosphere, primarily through the brake drums/rotors.","topic":"Braking principles","id":"2-c2","chapter":2},{"front":"How much stopping force does a loaded tractor-trailer need for an emergency stop from 100 km/h?","back":"A combination weighing up to 63,500 kg might take over one kilometre and over one minute to accelerate to 100 km/h, but in an emergency might have to stop in as little as seven seconds — roughly 1/9 of that time. That requires a stopping force of nine times the acceleration force — the equivalent of approximately 4,000 hp.","topic":"Power to move and stop","id":"2-c3","chapter":2},{"front":"What happens if one or two brakes on a combination are out of adjustment?","back":"The other brakes have to do more than their share of the braking, resulting in a longer stopping distance. They may work harder than they're manufactured to, building up more heat than they can absorb and dissipate — too much heat can result in brake damage and possible failure.","topic":"Brake adjustment","id":"2-c4","chapter":2},{"front":"What makes up total stopping distance (or total stopping time)?","back":"Driver's perception time + reaction time + brake lag time + braking time. You see a hazard, think (decide to stop), then do (apply the brake).","topic":"Stopping distance","id":"2-c5","chapter":2},{"front":"How long are perception time, reaction time and air brake lag time?","back":"About 3/4 of a second of perception time (see-think), another 3/4 of a second of reaction time (do), and approximately 4/10 of a second of brake lag between when you apply the brake and when the air brakes begin to function.","topic":"Stopping distance","id":"2-c6","chapter":2},{"front":"What following distance should drivers of buses, trucks and other large heavy vehicles keep?","back":"Never less than five seconds behind the vehicle ahead at highway speeds. Stay even further back when conditions are less than ideal. (Passenger cars and light trucks use the two-second rule.)","topic":"Following distance","id":"2-c7","chapter":2},{"front":"How does doubling speed or weight affect the stopping power required?","back":"2 x vehicle speed requires 4 x the stopping power. 2 x vehicle weight requires 2 x the stopping power. 2 x speed and 2 x weight together require 8 x the stopping power.","topic":"Speed and weight","id":"2-c8","chapter":2},{"front":"How does the grade of the road affect stopping distance?","back":"A vehicle travelling down a hill needs a longer stopping distance than at the same speed on a level surface because of the effect of gravity. A vehicle travelling up a hill will stop in a shorter distance.","topic":"Speed and weight","id":"2-c9","chapter":2},{"front":"What temperatures can brake components handle?","back":"In normal stopping, brake components heat up to about 120 degrees C (almost 250 degrees F). They can handle up to about 250 degrees C under hard braking. Beyond that, heat can cause brake fade, brake damage and/or brake failure — components or tires may actually catch fire.","topic":"Brake heat","id":"2-c10","chapter":2},{"front":"What is brake fade and what causes it?","back":"Brake fade occurs when your brakes stop working properly because they're overheated — the vehicle takes longer to stop, or may not stop at all. As brake drums heat up they expand away from the brake linings. It's caused by excessive hard or frequent braking without enough cooling time — in other words, poor speed control.","topic":"Brake fade","id":"2-c11","chapter":2},{"front":"What are retarders and what are the four main types?","back":"Retarders provide auxiliary slowing of the vehicle, such as controlling speed on long downgrades without using the main braking system, saving the brakes for emergency stopping. The four main types: engine retarders, exhaust retarders, hydraulic driveline retarders and electric driveline retarders. Many can absorb as much or more horsepower than the engine can develop.","topic":"Retarders","id":"2-c12","chapter":2},{"front":"How should you use an engine retarder, and when should you be cautious?","back":"An engine retarder is more efficient at a higher engine r.p.m. and a lower vehicle speed, so select the right gear before you start down a hill. Be cautious on slippery road surfaces — some retarders can cause the drive wheels to lock up, stalling the engine, causing loss of control or even a tractor/trailer jackknife. Obey municipal signs restricting engine retarder use.","topic":"Retarders","id":"2-c13","chapter":2},{"front":"How do you brake on icy roads (without ABS)?","back":"Use extremely light pressure on the brake to control speed and help prevent the wheels from locking up. A slowly revolving wheel on an icy surface is more effective than a locked wheel skidding. You need snow tires and/or chains on icy roads; in extremely bad conditions, parking the vehicle may be safer than driving.","topic":"Icy roads","id":"2-c14","chapter":2},{"front":"What is the correct technique for descending a long downgrade?","back":"Select a safe speed for your vehicle's weight, length, steepness of grade, weather and road conditions. Be in a lower gear than you used to climb the hill, use the vehicle's retarding device, and never shift to a higher gear on a downgrade unless the speed can be controlled by a retarding device or engine compression. If speed still increases: apply the brakes hard enough to reduce speed by 10 to 15 km/h, then downshift to a lower main gear (don't use the splitter valve for shifting on a downhill). Keep the vehicle in gear all the way down.","topic":"Downgrades","id":"2-c15","chapter":2},{"front":"How do you handle water on the roadway?","back":"Water can reduce braking efficiency. Reduce speed before large pools of water, cover the brake pedal as you approach, and place a slight drag (slight constant pressure) on the brakes while driving through — this reduces the amount of water entering the brake drums and shoes. Afterwards, test the brakes with slight pedal pressure for a short distance to dry them out.","topic":"Water on roadways","id":"2-c16","chapter":2},{"front":"What are runaway lanes for?","back":"Runaway lanes are located beside the road on some downhill grades to help slow and stop vehicles if their brakes fail going downhill. Use them only to control your speed or stop — don't use them for any other purpose.","topic":"Runaway lanes","id":"2-c17","chapter":2},{"front":"What are the key facts about ABS on heavy vehicles?","back":"ABS is mandatory in Canada on all trucks and buses over 4,560 kg manufactured since April 1, 2000, and on all commercial trailers equipped with air brakes. It helps prevent wheel lockup or skids from overbraking on slippery surfaces and may help prevent jackknifing — but it doesn't let you drive faster or stop sooner, and on some surfaces such as gravel the braking distance may be longer. In an emergency: apply firm, hard continuous pressure and don't pump the brakes. If tractor and trailers don't all have ABS, brake as if the combination has no ABS.","topic":"ABS","id":"2-c18","chapter":2},{"front":"What is Automatic Traction Control (ATC)?","back":"An optional addition to an ABS system. Using the same wheel sensors as ABS, ATC senses if a drive wheel has lost traction and is spinning; it applies that wheel's brake, transferring power to the opposite side. In extremely slippery conditions it reduces engine power so the wheels can regain traction. Most ATC-equipped vehicles have a dashboard decal and a dash-mounted lamp that lights if wheel spin occurs.","topic":"ATC","id":"2-c19","chapter":2}],"questions":[{"q":"What is the final factor that determines whether a vehicle will move?","choices":["The horsepower of the engine","Traction between the tires and the road surface","The gear ratio of the transmission","The weight of the load"],"answerIndex":1,"explanation":"Even though the energy of motion turns the vehicle's wheels, the vehicle won't go anywhere unless there's traction between the tires and the road surface.","topic":"Braking principles","page":17,"id":"2-q0","chapter":2},{"q":"In terms of energy, what do brakes do?","choices":["Convert heat energy into the energy of motion","Store the energy of motion in the brake drums","Convert electrical energy into stopping force","Convert the energy of motion into the energy of heat through friction"],"answerIndex":3,"explanation":"A brake is a heat conversion machine that works exactly opposite to an engine — it converts the energy of motion back into heat through friction between the drums/rotors and the linings/pads.","topic":"Braking principles","page":17,"id":"2-q1","chapter":2},{"q":"How is brake heat dissipated?","choices":["It is absorbed and dissipated into the atmosphere, primarily through the brake drums/rotors","It is carried away by the brake fluid","It is absorbed by the tires","It is vented through the exhaust system"],"answerIndex":0,"explanation":"The heat created by braking is absorbed and dissipated into the atmosphere, primarily through the brake drums/rotors.","topic":"Braking principles","page":17,"id":"2-q2","chapter":2},{"q":"How much can a heavy tractor-trailer combination weigh when loaded?","choices":["Up to 28,000 kg","Up to 40,500 kg","Up to 63,500 kg","Up to 25,000 kg"],"answerIndex":2,"explanation":"A heavy tractor-trailer combination can weigh up to 63,500 kg when loaded.","topic":"Power to move and stop","page":18,"id":"2-q3","chapter":2},{"q":"Stopping a tractor-trailer combination from 100 km/h in an emergency (about seven seconds) requires a stopping force equivalent to approximately how much horsepower?","choices":["400 hp","4,000 hp","120 hp","1,000 hp"],"answerIndex":1,"explanation":"Stopping that quickly requires a stopping force of nine times the acceleration force — the equivalent of approximately 4,000 hp.","topic":"Power to move and stop","page":18,"id":"2-q4","chapter":2},{"q":"What happens when one or two brakes on a 16-brake tractor-trailer combination are out of adjustment?","choices":["The other brakes must do more than their share, resulting in a longer stopping distance and possible overheating","Nothing noticeable — 14 brakes are more than enough","The vehicle stops faster because the remaining brakes grip harder","Only the trailer's stopping ability is affected"],"answerIndex":0,"explanation":"If one or two brakes aren't correctly adjusted, the others have to do more than their share, resulting in a longer stopping distance and possible heat buildup, brake damage and failure.","topic":"Brake adjustment","page":18,"id":"2-q5","chapter":2},{"q":"What is an average driver's reaction time?","choices":["About 2 seconds","About 4/10 of a second","About 1/4 of a second","About 3/4 of a second"],"answerIndex":3,"explanation":"An average driver's reaction time is about 3/4 of a second — the time between recognizing a hazard ahead and applying the brakes.","topic":"Stopping distance","page":18,"id":"2-q6","chapter":2},{"q":"What makes up total stopping time for a vehicle with air brakes?","choices":["Reaction time plus braking time","Perception time plus braking time","Perception time + reaction time + brake lag time + braking time","Brake lag time plus braking time"],"answerIndex":2,"explanation":"Total stopping time (or distance) is the driver's perception time plus reaction time plus brake lag time plus braking time.","topic":"Stopping distance","page":19,"id":"2-q7","chapter":2},{"q":"What is brake lag time in an air brake system?","choices":["The approximately 4/10 of a second between when you apply the brake and when the brakes begin to function","The time it takes to recognize a hazard","The 3/4 of a second it takes to move your foot to the brake pedal","The time the vehicle travels after the brakes engage until it stops"],"answerIndex":0,"explanation":"Unlike a car's brakes, which begin to work almost instantly, air brakes have a brake lag time of approximately 4/10 of a second between application and when the brakes begin to function.","topic":"Stopping distance","page":19,"id":"2-q8","chapter":2},{"q":"At highway speeds, how far behind the vehicle ahead should drivers of buses, trucks and other large heavy vehicles stay?","choices":["At least two seconds","Never less than five seconds","At least three seconds","One vehicle length per 10 km/h"],"answerIndex":1,"explanation":"Drivers of buses, trucks and other large heavy vehicles should never be less than five seconds behind the vehicle ahead at highway speeds; the two-second rule is for passenger cars and light trucks.","topic":"Following distance","page":19,"id":"2-q9","chapter":2},{"q":"What is the most common air brake system defect found during a commercial vehicle inspection?","choices":["Leaking air lines","Worn brake linings","Brakes that are out of adjustment","A faulty compressor"],"answerIndex":2,"explanation":"The most common air brake system defect found during a commercial vehicle inspection is brakes that are out of adjustment.","topic":"Brake adjustment","page":19,"id":"2-q10","chapter":2},{"q":"If the speed of a vehicle is doubled, how much stopping power is required?","choices":["Two times the stopping power","Eight times the stopping power","The same stopping power","Four times the stopping power"],"answerIndex":3,"explanation":"Two times the vehicle speed requires four times the stopping power.","topic":"Speed and weight","page":20,"id":"2-q11","chapter":2},{"q":"If the weight of the vehicle is doubled, how many times must the stopping power be increased?","choices":["Two times","Four times","Eight times","It doesn't change"],"answerIndex":0,"explanation":"Two times the vehicle weight requires two times the stopping power.","topic":"Speed and weight","page":20,"id":"2-q12","chapter":2},{"q":"If both the speed and the weight of a vehicle are doubled, how much stopping power is required?","choices":["Four times the stopping power","Eight times the stopping power","Two times the stopping power","Six times the stopping power"],"answerIndex":1,"explanation":"Two times the vehicle speed and two times the vehicle weight together require eight times the stopping power.","topic":"Speed and weight","page":20,"id":"2-q13","chapter":2},{"q":"Compared to stopping on a level surface at the same speed, a vehicle travelling down a hill will need:","choices":["A shorter stopping distance","The same stopping distance","Less brake pressure","A longer stopping distance, because of the effect of gravity"],"answerIndex":3,"explanation":"A vehicle travelling down a hill needs a longer stopping distance than one travelling the same speed on a level surface because of the effect of gravity; travelling uphill it stops in a shorter distance.","topic":"Speed and weight","page":21,"id":"2-q14","chapter":2},{"q":"What temperature do brake components reach in normal stopping, and what is the most they should handle?","choices":["About 250 degrees C in normal stopping, up to 500 degrees C under hard braking","About 50 degrees C in normal stopping, up to 120 degrees C under hard braking","About 120 degrees C in normal stopping, up to about 250 degrees C under hard braking","About 100 degrees C in normal stopping, up to 200 degrees C under hard braking"],"answerIndex":2,"explanation":"In normal stopping, brake components heat up to about 120 degrees C (almost 250 degrees F) and can handle up to about 250 degrees C under hard braking.","topic":"Brake heat","page":21,"id":"2-q15","chapter":2},{"q":"What causes brake fade?","choices":["Overheated brakes — as brake drums heat up they expand away from the brake linings, so the brakes stop working properly","Water washing away the brake fluid","Cold brakes on a winter morning","Brake linings that are too new"],"answerIndex":0,"explanation":"Brake fade occurs when brakes stop working properly because they're overheated; as brake drums heat up, they expand away from the brake linings, so the vehicle takes longer to stop or may not stop at all.","topic":"Brake fade","page":21,"id":"2-q16","chapter":2},{"q":"What are the four main types of retarders?","choices":["Air, hydraulic, vacuum and electric retarders","Drum, disc, wedge and air retarders","Engine, exhaust, hydraulic driveline and electric driveline retarders","Compression, friction, magnetic and gravity retarders"],"answerIndex":2,"explanation":"The four main types of retarders are engine retarders, exhaust retarders, hydraulic driveline retarders and electric driveline retarders.","topic":"Retarders","page":22,"id":"2-q17","chapter":2},{"q":"When is an engine retarder most efficient?","choices":["At a low engine r.p.m. and a high vehicle speed","At a higher engine r.p.m. and a lower vehicle speed","Only when the vehicle is in its top gear","Only when the service brakes are applied at the same time"],"answerIndex":1,"explanation":"An engine retarder is more efficient at a higher engine r.p.m. and a lower vehicle speed, so it's important to select the right gear before you start down a hill.","topic":"Retarders","page":22,"id":"2-q18","chapter":2},{"q":"Why should you be cautious using retarders or engine brakes on slippery road surfaces?","choices":["They drain the air pressure from the brake system","They only work above 80 km/h","They can overheat the engine","Some can cause the drive wheels to lock up, stalling the engine, which can result in loss of control or a jackknife"],"answerIndex":3,"explanation":"On slippery surfaces, some retarders/engine brakes can cause the drive wheels to lock up, stalling the engine, resulting in loss of control or even causing a tractor/trailer to jackknife.","topic":"Retarders","page":22,"id":"2-q19","chapter":2},{"q":"How should you brake on icy roads in a vehicle without ABS?","choices":["Use extremely light pressure on the brake — a slowly revolving wheel is more effective than a locked wheel skidding","Apply firm, hard continuous pressure until the vehicle stops","Pump the brakes rapidly to break up the ice","Apply only the trailer brakes"],"answerIndex":0,"explanation":"On icy roads, use extremely light pressure on the brake to control speed and prevent wheel lockup; a slowly revolving wheel on ice is more effective than a locked wheel skidding.","topic":"Icy roads","page":23,"id":"2-q20","chapter":2},{"q":"If your speed keeps increasing on a downgrade despite engine compression and your retarding device, what should you do?","choices":["Shift to a higher gear to let the engine catch up","Apply the brakes hard enough to reduce speed by 10 to 15 km/h, then downshift to a lower main gear (don't use the splitter valve on a downhill)","Ride the brakes lightly all the way down the hill","Shift into neutral and use the service brakes only"],"answerIndex":1,"explanation":"If speed increases above your chosen speed, apply the brakes hard enough to reduce speed by 10 to 15 km/h while the brakes are cold, downshift to a lower main gear without using the splitter valve, and repeat if needed — keeping the vehicle in gear all the way down.","topic":"Downgrades","page":24,"id":"2-q21","chapter":2},{"q":"What should you do with the brakes when you must drive through a large amount of water on the roadway?","choices":["Pump the brakes rapidly while in the water","Avoid touching the brakes until you're through the water","Place a slight drag (slight constant pressure) on the brakes to reduce the amount of water entering the brake drums and shoes","Apply the parking brake lightly"],"answerIndex":2,"explanation":"Cover the brake pedal as you approach and place a slight drag on the brakes while driving through water — the slight drag reduces the amount of water entering the brake drums and shoes. Afterwards, dry the brakes with slight pedal pressure for a short distance.","topic":"Water on roadways","page":25,"id":"2-q22","chapter":2},{"q":"ABS is mandatory in Canada on which vehicles?","choices":["All commercial vehicles regardless of age or weight","Only tractor units manufactured since 2010","Trucks and buses over 4,600 kg manufactured since 1995","All trucks and buses over 4,560 kg manufactured since April 1, 2000, and all commercial trailers equipped with air brakes"],"answerIndex":3,"explanation":"ABS is mandatory in Canada on all trucks and buses over 4,560 kg manufactured since April 1, 2000 and on all commercial trailers equipped with air brakes.","topic":"ABS","page":25,"id":"2-q23","chapter":2},{"q":"What is the correct emergency stopping technique with ABS?","choices":["Apply firm, hard continuous pressure to the brake pedal until the vehicle stops — don't pump the brakes","Pump the brakes to keep the system engaged","Apply light pressure and release when you feel the pedal shudder","Apply the trailer brakes first, then the tractor brakes"],"answerIndex":0,"explanation":"With ABS, apply firm, hard continuous pressure until the vehicle stops; pumping the brakes turns the system on and off, and brake noise, pedal movement or shudder is normal.","topic":"ABS","page":26,"id":"2-q24","chapter":2},{"q":"On slippery roads, what can happen if you apply brake pressure too forcefully or apply only the trailer brakes of a combination vehicle?","choices":["The brakes will automatically release to protect the system","The trailer will slow smoothly while the tractor keeps its speed","The wheels may lock up, which can result in a skid or jackknife","Nothing, because all the brakes apply at the same time and pressure"],"answerIndex":2,"explanation":"Applying brake pressure too forcefully or only applying the trailer brakes on slippery roads may cause the wheels to lock up, which can result in a skid or jackknife — use extra caution when applying brakes in a curve.","topic":"Combination unit braking","page":25,"id":"2-q25","chapter":2},{"q":"With Automatic Traction Control (ATC), what happens when a drive wheel begins to spin on a slippery surface?","choices":["All of the drive wheels are locked until traction returns","The trailer brakes are applied to straighten the combination","Engine power is increased to force the wheel to grip","The system applies that wheel's brake, transferring power to the opposite side — and in extremely slippery conditions it reduces engine power so the wheels can regain traction"],"answerIndex":3,"explanation":"ATC uses the ABS wheel sensors to detect a spinning drive wheel; it applies that brake, transferring power to the opposite side, and in extremely slippery conditions reduces engine power to let the wheels regain traction.","topic":"ATC","page":27,"id":"2-q26","chapter":2}]},"3":{"title":"basic driving skills","cards":[{"front":"How do you apply the two-second rule to check your following distance?","back":"Watch the vehicle ahead pass a checkpoint (such as an overpass or sign post), then count \"one thousand and one, one thousand and two.\" If you reach the checkpoint before finishing the count, your following distance isn't enough — drop back, pick a new checkpoint and count again.","topic":"following distance","id":"3-c0","chapter":3},{"front":"What conditions affect driving and require you to increase your following distance beyond the ideal-conditions rule?","back":"Road conditions, vehicle conditions, your physical and mental condition, traffic conditions, lighting conditions and weather conditions.","topic":"following distance","id":"3-c1","chapter":3},{"front":"What are the risks of driving faster than the traffic flow?","back":"You can't maintain a safe following distance, you make more lane changes (each one a quick decision, increasing the chance of a wrong one), and you tire more quickly from tension and mental and physical fatigue.","topic":"traffic flow","id":"3-c2","chapter":3},{"front":"What is a good safety practice when driving slowly up or down a hill?","back":"Use your four-way flashers (some companies require this), and always use the right lane when travelling more slowly than other traffic where a passing lane is provided.","topic":"traffic flow","id":"3-c3","chapter":3},{"front":"How can you reduce the size of your danger zone?","back":"Slow down — the danger zone shrinks as speed is reduced — and cover the brake pedal with your foot any time you see a potential hazard developing, such as when approaching an intersection.","topic":"danger zones","id":"3-c4","chapter":3},{"front":"How do conventional, cab-over and forward-control vehicles differ?","back":"In a conventional design the driver's seat and steering wheel are behind the steering axle; in a cab-over design the seat is above the steering axle; in a forward-control design the seat is in front of the steering axle. Each changes your viewpoint and where you start your turn.","topic":"steering","id":"3-c5","chapter":3},{"front":"What is a vehicle's turning radius?","back":"When a vehicle turns a corner it travels on a curve; if it continued it would drive a complete circle. The distance from the centre of that imaginary circle to the vehicle's wheel is the turning radius. Rear tires have a different turning radius than front tires.","topic":"turning radius","id":"3-c6","chapter":3},{"front":"What is wheelbase, and how does it relate to off track?","back":"Wheelbase is the distance between the front wheels and the rear wheels of a vehicle. Vehicles with longer wheelbases have more off tracking than those with short wheelbases, and a combination vehicle usually has more off tracking than a single-unit vehicle.","topic":"off track","id":"3-c7","chapter":3},{"front":"What is inertia and how does it affect you in a curve?","back":"Inertia is the tendency of moving objects to continue moving forward in a straight line. The faster you're going and the heavier your vehicle, the more inertia pushes your vehicle away from the path of the curve.","topic":"curves","id":"3-c8","chapter":3},{"front":"What is traction, and what can happen if you brake in a curve you entered too fast?","back":"Traction is the grip created between a vehicle's tires and the road. If you enter a curve too quickly and try to slow down by braking, you may lose traction, causing your vehicle to skid, roll over or jackknife.","topic":"curves","id":"3-c9","chapter":3},{"front":"Where should you position your front wheels when curving to the left?","back":"Keep the front wheels close to the right edge of the lane to keep your driver's side rear wheels out of the next lane of traffic.","topic":"curves","id":"3-c10","chapter":3},{"front":"What are the risks of making a right turn with too small a turning arc?","back":"Off tracking may cause the trailer's back wheels to scrape the curb or leave the road, crowd cyclists on your right, run over curbs and sidewalks (damaging tires and seriously injuring pedestrians and cyclists), or hit a power pole, sign post or lamp standard.","topic":"right turns","id":"3-c11","chapter":3},{"front":"Why should you keep the rear of your vehicle close to the curb when turning right?","back":"It prevents other drivers from passing you on the right.","topic":"right turns","id":"3-c12","chapter":3},{"front":"What steering method is recommended when you need to do a lot of turning?","back":"The hand-over-hand method — pull on the right half of the wheel for right turns and the left half for left turns. Don't grasp the inside of the steering wheel; if it slips or jerks you may injure yourself. Always use both hands.","topic":"steering","id":"3-c13","chapter":3},{"front":"What are the four rules for driving through a traffic circle or roundabout?","back":"Slow down as you approach; yield to any traffic in the circle; if another vehicle arrives at the same time, yield to the vehicle on your right; go around the circle to the right (counter-clockwise).","topic":"roundabouts","id":"3-c14","chapter":3},{"front":"How do traffic circles differ from roundabouts?","back":"Roundabouts are generally larger than traffic circles but work the same way. Traffic circles are designed for residential streets where trucks and buses don't usually travel — if you're driving a large truck or bus through one, encroaching onto the median is okay to get through.","topic":"roundabouts","id":"3-c15","chapter":3},{"front":"What is a truck apron?","back":"Traffic circles and roundabouts often have a truck apron around the edge of the island in the middle. Large vehicles may need to drive over the apron in order to get through.","topic":"roundabouts","id":"3-c16","chapter":3},{"front":"When exiting a roundabout, what should you do with your signal?","back":"Signal \"right\" in advance of your exit location.","topic":"roundabouts","id":"3-c17","chapter":3},{"front":"List the tips for reducing your risk of a backing-up crash.","back":"Avoid backing up whenever possible; plan ahead to minimize the distance; be certain the area is clear; use a guide whenever possible (otherwise walk completely around the vehicle, repeating every vehicle length); sound your horn at least once every vehicle length; back out of traffic rather than into traffic.","topic":"backing up","id":"3-c18","chapter":3},{"front":"Where should you position a guide when backing up?","back":"Where the guide has a clear, continuous view of the backing path your vehicle will follow, and where you can see the guide throughout the manoeuvre.","topic":"backing up","id":"3-c19","chapter":3},{"front":"How does hood length affect a large vehicle's blind spots?","back":"There's an area immediately in front of the vehicle where you can't see anything — the longer the hood, the longer the blind spot. The high seat position can also hide a car or pedestrian alongside, particularly on the passenger side.","topic":"mirrors and blind spots","id":"3-c20","chapter":3},{"front":"Which lanes should you drive in on a freeway?","back":"The far right or centre lane, leaving the left lane for higher-speed traffic and passing vehicles. On a multi-lane divided highway, a right-hand lane is best.","topic":"lane use","id":"3-c21","chapter":3},{"front":"What are upshifting and downshifting, and when is each done?","back":"Upshifting is shifting to a higher gear, done when you want to go faster. Downshifting is shifting to a lower gear, done as you slow down. Both are performed with double-clutching, in slightly different ways.","topic":"shifting gears","id":"3-c22","chapter":3},{"front":"What is lugging?","back":"Lugging occurs when the engine is operated below peak torque for any length of time.","topic":"shifting gears","id":"3-c23","chapter":3},{"front":"Give an example of progressive shifting r.p.m. recommendations.","back":"The r.p.m. you shift at becomes higher as you select higher gears — for example, a manufacturer may recommend shifting from first to second gear at 1,200 r.p.m. and from fifth to sixth gear at 1,350 r.p.m.","topic":"shifting gears","id":"3-c24","chapter":3},{"front":"How should you respond when another driver wants to pass you?","back":"Help them pass safely: reduce your speed and give them room. But don't direct other drivers to pass — you may be encouraging a pass they can't complete safely.","topic":"passing","id":"3-c25","chapter":3},{"front":"What gear should the transmission be placed in when parking?","back":"Lowest forward gear if parked facing uphill, reverse gear if facing downhill, or park with an automatic transmission. If the vehicle has main and auxiliary transmissions, place both in gear; a two-speed axle must be in low range.","topic":"parking","id":"3-c26","chapter":3},{"front":"Which way do you turn the wheels when parking a tractor-trailer combination on an uphill?","back":"With or without a curb, always turn the wheels to the left towards the centre of the road. On a downgrade, any vehicle's wheels always turn right towards the edge of the roadway.","topic":"parking","id":"3-c27","chapter":3},{"front":"What makes a railway crossing a controlled crossing?","back":"A controlled crossing has a flag person, stop sign, crossing gate, or an electric or mechanical signalling device. All vehicles must stop at controlled crossings if signalled to do so, and you must never cross if a crossing gate is down.","topic":"railway crossings","id":"3-c28","chapter":3},{"front":"How close to a railway crossing may you park?","back":"Don't park any vehicle within 15 m of the nearest rail of a railway crossing.","topic":"railway crossings","id":"3-c29","chapter":3},{"front":"Why are humpback railway crossings dangerous for low-clearance vehicles?","back":"Low bed trailers may hang up on the crossing surface or the rails, and low-hanging trailer appliances such as dolly wheels and tool boxes may catch on the rail.","topic":"railway crossings","id":"3-c30","chapter":3},{"front":"Why can you overrun your headlights at night even at legal speed?","back":"Most headlights illuminate the highway for only 100 m on high beam and less on low beam, but a large, loaded truck travelling at 80 km/h can take more than 100 m to stop — further than your high beams let you see. Slow down so you can stop within the distance you can see.","topic":"night driving","id":"3-c31","chapter":3},{"front":"When and how should you check tire pressure?","back":"Check and adjust tire pressure when the tires are cool, using a tire pressure gauge. A tire with correct pressure when cool generates a normal amount of heat in use. Reducing pressure when warm may upset the cooling balance and cause more heat.","topic":"tires","id":"3-c32","chapter":3},{"front":"When is a tire defective under the tread-damage and tread-depth rules?","back":"Tread damage (cuts, cracks, snags) longer than 2.5 cm (1 in) and deep enough to expose the ply cords; less than 3 mm of tread on a front tire or 1.6 mm on a rear tire (vehicles with GVW of 5,500 kg or more); less than 1.6 mm on a trailer tire; less than 3.5 mm on a winter tire.","topic":"tires","id":"3-c33","chapter":3},{"front":"Can radial and bias-ply tires be mixed on a vehicle?","back":"They can be mixed on the same vehicle but not on the same axle (and mixing isn't a recommended practice). After changing a tire, stop after a short while and check the wheel nuts are tight — always use a torque wrench.","topic":"tires","id":"3-c34","chapter":3},{"front":"What braking systems must every motor vehicle have?","back":"At least two separate braking systems, one of which must be mechanical — for example a ratchet and pawl (notched wheel) or spring brake mechanism. If the foot (primary) brakes fail, the driver must use the emergency (mechanical) brake, which takes more time and distance to stop.","topic":"brakes","id":"3-c35","chapter":3},{"front":"Which flashing light colours are allowed on which vehicles?","back":"Red flashing lights only on emergency vehicles; blue only on police vehicles; amber on construction vehicles, towing vehicles, attending tow cars, snow-removal and sanding equipment, pilot cars, and vehicles required by permit to use them. A permit from Commercial Vehicle Safety and Enforcement is needed before mounting amber flashing lights.","topic":"flashing lights","id":"3-c36","chapter":3},{"front":"Which commercial vehicles must carry approved warning devices for use when disabled?","back":"All vehicles with a seating capacity of more than 10 passengers, all commercial vehicles with an overall width of more than 2.3 m, and all commercial vehicles with a load width of more than 2.3 m. Parked in the dark, they must put out a minimum of two warning devices.","topic":"disabled vehicles","id":"3-c37","chapter":3},{"front":"How far must you sit from the steering wheel airbag, and how should a head restraint be adjusted?","back":"Allow at least 25 cm (10 in) between your breastbone and the airbag unit. Adjust the head restraint so its top is at least as high as the top of your head and less than 10 cm from the back of your head.","topic":"personal safety","id":"3-c38","chapter":3},{"front":"What electronic devices may a non-GLP commercial driver use while driving?","back":"Hands-free cellphones and devices that require touching only a single button (in a fixed and secure location) to activate or deactivate, pre-programmed or voice-activated GPS, two-way radios and mobile data terminals. Calling 9-1-1 to report an emergency is exempt from the restrictions.","topic":"cellphones","id":"3-c39","chapter":3},{"front":"What can B.C.'s drinking and driving penalties cost you, even for a first offence?","back":"Penalties can add up to $600 to over $4,000 even the first time you're caught, plus time off the road. A Criminal Code conviction for driving while impaired, with a BAC over .08, or for refusing to provide a sample brings a fine of $1,000 and up, driving prohibitions and possible jail — with penalties becoming more severe for repeat offences.","topic":"impaired driving","id":"3-c40","chapter":3},{"front":"What should you do about fatigue on long trips?","back":"There's no safe substitute for proper rest or sleep — stay-awake tablets don't reduce mental fatigue. If you rely on stimulants like coffee or have trouble sleeping, pull over in a safe location and sleep. Follow the National Safety Code hours of service regulations and get enough sleep every 24 hours.","topic":"fatigue","id":"3-c41","chapter":3},{"front":"What fire precautions apply when refuelling?","back":"Shut off the engine, keep the fuel hose nozzle in contact with the filler pipe at all times to ground the connection (connect the ground strap if there is one), and don't smoke in garages or near fuelling areas.","topic":"fire","id":"3-c42","chapter":3},{"front":"How do you fight a fire under the hood, and why can't you use water on gasoline or oil fires?","back":"Direct the extinguisher from underneath the vehicle or through the radiator — don't open the hood. Water spreads gasoline and oil fires; use an appropriate extinguisher, sand or dirt to smother them. Fight fires with the wind at your back and keep some extinguishing fuel in reserve for flare-ups.","topic":"fire","id":"3-c43","chapter":3},{"front":"How should you adjust your driving for ice, sleet or snow?","back":"Get the feel of the road when you start out — at a slow speed, test the steering and brakes for control. Reduce speed to suit conditions and put on chains if necessary. Apply light pressure to the brake and avoid quick or erratic steering movements. Keep windows clear inside and out, and stay alert for hazards like ice patches, bridge surfaces, snow plows and graders.","topic":"weather","id":"3-c44","chapter":3},{"front":"With disk wheels, what problems mean you must not drive the vehicle?","back":"Loose or missing lug nuts, stripped studs, or cracks in the rim. Also investigate metal or paint flakes around the nuts (may indicate wheel movement) and oil or grease leaks from the hub. Rust streaks on the rim may indicate a loose lug nut or cracks in the rim.","topic":"wheels","id":"3-c45","chapter":3},{"front":"What should a driver do before entering a narrow bridge from a curved approach?","back":"Be familiar with the amount of off track your vehicle displays, and use that information to adjust your speed and approach to the curve so you can enter the bridge safely.","topic":"curves","id":"3-c46","chapter":3},{"front":"What precautions apply when you can't make a right turn without swinging into another lane?","back":"You may need to turn wide as you complete the turn. If you must cross into the oncoming lane, watch for vehicles coming toward you and give them room to pass by or stop. Don't back up for them — you might hit someone behind you. It's your responsibility to be certain you can move safely.","topic":"right turns","id":"3-c47","chapter":3},{"front":"What are the two main categories of fire extinguishers?","back":"Multi-purpose dry chemical extinguishers and carbon dioxide (CO2) extinguishers. Dry chemical extinguishers are easier and safer to use, but CO2 extinguishers are more effective — though CO2 must never be used in an enclosed space.","topic":"fire extinguishers","id":"3-c48","chapter":3}],"questions":[{"q":"Which vehicles should use the two-second rule for following distance?","choices":["Buses, trucks and truck-tractors with semi-trailers","Taxis, limousines, ride-hailing vehicles, ambulances and vans","Only motorcycles and passenger cars","Vehicles carrying dangerous goods"],"answerIndex":1,"explanation":"Drivers of passenger cars and light trucks — including taxis, limousines, ride-hailing vehicles, ambulances and vans — should use the two-second rule. Heavy vehicles need at least five seconds.","topic":"following distance","page":30,"id":"3-q0","chapter":3},{"q":"What minimum following distance should you keep when driving a bus, truck or other heavy vehicle?","choices":["Two seconds","Three seconds","Four seconds","Five seconds"],"answerIndex":3,"explanation":"Heavy vehicles need more time and distance to stop, so keep at least a five-second following distance, and increase it when conditions are less than ideal.","topic":"following distance","page":30,"id":"3-q1","chapter":3},{"q":"When driving a large commercial vehicle on a highway, how much space should you leave between your vehicle and other large commercial vehicles?","choices":["At least 60 m (200 ft)","At least 30 m (100 ft)","At least 15 m (50 ft)","At least 100 m (330 ft)"],"answerIndex":0,"explanation":"The guide says to leave at least 60 m (200 ft) between your vehicle and other large commercial vehicles on a highway.","topic":"following distance","page":31,"id":"3-q2","chapter":3},{"q":"Which vehicles should display a red triangle slow moving vehicle sign?","choices":["Any vehicle parked at the roadside","Vehicles, machinery or combinations that travel at less than 40 km/h","All commercial vehicles over 5,500 kg GVW","Vehicles that travel at less than 60 km/h"],"answerIndex":1,"explanation":"Vehicles, machinery or combinations of vehicles that travel at less than 40 km/h should display the sign. It must not go on stationary objects or on vehicles travelling faster than 40 km/h.","topic":"traffic flow","page":31,"id":"3-q3","chapter":3},{"q":"What is the best way to deal with a tailgater?","choices":["Brake sharply to warn them off","Speed up to increase the gap","Allow them to pass, and make your stops gradual","Turn on your four-way flashers and stop"],"answerIndex":2,"explanation":"Tailgaters are easiest to deal with when they're in front of you, so allow them to pass. Gradual stops reduce the impact if a rear-end collision can't be prevented.","topic":"tailgaters","page":31,"id":"3-q4","chapter":3},{"q":"What is a vehicle's danger zone?","choices":["The blind spot directly behind the vehicle","The area of air turbulence around the vehicle","The space other drivers should leave when passing","The section of road the vehicle travels through before it can stop"],"answerIndex":3,"explanation":"The danger zone is the section of road a vehicle travels through before it can stop — it's physically impossible to stop in time to avoid a collision with anything in it. It grows with speed and poor road conditions.","topic":"danger zones","page":32,"id":"3-q5","chapter":3},{"q":"What should you do as soon as you see a potential hazard in your danger zone?","choices":["Remove your foot from the accelerator and put it lightly on the brake pedal","Sound your horn and change lanes","Apply the brakes hard immediately","Downshift to a lower gear"],"answerIndex":0,"explanation":"Covering the brake reduces your reaction time and slows your speed, helping you apply the brakes sooner and giving you a better chance of stopping before the crosswalk.","topic":"danger zones","page":32,"id":"3-q6","chapter":3},{"q":"In a turn, how does the wheel on the inside of the curve behave compared to the outside wheel?","choices":["It turns less sharply and has a longer turning radius","It pivots more sharply and has a shorter turning radius","It follows exactly the same path as the outside wheel","It lifts slightly off the road surface"],"answerIndex":1,"explanation":"The wheel on the inside of the curve must pivot more sharply to travel on the shorter radius than the wheel on the outside of the turn.","topic":"turning radius","page":33,"id":"3-q7","chapter":3},{"q":"What is \"off track\"?","choices":["The tendency of a vehicle to continue in a straight line in a curve","The sideways slide of a trailer during hard braking","The difference between the path of the front wheels and the path of the rear wheels","The distance a vehicle travels after the brakes are applied"],"answerIndex":2,"explanation":"When a vehicle moves around a curve, the rear wheels follow a different path than the front wheels; that difference is called off track.","topic":"off track","page":34,"id":"3-q8","chapter":3},{"q":"Which of the following increases the amount of off track?","choices":["A shorter wheelbase","Mounting the fifth wheel farther forward","A shorter draw bar","A longer wheelbase, longer draw bar or a fifth wheel mounted farther back"],"answerIndex":3,"explanation":"The longer the wheelbase, and the longer the draw bar or the farther back the fifth wheel is mounted, the greater the amount of off track.","topic":"off track","page":35,"id":"3-q9","chapter":3},{"q":"When curving to the right, where should you keep your front wheels?","choices":["Close to the centre line","Close to the right edge of the pavement","In the middle of your lane","On the pavement shoulder"],"answerIndex":0,"explanation":"Keeping the front wheels close to the centre line prevents your rear wheels from dropping off the pavement or going onto the shoulder.","topic":"curves","page":36,"id":"3-q10","chapter":3},{"q":"How should you handle your speed in a curve?","choices":["Brake steadily all the way through the curve","Reduce speed before entering, then apply gradual power in the curve","Accelerate into the curve to maintain traction","Coast through the curve in neutral"],"answerIndex":1,"explanation":"Enter each curve at a speed that doesn't require braking and allows you to apply gradual power in the curve. Braking in a curve can cause a skid, rollover or jackknife.","topic":"curves","page":36,"id":"3-q11","chapter":3},{"q":"What is the most dangerous point in a right turn with a tractor and semi-trailer?","choices":["Just before you start turning the steering wheel","When the trailer has finished the turn but the tractor hasn't","When both units are straight in the new lane","When the tractor has made the turn but the trailer hasn't"],"answerIndex":3,"explanation":"At that point the right rear-view mirror is turned so that it's almost useless, so you can't see smaller vehicles, cyclists or pedestrians on your right side.","topic":"right turns","page":38,"id":"3-q12","chapter":3},{"q":"When making a sharp right turn with a forward-control vehicle such as a bus, how far from the curb should you position the vehicle on the approach?","choices":["As close to the curb as possible","Three to four metres","One to two metres","At least five metres"],"answerIndex":2,"explanation":"Position the vehicle one to two metres from the curb, drive straight until the side street's curb line is visible through the front entrance door, then enter the turn at a low speed.","topic":"right turns","page":38,"id":"3-q13","chapter":3},{"q":"If there are two left-turning lanes, which one should you turn from in a large commercial vehicle?","choices":["The right-hand turn lane","The left-hand turn lane","Either lane, whichever is empty","Neither — large vehicles must turn right instead"],"answerIndex":0,"explanation":"The right-hand turn lane will better accommodate your vehicle's off tracking.","topic":"left turns","page":40,"id":"3-q14","chapter":3},{"q":"If another vehicle arrives at a traffic circle at the same time as you, what should you do?","choices":["Proceed first because you're the larger vehicle","Yield to the vehicle on your right","Yield to the vehicle on your left","Both vehicles stop and wait for a signal"],"answerIndex":1,"explanation":"Yield to any traffic already in the circle, and if another vehicle arrives at the same time as you, yield to the vehicle on your right.","topic":"roundabouts","page":40,"id":"3-q15","chapter":3},{"q":"Is it acceptable to drive onto the median when taking a large truck or bus through a traffic circle?","choices":["No, encroaching on the median is always illegal","Only when escorted by a pilot car","Yes, encroaching onto the median is okay to get through","Only at night when traffic is light"],"answerIndex":2,"explanation":"Traffic circles are designed for residential streets where trucks and buses don't usually travel, so encroaching onto the median is okay for a large truck or bus to get through.","topic":"roundabouts","page":40,"id":"3-q16","chapter":3},{"q":"Why might a large commercial vehicle need to take up more than one lane in a multi-lane roundabout?","choices":["To block other vehicles from passing","Because roundabout lanes are reserved for trucks","To exit without signalling","Because of the vehicle's off track"],"answerIndex":3,"explanation":"Due to the vehicle's off track you may need to take up more than one lane, so make sure there are no vehicles in the lane beside you.","topic":"roundabouts","page":41,"id":"3-q17","chapter":3},{"q":"What causes most crashes that involve a backing-up
