 vehicle?","choices":["Drivers who didn't see something they should have","Mechanical failure of the brakes","Guides giving wrong directions","Backing up too slowly"],"answerIndex":0,"explanation":"Most backing-up crashes are caused by drivers who didn't see something they should've, which is why you must make certain the way is clear — checking several times if necessary.","topic":"backing up","page":41,"id":"3-q18","chapter":3},{"q":"If you must back up without a guide, what should you do before starting?","choices":["Rely on your convex mirrors to check behind","Get out and walk completely around the vehicle, repeating every vehicle length","Back up quickly to minimize time in reverse","Turn on your four-way flashers and reverse in one long move"],"answerIndex":1,"explanation":"Walk completely around the vehicle before backing and repeat this every vehicle length. Sound your horn at least once every vehicle length, and prefer a series of short backing manoeuvres over one long one.","topic":"backing up","page":42,"id":"3-q19","chapter":3},{"q":"When choosing how to approach a loading area, which is the safer practice?","choices":["Drive straight in so you can back into traffic when leaving","Back into the blind side to save time","Back out of traffic into the area, so you can drive forward to leave","Park parallel to traffic and back across both lanes"],"answerIndex":2,"explanation":"It's easier and safer to back out of traffic than into traffic, and to back into the view side rather than the blind side, so you can see the area you're backing into.","topic":"backing up","page":42,"id":"3-q20","chapter":3},{"q":"How do convex or spot mirrors affect what you see?","choices":["They make things look larger and closer than they are","They show the true size and distance of objects","They only work at night","They make things look smaller and farther away than they actually are"],"answerIndex":3,"explanation":"Convex or spot mirrors make things look smaller and farther away than they actually are.","topic":"mirrors and blind spots","page":45,"id":"3-q21","chapter":3},{"q":"What must you do when an emergency vehicle approaches using flashing red or blue lights and a siren?","choices":["Drive parallel to and as close as possible to the nearest edge or curb, stop clear of any intersection, and remain stopped until it has passed","Speed up and clear the area as quickly as possible","Stop immediately wherever you are, including in the intersection","Slow to 40 km/h and continue driving"],"answerIndex":0,"explanation":"Yield the right-of-way by pulling to the nearest edge, stopping clear of any intersection, and staying stopped until the emergency vehicle passes. Don't assume there's only one emergency vehicle.","topic":"emergency vehicles","page":46,"id":"3-q22","chapter":3},{"q":"You're approaching a stopped vehicle displaying flashing lights on a road where the speed limit is 80 km/h or more. What is your maximum speed?","choices":["40 km/h","70 km/h","60 km/h","80 km/h"],"answerIndex":1,"explanation":"You must drive no faster than 70 km/h if the speed limit is 80 km/h or more, and no faster than 40 km/h if the speed limit is less than 80 km/h.","topic":"stopped vehicles with flashing lights","page":46,"id":"3-q23","chapter":3},{"q":"You're in the lane nearest a stopped vehicle displaying flashing lights. Besides slowing down, what must you do?","choices":["Sound your horn as you pass","Stop completely until the vehicle leaves","Change lanes to provide safe space margins, if it is safe to do so","Turn on your high beams"],"answerIndex":2,"explanation":"If you're in the lane nearest the stopped vehicle, you must also change lanes to provide safe space margins if it's safe. Failing to slow down and/or change lanes may result in a traffic violation and penalty points.","topic":"stopped vehicles with flashing lights","page":46,"id":"3-q24","chapter":3},{"q":"What is double-clutching?","choices":["Using two clutch pedals in a heavy vehicle","Riding the clutch while braking","Skipping gears to accelerate faster","Depressing the clutch pedal twice in the process of moving from one gear to another"],"answerIndex":3,"explanation":"Double-clutching means depressing the clutch pedal twice while moving between gears. It's essential because most heavy vehicles with manual transmissions don't have synchromesh gears.","topic":"shifting gears","page":47,"id":"3-q25","chapter":3},{"q":"What is the normal operating r.p.m. range of an engine?","choices":["Between the engine's peak torque and peak horsepower","Between idle and peak torque","Above peak horsepower","Whatever range the governor prevents"],"answerIndex":0,"explanation":"The vehicle should be operated between the engine's peak torque and peak horsepower — peak torque is found at a lower engine speed than peak horsepower.","topic":"shifting gears","page":47,"id":"3-q26","chapter":3},{"q":"What does an engine governor do?","choices":["Increases horsepower at high altitude","Controls the amount of fuel going to the engine and regulates engine speed","Automatically shifts the transmission","Disengages the clutch during braking"],"answerIndex":1,"explanation":"A governor controls the fuel going to the engine and regulates engine speed, and it lets you start a vehicle on level ground and on grades without using the throttle. Small vehicles don't have governors.","topic":"shifting gears","page":48,"id":"3-q27","chapter":3},{"q":"A small vehicle keeps riding in your truck's area of air turbulence. What should you do?","choices":["Speed up to move away from it","Sound your horn until it moves","Slow down until it's out of the turbulence area","Change lanes toward it to warn the driver"],"answerIndex":2,"explanation":"Air turbulence from a large vehicle can force smaller road users off a narrow roadway or draw them into the side of your vehicle — and can cause cyclists to lose control — so slow down until they're out of it.","topic":"passing","page":49,"id":"3-q28","chapter":3},{"q":"When parking a single-unit vehicle facing uphill where there is a curb, which way should you turn the wheels?","choices":["Straight ahead","To the right, towards the edge of the roadway","It doesn't matter if the parking brake is set","To the left, towards the centre of the road"],"answerIndex":3,"explanation":"A single-unit vehicle parked uphill with a curb should have its wheels turned left towards the centre of the road; uphill with no curb, turn them right towards the edge.","topic":"parking","page":50,"id":"3-q29","chapter":3},{"q":"When parking any vehicle on a downgrade, which way should the wheels be turned?","choices":["Always to the right, towards the edge of the roadway","Always to the left, towards the centre of the road","Left with a curb, right without a curb","Wheels should stay straight on a downgrade"],"answerIndex":0,"explanation":"On a downgrade, always turn the wheels to the right towards the edge of the roadway, and block the wheels of any large vehicle parked on even a slight grade.","topic":"parking","page":51,"id":"3-q30","chapter":3},{"q":"Why should you never use a trailer hand valve to hold an unattended unit?","choices":["It wears out the brake linings","Over time the air may drain away and the brakes may release","It locks only the tractor brakes","It causes the spring brakes to overheat"],"answerIndex":1,"explanation":"Air pressure may bleed down over time, causing the brakes to release and the vehicle to run away. If a trailer has no spring brakes, apply the trailer brakes and block the wheels.","topic":"parking","page":50,"id":"3-q31","chapter":3},{"q":"What is a \"stale\" green light?","choices":["A light that has just turned green","A green light that is malfunctioning","A light that's been the same colour for some time and could change before you reach the intersection","A flashing green light at a pedestrian crossing"],"answerIndex":2,"explanation":"A stale light has been the same colour for some time, meaning it could change before you reach the intersection — be prepared to stop.","topic":"intersections","page":45,"id":"3-q32","chapter":3},{"q":"What is the maximum speed in a lane or alley unless otherwise posted?","choices":["30 km/h","40 km/h","50 km/h","20 km/h"],"answerIndex":3,"explanation":"The maximum speed in a lane or alley is 20 km/h unless otherwise posted. When driving from an alley onto a highway, stop before crossing the sidewalk and yield to pedestrians and vehicles.","topic":"intersections","page":52,"id":"3-q33","chapter":3},{"q":"How far from a railway crossing should you stop when required to stop?","choices":["Five to 15 m from the crossing","One to three metres from the crossing","20 to 30 m from the crossing","Immediately at the nearest rail"],"answerIndex":0,"explanation":"Stop five to 15 m from the crossing, look both ways and listen (opening your window or bus door helps you hear), then move forward when safe without shifting gears while crossing.","topic":"railway crossings","page":53,"id":"3-q34","chapter":3},{"q":"Which of the following vehicles is required to stop at all uncontrolled main railway crossings?","choices":["All commercial vehicles over 5,500 kg GVW","A vehicle transporting liquefied petroleum gas, whether empty or loaded","Any vehicle towing a trailer","All vehicles displaying amber flashing lights"],"answerIndex":1,"explanation":"School buses carrying children, buses carrying passengers, vehicles transporting explosive, poisonous or flammable substances, and vehicles used to transport combustibles, corrosive liquids or liquefied petroleum gas (empty or loaded) must stop at all uncontrolled main railway crossings.","topic":"railway crossings","page":53,"id":"3-q35","chapter":3},{"q":"Before crossing a railway line, how much time should the clear track give you to cross?","choices":["At least 5 seconds","At least 30 seconds","At least 10 seconds — more if your vehicle requires it or you're crossing more than one track","At least 60 seconds"],"answerIndex":2,"explanation":"Check that the track is clear far enough to give you at least 10 seconds to cross — more if your vehicle requires it or if you're crossing more than one track at a time.","topic":"railway crossings","page":53,"id":"3-q36","chapter":3},{"q":"What must you avoid doing while driving across railway tracks?","choices":["Using your four-way flashers","Looking both ways","Sounding your horn","Shifting gears"],"answerIndex":3,"explanation":"You must not shift gears while crossing railroad tracks, and before starting across, be certain there's room for your vehicle on the other side — stopping on the tracks is extremely dangerous.","topic":"railway crossings","page":53,"id":"3-q37","chapter":3},{"q":"A large animal is directly ahead and you can't stop in time. What does the guide recommend?","choices":["Brake firmly, steer to strike the animal at an angle, and let up on the brake just before hitting it","Slam on the brakes and hold them to the point of impact","Swerve sharply into the oncoming lane","Accelerate to push the animal clear"],"answerIndex":0,"explanation":"Braking firmly and steering to strike at an angle, then letting up on the brake just before impact, causes the front of your vehicle to rise and reduces the chance the animal will come through the windshield.","topic":"animals","page":55,"id":"3-q38","chapter":3},{"q":"At night, how far before meeting or following another vehicle must you switch from high beam to low beam?","choices":["At least 60 m away","At least 150 m away","At least 100 m away","At least 300 m away"],"answerIndex":1,"explanation":"Switch from high beam to low beam at least 150 m away from any vehicle you're approaching or following to reduce glare on other drivers' eyes.","topic":"night driving","page":56,"id":"3-q39","chapter":3},{"q":"What is a major cause of failure in recapped (retread) tires?","choices":["Overinflation","Driving in cold weather","Underinflation","Using a torque wrench on the wheel nuts"],"answerIndex":2,"explanation":"Underinflation is a major cause of recapped tire failure — underinflated tires flex more, and more flexing means more heat, risking tire damage or a blowout.","topic":"tires","page":57,"id":"3-q40","chapter":3},{"q":"Where does an overinflated tire show excess wear?","choices":["On the outer edges of the tread","On the sidewalls","Evenly across the whole tread","In the centre part of the tread"],"answerIndex":3,"explanation":"Overinflation causes excess wear in the centre of the tread and reduces tread contact with the road, which means less traction. Underinflation wears the outer edges and increases the chance of hydroplaning.","topic":"tires","page":57,"id":"3-q41","chapter":3},{"q":"On a vehicle with a GVW of 5,500 kg or more, a front tire is defective when its tread depth is less than:","choices":["3 mm (1/8 in)","1.6 mm (1/16 in)","3.5 mm (3/16 in)","2.5 cm (1 in)"],"answerIndex":0,"explanation":"A tire is defective with less than 3 mm (1/8 in) of tread on a front tire or 1.6 mm (1/16 in) on a rear tire when used on a vehicle with a GVW of 5,500 kg or more.","topic":"tires","page":58,"id":"3-q42","chapter":3},{"q":"What must all vehicles using air or vacuum brakes be equipped with?","choices":["Automatic traction control","Warning devices that alert the driver if the air-pressure or vacuum system fails","A secondary hydraulic braking circuit","An engine retarder"],"answerIndex":1,"explanation":"All vehicles using air or vacuum brakes must have warning devices to warn the driver of an air-pressure or vacuum system failure.","topic":"brakes","page":59,"id":"3-q43","chapter":3},{"q":"If your commercial vehicle becomes disabled at the roadside, where should you place your warning devices?","choices":["10 m ahead and 10 m behind the vehicle","Only directly behind the vehicle","Approximately 30 m ahead and 30 m behind the vehicle","50 m behind the vehicle only"],"answerIndex":2,"explanation":"Move the vehicle as far off the travelled portion of the highway as possible and place warning devices approximately 30 m ahead and 30 m behind it — placing additional devices even further away is good practice.","topic":"disabled vehicles","page":60,"id":"3-q44","chapter":3},{"q":"By how much does correct use of a lap and shoulder belt system reduce the likelihood of death in a crash?","choices":["25 per cent","10 per cent","90 per cent","50 per cent"],"answerIndex":3,"explanation":"It's estimated that correct use of a lap and shoulder belt system reduces the likelihood of death in a motor vehicle crash by 50 per cent.","topic":"seatbelts","page":61,"id":"3-q45","chapter":3},{"q":"Why is carbon monoxide especially dangerous to drivers?","choices":["It's odourless, colourless, tasteless and difficult to detect","It has a strong smell that causes distraction","It only forms in diesel engines","It makes the engine overheat"],"answerIndex":0,"explanation":"Carbon monoxide is odourless, colourless, tasteless and difficult to detect, and it's in the exhaust of every motor vehicle. It can make you dizzy or drowsy, cause you to pass out, and kill you.","topic":"personal safety","page":61,"id":"3-q46","chapter":3},{"q":"Which drivers are restricted from using even hands-free electronic devices while driving?","choices":["All commercial drivers","Drivers in B.C.'s Graduated Licensing Program (GLP)","Drivers over 65 years of age","Drivers of vehicles with air brakes"],"answerIndex":1,"explanation":"All B.C. drivers are prohibited from using hand-held electronic devices while driving, and GLP drivers are also restricted from operating hands-free devices. Calling 9-1-1 to report an emergency is the exception.","topic":"cellphones","page":62,"id":"3-q47","chapter":3},{"q":"For how long can police immediately impound a vehicle whose driver is caught excessive speeding or driving while prohibited?","choices":["24 hours","Three days","Seven days, which could escalate to 30 or 60 days for repeat offenders","90 days for a first offence"],"answerIndex":2,"explanation":"Police can immediately impound the vehicle for seven days, escalating to 30 or 60 days for repeat offenders. The owner must pay the towing and storage fees to get the vehicle back.","topic":"impaired driving","page":64,"id":"3-q48","chapter":3},{"q":"Excessive speeding, an offence that can lead to vehicle impoundment, means driving:","choices":["10 km/h or more over the posted limit","20 km/h or more over the posted limit","30 km/h or more over the posted limit","40 km/h or more over the posted limit"],"answerIndex":3,"explanation":"Excessive speeding is 40 km/h or more over the posted limit. Impoundment also applies to driving while unlicensed, suspended or prohibited, and street racing or stunt driving.","topic":"impaired driving","page":64,"id":"3-q49","chapter":3},{"q":"Why should a CO2 fire extinguisher never be used in an enclosed space?","choices":["You could smother yourself, and it could blister your skin","It's ineffective on any fire indoors","It produces toxic smoke when discharged","It can explode in confined areas"],"answerIndex":0,"explanation":"CO2 extinguishers are extremely effective, but in a confined space you could smother yourself, and the discharge could also blister your skin.","topic":"fire extinguishers","page":66,"id":"3-q50","chapter":3},{"q":"A dry chemical fire extinguisher cylinder marked \"BC\" can put out which fires?","choices":["Only paper and cloth fires","Grease, oil, gasoline and electrical fires","Only fires in enclosed spaces","Any fire, including burning metals"],"answerIndex":1,"explanation":"A BC-marked extinguisher handles grease, oil, gasoline and electrical fires; an ABC-marked extinguisher will also put out Class A fires such as paper and cloth.","topic":"fire extinguishers","page":66,"id":"3-q51","chapter":3},{"q":"How many fire extinguishers must a vehicle transporting explosives carry?","choices":["None, if it carries flares instead","One","Two","Four"],"answerIndex":2,"explanation":"Vehicles transporting explosives must carry two fire extinguishers.","topic":"fire extinguishers","page":67,"id":"3-q52","chapter":3},{"q":"Which of the following vehicles must carry one fire extinguisher?","choices":["All commercial vehicles wider than 2.3 m","All vehicles equipped with air brakes","All vehicles that transport combustible liquids only","All school buses, with extinguishers meeting CSA Standard D250"],"answerIndex":3,"explanation":"One fire extinguisher must be carried on limited passenger vehicles with an authorized seating capacity of more than 10, all public passenger vehicles, and all school buses (meeting CSA Standard D250).","topic":"fire extinguishers","page":67,"id":"3-q53","chapter":3}]},"4":{"title":"fuel-efficient driving","cards":[{"front":"By how much can fuel-efficient driving techniques improve fuel economy?","back":"By up to 30 per cent. Fuel-efficient driving is also safe driving — looking ahead, keeping good space margins and anticipating hazards helps you avoid sudden stops and changes in speed.","topic":"smart driving","id":"4-c0","chapter":4},{"front":"What makes a route fuel efficient?","back":"The most fuel-efficient route is often one that avoids heavy commuter traffic, busy city driving and hills. Flat routes are more fuel efficient than mountainous routes, and highway driving is more fuel efficient than congested city streets.","topic":"route planning","id":"4-c1","chapter":4},{"front":"How long should you let a heavy-duty diesel engine warm up after starting?","back":"Three to five minutes only, or seven to 10 minutes if the temperature is below 0 C. Use zero throttle and don't pump the throttle — idling longer wastes fuel and can cause engine damage.","topic":"starting","id":"4-c2","chapter":4},{"front":"What is progressive gear shifting and why use it?","back":"Shifting before you reach the maximum governed rpm. It reduces engine wear, decreases noise and saves fuel. Run the engine in the highest gear range to keep it in a low rpm range — shifting properly can improve operating costs by 30 per cent.","topic":"gears","id":"4-c3","chapter":4},{"front":"How does driving 105 km/h instead of 90 km/h affect fuel use?","back":"You travel 15 per cent faster but consume about 20 per cent more fuel. Reducing your average speed saves fuel.","topic":"speed","id":"4-c4","chapter":4},{"front":"How does see-think-do save fuel?","back":"See — scan for and anticipate hazards. Think — decide which hazards are most dangerous and choose the safest action. Do — carry out the manoeuvres. Anticipating hazards lets you maintain a constant speed and momentum: power not used is fuel not burned.","topic":"see-think-do","id":"4-c5","chapter":4},{"front":"Why should you turn off the engine when stopped for any length of time?","back":"Idling can burn up to four litres of fuel per hour. Turning the engine off saves fuel, reduces maintenance, prolongs engine life and prevents unnecessary emissions. At $1.50/litre, cutting one hour of idling per day saves over 1,000 litres and $1,500 per year.","topic":"idling","id":"4-c6","chapter":4},{"front":"How does tire underinflation affect fuel use?","back":"For every 10 p.s.i. (69 kPa) a tire is underinflated, one per cent of fuel is wasted. Inflate tires to the manufacturer's recommendations.","topic":"maintenance","id":"4-c7","chapter":4},{"front":"How much of the fuel consumed at highway speed goes to overcoming air resistance?","back":"At between 90 and 100 km/h, about 50 per cent of the fuel consumed is used to overcome air resistance. Aerodynamic features such as roof fairings, trailer gap reducers, side skirts and rear air dams can improve fuel economy by 15 to 20 per cent.","topic":"aerodynamics","id":"4-c8","chapter":4},{"front":"Which tire choices improve fuel efficiency?","back":"Tires with a rib tread design are more fuel efficient than lug tread tires on drive and steering axles. Super-single tires (instead of duals on drive axles) provide low rolling resistance, are lighter and lower vehicle height.","topic":"tires","id":"4-c9","chapter":4}],"questions":[{"q":"Fuel-efficient driving techniques can improve fuel economy by up to how much?","choices":["10 per cent","20 per cent","30 per cent","40 per cent"],"answerIndex":2,"explanation":"Fuel-efficient driving techniques can improve fuel economy by up to 30 per cent, and smart driving habits also save on maintenance costs.","topic":"smart driving","page":69,"id":"4-q0","chapter":4},{"q":"Approximately what share of all greenhouse gas emissions in Canada is produced by vehicles?","choices":["Nearly 30 per cent","Nearly 10 per cent","Nearly 20 per cent","Nearly 50 per cent"],"answerIndex":0,"explanation":"Nearly 30 per cent of all greenhouse gas emissions in Canada are produced by vehicles, which is one reason fuel efficiency is a growing priority.","topic":"fuel efficiency","page":69,"id":"4-q1","chapter":4},{"q":"In temperatures above freezing, how long should you let a heavy-duty diesel engine warm up after starting?","choices":["One to two minutes","Three to five minutes","Seven to 10 minutes","15 to 20 minutes"],"answerIndex":1,"explanation":"Let the engine warm up for three to five minutes only — any longer wastes fuel and can cause engine damage.","topic":"starting","page":70,"id":"4-q2","chapter":4},{"q":"How long should you let a diesel engine warm up when the temperature is below 0 C?","choices":["Three to five minutes","Five to seven minutes","Seven to 10 minutes","10 to 15 minutes"],"answerIndex":2,"explanation":"Below 0 C, warm the engine for seven to 10 minutes with zero throttle; idling longer wastes fuel and can cause engine damage.","topic":"starting","page":70,"id":"4-q3","chapter":4},{"q":"Driving on snow-covered roads can increase fuel consumption by how much?","choices":["5 to 10 per cent","15 to 20 per cent","25 to 35 per cent","40 to 50 per cent"],"answerIndex":1,"explanation":"Snow-covered roads can increase fuel consumption by 15 to 20 per cent, so plan routes and trip times to avoid bad weather where possible.","topic":"route planning","page":70,"id":"4-q4","chapter":4},{"q":"Using summer fuel can improve fuel economy by as much as how much?","choices":["Three per cent","Five per cent","10 per cent","15 per cent"],"answerIndex":0,"explanation":"Summer fuel can improve fuel economy by as much as three per cent, but it can cause engine problems in cold weather — use the correct fuel for the season.","topic":"preparation","page":70,"id":"4-q5","chapter":4},{"q":"What is progressive gear shifting?","choices":["Shifting only when the engine reaches maximum governed rpm","Skipping gears whenever possible to save time","Shifting without using the clutch","Shifting before you reach the maximum governed rpm"],"answerIndex":3,"explanation":"Progressive shifting means shifting before you reach the maximum governed rpm, which reduces engine wear, decreases noise and saves fuel.","topic":"gears","page":71,"id":"4-q6","chapter":4},{"q":"If you drive at 105 km/h instead of 90 km/h, about how much more fuel will you consume?","choices":["5 per cent","10 per cent","15 per cent","20 per cent"],"answerIndex":3,"explanation":"At 105 km/h you travel 15 per cent faster than at 90 km/h but consume about 20 per cent more fuel.","topic":"speed","page":71,"id":"4-q7","chapter":4},{"q":"What should you do with the throttle when going over the top of a hill?","choices":["Back off the throttle and select a lower gear to go down the hill","Accelerate to build momentum for the next hill","Hold the throttle steady and stay in the highest gear","Apply the brakes firmly before the crest"],"answerIndex":0,"explanation":"Back off the throttle when going over the top of a hill and select a lower gear to go down — let the terrain work for you.","topic":"throttle","page":71,"id":"4-q8","chapter":4},{"q":"At highway speeds, drivers of buses, trucks and other large heavy vehicles should never follow the vehicle ahead closer than how many seconds?","choices":["Two seconds","Three seconds","Four seconds","Five seconds"],"answerIndex":3,"explanation":"Large heavy vehicles should never be less than five seconds behind the vehicle ahead at highway speeds, allowing gradual slowing and avoiding sudden speed changes.","topic":"following distance","page":72,"id":"4-q9","chapter":4},{"q":"Idling can burn up to how much fuel per hour?","choices":["One litre","Two litres","Four litres","Eight litres"],"answerIndex":2,"explanation":"Idling can burn up to four litres of fuel per hour — turning the engine off when stopped is more economical than leaving it running.","topic":"idling","page":72,"id":"4-q10","chapter":4},{"q":"For every 10 p.s.i. (69 kPa) that a tire is underinflated, how much fuel is wasted?","choices":["0.5 per cent","One per cent","Five per cent","10 per cent"],"answerIndex":1,"explanation":"For every 10 p.s.i. (69 kPa) of underinflation, one per cent of fuel is wasted — inflate tires to the manufacturer's recommendations.","topic":"maintenance","page":73,"id":"4-q11","chapter":4},{"q":"During a trip, you should conduct enroute inspections, including tires and cargo, at least how often?","choices":["Every hour","Every three hours","Every five hours","Every eight hours"],"answerIndex":1,"explanation":"Conduct enroute inspections, including tires and cargo, at least every three hours, and check your instrument panel gauges frequently.","topic":"maintenance","page":73,"id":"4-q12","chapter":4},{"q":"Low-viscosity lubricants such as synthetic motor oil can improve fuel economy by up to how much?","choices":["Two per cent","Four per cent","Eight per cent","10 per cent"],"answerIndex":1,"explanation":"Low-viscosity lubricants such as synthetic motor oil can improve fuel economy by up to four per cent.","topic":"maintenance","page":73,"id":"4-q13","chapter":4},{"q":"At between 90 and 100 km/h, about how much of the fuel consumed is used to overcome air resistance?","choices":["20 per cent","30 per cent","40 per cent","50 per cent"],"answerIndex":3,"explanation":"At between 90 and 100 km/h, about 50 per cent of the fuel consumed is used to overcome air resistance, which is why aerodynamic features matter most at highway speeds.","topic":"aerodynamics","page":74,"id":"4-q14","chapter":4},{"q":"Which tire tread design is more fuel efficient on drive and steering axles?","choices":["Rib tread","Lug tread","Knobby off-road tread","Studded tread"],"answerIndex":0,"explanation":"Tires with a rib tread design are more fuel efficient than tires with a lug tread design on drive and steering axles.","topic":"tires","page":75,"id":"4-q15","chapter":4}]},"5":{"title":"skills for driving trucks and trailers","cards":[{"front":"When you start backing up a tractor with a semi-trailer, which way do you turn the steering wheel?","back":"Turn the steering wheel in the direction OPPOSITE to where you want the trailer to go. As soon as the trailer begins to turn, turn the wheel the other way — in the same direction the trailer is travelling — so the tractor follows a path that matches the trailer's path.","topic":"Backing up","id":"5-c0","chapter":5},{"front":"When towing two trailers, which trailer should be coupled to the tractor?","back":"Couple the more heavily loaded trailer to the tractor, with the lighter trailer behind. Different trailer weights affect the handling of the combination. Note the last trailer in a combination is the most likely to roll over.","topic":"Towing doubles","id":"5-c1","chapter":5},{"front":"List causes of trailer whipping and swerving.","back":"Driving too fast for the conditions, sudden steering changes, improper trailer connections, shifting loads, dragging brakes, or a flat tire.","topic":"Swerving and whipping","id":"5-c2","chapter":5},{"front":"What should you do if your trailer whips or swerves?","back":"Slow down and stop as soon as it's safe, then check your vehicle and load. Even if the swerving stops when you slow down, stopping to check is still important — the whipping may have shifted your cargo or loosened a trailer connection.","topic":"Swerving and whipping","id":"5-c3","chapter":5},{"front":"Why must you block the wheels of a parked trailer that has no spring brakes?","back":"The air in the trailer air tank bleeds down over time. Without spring brakes, the trailer brakes will release as air pressure drops, so the trailer could roll if the wheels aren't blocked.","topic":"Parking trailers","id":"5-c4","chapter":5},{"front":"How do you check that the fifth wheel has properly connected to the trailer kingpin?","back":"Check that the fifth wheel jaws have engaged the kingpin, there's no space or daylight between the fifth wheel and the trailer apron, and the release handle is in the locked position. Go under the trailer with a flashlight to check the locking jaws are securely closed around the kingpin (remove the ignition keys first).","topic":"Fifth wheel coupling","id":"5-c5","chapter":5},{"front":"When uncoupling, how do you ease the pressure on the fifth wheel locking jaws?","back":"Set the trailer brakes, release the tractor brakes, back up gently, and apply the tractor parking brakes while the tractor is pushing against the trailer. The tractor may only move a few centimetres, but this eases pressure on the locking jaws.","topic":"Uncoupling","id":"5-c6","chapter":5},{"front":"What extra securing devices are required when you use any coupling device other than a fifth wheel?","back":"Chains or metal cables connecting the towed and towing vehicles. These auxiliary chains or cables must be equal to the strength of the coupling device.","topic":"Pintle hitch","id":"5-c7","chapter":5},{"front":"What is the maximum length of the drawbar or other connection between a motor vehicle and a trailer?","back":"No more than five metres long, unless you're towing a pole trailer.","topic":"Coupling devices","id":"5-c8","chapter":5},{"front":"What is a converter dolly?","back":"A device sometimes used when towing more than one trailer. It has an axle, a fifth wheel and a hitch. When towing with one, make sure the air brake lines from truck to dolly and dolly to trailer are properly connected so the trailer brakes function.","topic":"Coupling devices","id":"5-c9","chapter":5},{"front":"How should cargo weight be distributed on a trailer (tractor-trailer combination)?","back":"Approximately 45 per cent of the cargo weight on the trailer axle unit, 45 per cent on the drive axle unit and 10 per cent on the steering axle. Place cargo midway between the rear axle unit and the drive axle unit.","topic":"Loading","id":"5-c10","chapter":5},{"front":"What forces must a cargo securement system be able to withstand?","back":"0.8g deceleration in a forward direction, 0.5g deceleration rearward, 0.5g acceleration in either sideways direction, and a downward force equal to at least 20 per cent of the cargo weight.","topic":"Securing cargo","id":"5-c11","chapter":5},{"front":"What is the rough guide for the number of tiedowns on a load?","back":"Use two tiedowns for the first 3.04 m of a load and one tiedown for every 3.04 m after that. Consider the length of the cargo first and then its weight. If cargo is prevented from moving forward, the minimum is one tiedown for every 3.04 m of length.","topic":"Tiedowns","id":"5-c12","chapter":5},{"front":"What is the minimum required strength of tiedowns securing cargo?","back":"The aggregate working load limit of the tiedowns must be at least 50 per cent of the cargo weight. For example, for a 600 kg article the tiedowns' combined working load limit must be no less than 300 kg.","topic":"Tiedowns","id":"5-c13","chapter":5},{"front":"What is dunnage?","back":"Spacing blocks, boards and mats that separate cargo from itself and its restraints — for example, corner boards used with tiedowns. Timber used as dunnage, chocks or cradles must be strong enough not to be split or crushed by the cargo or tiedowns.","topic":"Securing cargo","id":"5-c14","chapter":5},{"front":"What are the height and strength requirements for a front-end structure?","back":"It must be no shorter than 122 cm above the deck (or the height at which it prevents cargo moving forward). If less than 1.83 m tall it must withstand a static load of at least 50 per cent of total cargo weight; if 1.83 m or taller, 40 per cent. It must resist penetration at a deceleration of 6.1 m/s².","topic":"Front-end structures","id":"5-c15","chapter":5},{"front":"What are the limits for front and rear load projections?","back":"Front: no more than one metre beyond the front wheels (or front bumper if equipped). Rear (straight truck): no more than four metres beyond the turn centre. A load projecting more than 1.2 m beyond the rear needs a red flag or cloth in daylight, or a red light at night.","topic":"Load projections","id":"5-c16","chapter":5},{"front":"What are the maximum legal height and width of a commercial vehicle and its load?","back":"Maximum height 4.15 m and maximum width 2.6 m, unless the driver has an oversize load permit. Vehicles carrying loose hay, straw or fodder may be loaded to a maximum 3.1 m overall width.","topic":"Dimensions","id":"5-c17","chapter":5},{"front":"Why are liquid or dry bulk tank loads and hanging meat especially dangerous?","back":"They have a high centre of gravity, which increases the danger of rollover. Unbaffled liquid loads surge forward, backward and side to side; suspended meat can sway. Reduce speed on curves, sharp turns, ramps, and be careful on stops and starts.","topic":"Specific cargo","id":"5-c18","chapter":5},{"front":"What precautions apply when transporting livestock?","back":"Animals may move around, making turns difficult and possibly causing a collision. With less than a full load, use false bulkheads to keep livestock bunched together. Reduce speed on curves — even bunched animals sometimes lean, shifting the centre of gravity and possibly causing a rollover.","topic":"Specific cargo","id":"5-c19","chapter":5},{"front":"How far must a pilot car travel from the oversize vehicle it's escorting?","back":"Between 100 and 500 m, either behind or in front of the oversize vehicle. A pilot car warns other drivers about the larger-than-normal vehicle, and when required must carry a D (over dimension) sign.","topic":"Pilot cars","id":"5-c20","chapter":5},{"front":"Who must report to a weigh scale in B.C.?","back":"Drivers of commercial vehicles with a licensed gross vehicle weight of more than 5,500 kg must report to a scale whenever a sign, a police officer or an authorized person directs them to. The vehicle is weighed and inspected. Scales are fixed (permanent, marked by highway signs) or portable (set up by travelling inspectors on any public road).","topic":"Weigh scales","id":"5-c21","chapter":5},{"front":"Where must shipping documents be when you transport dangerous goods?","back":"All shipping documents must be complete, correct and readily available in the cab, and must accompany the dangerous goods shipment.","topic":"Dangerous goods","section":"dg","id":"5-c22","chapter":5},{"front":"What must you do if there's an incident involving your dangerous goods cargo (spill, leak, fire, explosion or damaged container)?","back":"Report it immediately to the nearest police agency or the Provincial Emergency Program (1-800-663-3456 in B.C.). Rapid action may help prevent an incident from becoming serious.","topic":"Dangerous goods","section":"dg","id":"5-c23","chapter":5},{"front":"Name the nine classes of dangerous goods.","back":"Explosives; gases; flammable liquids; flammable solids; oxidizing substances and organic peroxides; poisonous (toxic) substances and infectious substances; radioactive materials; corrosive substances; and miscellaneous products or substances.","topic":"Dangerous goods","section":"dg","id":"5-c24","chapter":5},{"front":"Where do dangerous goods placards appear on transport trucks?","back":"On the sides and both ends of the truck. Each placard identifies the class of dangerous goods being carried (there's also a placard for a mixed load).","topic":"Dangerous goods","section":"dg","id":"5-c25","chapter":5},{"front":"What training and certification is required to work with dangerous goods?","back":"You must be properly trained and appropriately certified. Your current employer must certify that you've had appropriate training, and you must always carry your training certificate with you when transporting dangerous goods.","topic":"Dangerous goods","section":"dg","id":"5-c26","chapter":5},{"front":"What do dangerous goods route signs indicate?","back":"One sign designates roads where vehicles transporting dangerous goods may travel; another designates roads where these vehicles can't travel.","topic":"Dangerous goods","section":"dg","id":"5-c27","chapter":5}],"questions":[{"q":"When you first start backing up a tractor with a semi-trailer, you should turn the steering wheel:","choices":["in the same direction you want the trailer to go","as little as possible until the trailer straightens","in the direction opposite to where you want the trailer to go","fully to the left, regardless of trailer direction"],"answerIndex":2,"explanation":"Turn the wheel opposite to the direction you want the trailer to go when you start backing up. Once the trailer begins to turn, turn the wheel the other way to follow the trailer's path.","topic":"Backing up","page":77,"id":"5-q0","chapter":5},{"q":"When backing up, what can cause your tractor-trailer to jackknife?","choices":["Backing up with the trailer brakes released","The tractor failing to follow a path that matches the trailer's path","Using the lowest reverse gear","Backing up in a perfectly straight line"],"answerIndex":1,"explanation":"As the trailer begins to turn, the tractor must follow a path that matches the trailer's path — if it doesn't, you risk jackknifing.","topic":"Backing up","page":78,"id":"5-q1","chapter":5},{"q":"When towing two trailers of different weights, how should they be arranged?","choices":["The lighter trailer coupled to the tractor, heavier behind","Order doesn't matter if both are within legal weight","The longer trailer always behind, regardless of weight","The more heavily loaded trailer coupled to the tractor, lighter behind"],"answerIndex":3,"explanation":"Couple the more heavily loaded trailer to the tractor with the lighter trailer behind, since trailer weights affect the handling of the combination.","topic":"Towing doubles","page":79,"id":"5-q2","chapter":5},{"q":"Why should you never unlock the pintle hook while the dolly is still under the rear trailer?","choices":["The dolly tow bar may fly up, possibly causing injury, and make re-coupling very difficult","The trailer air tanks will immediately drain","The rear trailer's spring brakes will release","The fifth wheel jaws will be damaged"],"answerIndex":0,"explanation":"With the dolly still under the rear trailer, unlocking the pintle hook can let the tow bar fly up, possibly causing injury and making it very difficult to re-couple.","topic":"Towing doubles","page":79,"id":"5-q3","chapter":5},{"q":"Your trailer begins to whip and swerve. What should you do?","choices":["Speed up slightly to pull the trailer straight","Apply the trailer hand valve fully and continue","Slow down and stop as soon as it's safe, then check your vehicle and load","Ignore it if it stops when you change lanes"],"answerIndex":2,"explanation":"Slow down and stop as soon as it's safe. Even if the swerving stops when you slow down, stop and check — it may have shifted your cargo or loosened a trailer connection.","topic":"Swerving and whipping","page":79,"id":"5-q4","chapter":5},{"q":"During fifth wheel coupling, when should you stop the first time you back up toward the trailer?","choices":["When the kingpin locks into the fifth wheel jaws","When the rear tractor tires touch the landing gear","About one metre before reaching the trailer","When the fifth wheel just touches the trailer apron"],"answerIndex":3,"explanation":"Back up slowly and stop when the fifth wheel just touches the trailer apron — don't back up too far, and back in a straight line, not at an angle.","topic":"Fifth wheel coupling","page":82,"id":"5-q5","chapter":5},{"q":"How is the tug test performed after coupling with a fifth wheel?","choices":["Apply full throttle in a forward gear to try to break away","Rock the trailer sideways using the steering","Release the tractor brakes with the trailer brakes still applied, and gently tug against them","Release all brakes and roll forward 10 metres"],"answerIndex":2,"explanation":"With the landing gear slightly off the ground, release the tractor brakes (trailer brakes still applied) and gently tug — the trailer brakes should prevent the trailer from moving.","topic":"Fifth wheel coupling","page":84,"id":"5-q6","chapter":5},{"q":"When uncoupling a tractor from a semi-trailer, when are the air lines disconnected?","choices":["After the tractor has completely pulled away","Before pulling the fifth wheel release handle to unlock the jaws","While the tractor is moving slowly forward","Only after the landing gear is fully raised"],"answerIndex":1,"explanation":"In the uncoupling sequence, you block the wheels, lower the landing gear, disconnect the air lines and electrical cable and secure them to the tractor, and then pull the fifth wheel release handle.","topic":"Uncoupling","page":85,"id":"5-q7","chapter":5},{"q":"When a coupling device other than a fifth wheel is used, what else is required to connect the vehicles?","choices":["Chains or metal cables equal to the strength of the coupling device","A converter dolly between the two vehicles","A second pintle hook as backup","Nothing else, if the pintle hook has a safety latch"],"answerIndex":0,"explanation":"With any coupling device other than a fifth wheel, you must also use auxiliary chains or metal cables equal to the strength of the coupling device.","topic":"Pintle hitch","page":87,"id":"5-q8","chapter":5},{"q":"Except for pole trailers, what is the maximum permitted length for the drawbar or connection between a motor vehicle and trailer?","choices":["2.25 metres","3.04 metres","Five metres","Ten metres"],"answerIndex":2,"explanation":"The drawbar or other connection may not be more than five metres long unless you're towing a pole trailer.","topic":"Coupling devices","page":87,"id":"5-q9","chapter":5},{"q":"Five-ton freight trucks are designed to carry approximately what share of cargo weight on the rear axle(s)?","choices":["90 per cent, with 10 per cent on the steering axle","45 per cent, with 55 per cent on the steering axle","70 per cent, with 30 per cent on the steering axle","50 per cent, with 50 per cent on the steering axle"],"answerIndex":0,"explanation":"Five-ton freight trucks are designed for about 90 per cent of cargo weight on the rear axle(s) and 10 per cent on the steering axle; cement mixers and dump trucks are designed for about 70/30.","topic":"Loading","page":94,"id":"5-q10","chapter":5},{"q":"When loaded, a tridem drive truck or truck tractor must have a combined steering axle weight of at least:","choices":["10 per cent of the tridem axle weight","50 per cent of the gross vehicle weight","70 per cent of the tridem axle weight","25 per cent of the tridem axle weight (40 per cent for twin steering axles)"],"answerIndex":3,"explanation":"A tridem drive truck or tractor requires a loaded steering axle weight of at least 25 per cent of the tridem axle weight — 40 per cent in the case of twin steering axles.","topic":"Loading","page":94,"id":"5-q11","chapter":5},{"q":"A cargo securement system must be able to withstand what deceleration in the forward direction?","choices":["0.2g","0.8g","0.5g","1.5g"],"answerIndex":1,"explanation":"The system must withstand 0.8g deceleration forward, 0.5g rearward, 0.5g sideways in either direction, and a downward force of at least 20 per cent of the cargo weight.","topic":"Securing cargo","page":95,"id":"5-q12","chapter":5},{"q":"An article of cargo is 1.21 m long, weighs 600 kg, and is not prevented from moving forward. What is the minimum number of tiedowns?","choices":["Two, equally spaced","One","Four","Three, equally spaced"],"answerIndex":0,"explanation":"Articles 1.52 m or shorter but over 500 kg require a minimum of two tiedowns when not prevented from moving forward.","topic":"Tiedowns","page":96,"id":"5-q13","chapter":5},{"q":"A 3.65 m article weighing 600 kg needs three tiedowns. What minimum working load limit must each tiedown have?","choices":["600 kg each","50 kg each","100 kg each","300 kg each"],"answerIndex":2,"explanation":"The aggregate working load limit must be at least 50 per cent of cargo weight (300 kg for a 600 kg article), so each of the three tiedowns must be rated at not less than 100 kg.","topic":"Tiedowns","page":97,"id":"5-q14","chapter":5},{"q":"A friction mat not marked by the manufacturer with a working load limit is assumed to provide resistance to horizontal movement equal to:","choices":["50 per cent of the weight of the cargo resting on the mat","100 per cent of the cargo weight","20 per cent of the cargo weight","Nothing — unmarked mats can't be used"],"answerIndex":0,"explanation":"An unmarked friction mat is assumed to provide resistance equal to 50 per cent of the weight of the cargo resting on it.","topic":"Securing cargo","page":98,"id":"5-q15","chapter":5},{"q":"Which of the following may NOT be used as an anchor point for tiedowns?","choices":["The vehicle frame","Rub rails","The body rail","Purpose-built anchor points inboard of the rub rail"],"answerIndex":1,"explanation":"Rub rails must not be used as anchor points. Tiedowns should be located inboard of rub rails if possible.","topic":"Securing cargo","page":100,"id":"5-q16","chapter":5},{"q":"When must an aggregate load (such as sand, gravel or wood chips) be covered with a tarp?","choices":["Only when it weighs more than 2,268 kg","Only when travelling on a highway at night","Never — sideboards are always sufficient","When the load can't be contained with sideboards or tiedowns and is likely to bounce, blow or drop from the moving vehicle"],"answerIndex":3,"explanation":"You must use a cover or tarp if the load is made up of aggregate material and is likely to bounce, blow or drop from the moving vehicle.","topic":"Securing cargo","page":101,"id":"5-q17","chapter":5},{"q":"A front-end structure less than 1.83 m in height must be able to withstand a static load of at least:","choices":["20 per cent of the total cargo weight","50 per cent of the total cargo weight, uniformly distributed","40 per cent of the total cargo weight","100 per cent of the total cargo weight"],"answerIndex":1,"explanation":"Front-end structures under 1.83 m must withstand at least 50 per cent of total cargo weight; structures 1.83 m or taller must withstand 40 per cent.","topic":"Front-end structures","page":102,"id":"5-q18","chapter":5},{"q":"To protect the vehicle operator, a front-end structure must be no shorter than what height above the deck?","choices":["183 cm","100 cm","152 cm","122 cm (or the height at which it prevents the cargo from moving forward)"],"answerIndex":3,"explanation":"The Standard requires a front-end structure no shorter than 122 cm above the deck, or the height at which it prevents the cargo from moving forward.","topic":"Front-end structures","page":102,"id":"5-q19","chapter":5},{"q":"A load projects more than 1.2 m beyond the rear of your vehicle. What must be attached to the tip of the projection?","choices":["An orange triangle at all times","A red flag or cloth in daylight, or a red light at night","A white flag in daylight, or an amber light at night","Nothing, if the projection is under four metres"],"answerIndex":1,"explanation":"If a load projects more than 1.2 m beyond the rear, attach a red flag or cloth for daylight driving, or a red light at night. Loads on a straight truck can't extend more than four metres beyond the turn centre.","topic":"Load projections","page":104,"id":"5-q20","chapter":5},{"q":"The Standard's specific requirements for coils of rolled sheet metal apply when the shipment of coils weighs:","choices":["500 kg or more","5,000 kg or more","2,268 kg or more","4,500 kg or more"],"answerIndex":2,"explanation":"The Standard outlines specific requirements for transporting coils of rolled sheet metal where the shipment weighs 2,268 kg or more (the same threshold applies to paper roll shipments).","topic":"Specific cargo","page":106,"id":"5-q21","chapter":5},{"q":"A heavy vehicle weighing more than 4,500 kg carried as cargo must be restrained by:","choices":["A minimum of four tiedowns, each with a working load limit of at least 2,268 kg","Two tiedowns at the rear only","One chain at each corner rated at 500 kg","Synthetic webbing straps at the front and rear"],"answerIndex":0,"explanation":"Heavy vehicles over 4,500 kg need at least four tiedowns, each with a working load limit of at least 2,268 kg; vehicles under 4,500 kg GVW need a minimum of two tiedowns securing front and rear.","topic":"Specific cargo","page":108,"id":"5-q22","chapter":5},{"q":"Which two types of loads have a high centre of gravity that increases the chance of rollover if movement or swaying isn't prevented?","choices":["Dressed lumber and concrete pipe","Intermodal containers and boulders","Crushed vehicles and building products","Hanging meat and liquid bulk tank loads"],"answerIndex":3,"explanation":"Meat suspended in a trailer can sway and liquid bulk loads surge; both have a high centre of gravity, increasing the danger of rollover — reduce speed on curves and ramps.","topic":"Specific cargo","page":109,"id":"5-q23","chapter":5},{"q":"What is the maximum allowable height for a commercial vehicle without an oversize load permit?","choices":["3.1 m","4.15 m","4.4 m","5.0 m"],"answerIndex":1,"explanation":"The maximum allowable height is 4.15 m unless the driver has an oversize load permit. The maximum legal width of vehicle and load is 2.6 m.","topic":"Dimensions","page":112,"id":"5-q24","chapter":5},{"q":"Oversize permits are not normally given for loads or vehicles wider than:","choices":["4.4 m","2.6 m","3.1 m","5.0 m"],"answerIndex":0,"explanation":"Permits are not normally given for loads or vehicles wider than 4.4 m. Oversize extremities must be marked with red flags at least 30 cm by 30 cm, with amber lights to the front and red to the rear at night.","topic":"Oversize permits","page":114,"id":"5-q25","chapter":5},{"q":"A pilot car escorting an oversize vehicle must travel:","choices":["Directly beside the oversize vehicle","At least one kilometre ahead","Within 50 m of the oversize vehicle at all times","Between 100 and 500 m either behind or in front of the oversize vehicle"],"answerIndex":3,"explanation":"A pilot car must travel between 100 and 500 m either behind or in front of the oversize vehicle it's escorting, warning other drivers about the larger-than-normal vehicle.","topic":"Pilot cars","page":115,"id":"5-q26","chapter":5},{"q":"Which drivers must report to a weigh scale when directed by a sign, police officer or authorized person?","choices":["Only drivers carrying dangerous goods","Drivers of commercial vehicles with a licensed GVW of more than 5,500 kg","All drivers of any vehicle towing a trailer","Only drivers of vehicles over 4,500 kg net weight"],"answerIndex":1,"explanation":"If you drive a commercial vehicle with a licensed gross vehicle weight of more than 5,500 kg, you must report to a scale whenever a sign, police officer or authorized person directs you to.","topic":"Weigh scales","page":115,"id":"5-q27","chapter":5},{"q":"How might you encounter a portable weigh scale in B.C.?","choices":["Only at permanent scale yards marked by highway signs","Only at border crossings","Set up temporarily at the roadside, or a vehicle with flashing lights may pull you over and the inspector sets up a scale","Only on designated truck routes within city limits"],"answerIndex":2,"explanation":"Portable scales may be temporarily set up on the side of a road where you'll be signalled to stop, or a vehicle with flashing lights may direct you to pull over and the inspector may then set up a scale.","topic":"Weigh scales","page":116,"id":"5-q28","chapter":5},{"q":"How many classes of dangerous goods are there?","choices":["Six","Nine","Twelve","Four"],"answerIndex":1,"explanation":"There are nine classes: explosives, gases, flammable liquids, flammable solids, oxidizing substances and organic peroxides, poisonous and infectious substances, radioactive materials, corrosive substances, and miscellaneous products or substances.","topic":"Dangerous goods","page":110,"section":"dg","id":"5-q29","chapter":5},{"q":"When transporting dangerous goods, where must the shipping documents be?","choices":["Filed at the carrier's head office","Mailed ahead to the destination","Locked in the trailer with the cargo","Complete, correct and readily available in the cab"],"answerIndex":3,"explanation":"You must ensure all shipping documents are complete, correct and readily available in the cab, and they must accompany the dangerous goods shipment.","topic":"Dangerous goods","page":110,"section":"dg","id":"5-q30","chapter":5},{"q":"You discover a leak in your dangerous goods cargo. What must you do?","choices":["Report it immediately to the nearest police agency or the Provincial Emergency Program","Note it in your log book and report it at the end of the trip","Continue to the nearest weigh scale for inspection","Report it only if the leak causes a fire"],"answerIndex":0,"explanation":"Report immediately any incident related to dangerous goods cargo — spills, leaks, fires, explosions or damaged containers — to the nearest police agency or the Provincial Emergency Program (1-800-663-3456).","topic":"Dangerous goods","page":110,"section":"dg","id":"5-q31","chapter":5},{"q":"Where do dangerous goods placards appear on a transport truck?","choices":["Only on the rear doors","Only in the cab window","On the sides and both ends of the truck","On the roof of the trailer"],"answerIndex":2,"explanation":"Dangerous goods placards may appear on the sides and both ends of transport trucks, identifying the class of dangerous goods carried.","topic":"Dangerous goods","page":110,"section":"dg","id":"5-q32","chapter":5},{"q":"What must you always carry with you when transporting dangerous goods?","choices":["A letter from a professional engineer","A copy of the Commercial Transport Regulations","An oversize load permit","Your dangerous goods training certificate"],"answerIndex":3,"explanation":"Your current employer must certify that you've had appropriate training, and you must always carry your training certificate with you when transporting dangerous goods.","topic":"Dangerous goods","page":110,"section":"dg","id":"5-q33","chapter":5},{"q":"Who must certify that a driver has had appropriate dangerous goods training?","choices":["The driver's current employer","ICBC","The local police department","The Provincial Emergency Program"],"answerIndex":0,"explanation":"If you're going to work with dangerous goods, your current employer must certify that you've had appropriate training.","topic":"Dangerous goods","page":110,"section":"dg","id":"5-q34","chapter":5},{"q":"Which of the following is one of the nine classes of dangerous goods?","choices":["Perishable foodstuffs","Aggregate materials","Corrosive substances","Livestock"],"answerIndex":2,"explanation":"Corrosive substances is one of the nine classes. Perishable foods, aggregates and livestock are not dangerous goods classes.","topic":"Dangerous goods","page":110,"section":"dg","id":"5-q35","chapter":5},{"q":"What do the dangerous goods route signs described in the manual indicate?","choices":["The speed limit for placarded vehicles","Roads where vehicles transporting dangerous goods may travel, and roads where they can't","Locations of emergency response depots","Mandatory rest stops for dangerous goods drivers"],"answerIndex":1,"explanation":"One sign designates roads where vehicles transporting dangerous goods may travel; the other designates roads where these vehicles can't travel.","topic":"Dangerous goods","page":111,"section":"dg","id":"5-q36","chapter":5}]},"6":{"title":"skills for driving buses, taxis, limousines and ride-hailing vehicles","cards":[{"front":"What checks should you make before leaving the curb in a passenger vehicle?","back":"Look in the side mirror AND over your shoulder to check traffic is clear — don't rely on side mirrors alone. Ensure passengers are not moving around, signal to other drivers, then check over your shoulder again before moving.","topic":"Leaving the curb","id":"6-c0","chapter":6},{"front":"What hazard can the rear of a bus create when pulling away from the curb?","back":"The rear of the bus can swing over the sidewalk and hit pedestrians, cyclists, poles or sign posts near the curb. Also leave enough room on right turns to avoid a collision with the vehicle in the lane beside you.","topic":"Leaving the curb","id":"6-c1","chapter":6},{"front":"When do public transit buses have the right-of-way to re-enter traffic?","back":"When the driver signals to move from the curb lane or bus stop into traffic and the bus displays a yield sign — in areas where the speed limit is less than 60 km/h. The bus driver must still ensure it's safe; other drivers don't have to yield if it's unsafe.","topic":"Bus right-of-way","id":"6-c2","chapter":6},{"front":"What clues help you avoid a collision when passing parked cars?","back":"Front wheels turned out; a driver behind the steering wheel; exhaust from a tail pipe; brake lights, back-up lights and turn signals; people walking or children playing near the road. Also watch for doors opening on the traffic side and pedestrians stepping out from between cars.","topic":"Passing parked cars","id":"6-c3","chapter":6},{"front":"What are the rules for taking on or letting off passengers on the highway (taxi/bus)?","back":"Signal to warn traffic you're stopping; stop where other drivers can see your vehicle from at least 85 metres (285 ft) in front and behind; leave at least 3 metres (10 ft) to the left so traffic can pass. Whenever safe, pull off the travel portion of the highway.","topic":"Taking on/letting off passengers","id":"6-c4","chapter":6},{"front":"What are the smoking and alcohol rules for commercial passenger vehicle drivers?","back":"It's illegal to smoke in any motor vehicle with any passenger under 16 years old. Don't smoke if passengers are in your vehicle — whether it's moving or not. Don't be under the influence of alcohol while on duty.","topic":"Smoking rules","id":"6-c5","chapter":6},{"front":"What must you never do while your passenger vehicle is moving?","back":"Collect fares, make change, or take on or let off passengers. Save unnecessary conversation until stopped. You must be able to see clearly ahead, right and left, move your arms and legs at all times, and be ready to reach emergency equipment.","topic":"Focus on driving","id":"6-c6","chapter":6},{"front":"How many passengers may sit beside you in a sedan-type vehicle?","back":"Up to two passengers on your right side, but only if there's enough room to operate the vehicle safely and only if there are designated seating positions with seatbelts in those positions.","topic":"Passenger safety","id":"6-c7","chapter":6},{"front":"When may passengers stand in a commercial passenger vehicle?","back":"Only if the vehicle's passenger transportation licence allows standing passengers; the licence limits how many. The standing passenger capacity must be displayed in an easily seen location, and no one may stand where they make it difficult for you to see or move.","topic":"Standing passengers","id":"6-c8","chapter":6},{"front":"When may you refuse to transport a passenger?","back":"If your vehicle is already carrying the maximum allowed number of passengers, or the passenger is smoking, using profane or offensive language, or acting in a disorderly manner or being offensive to other passengers. If you order someone out, they must be able to disembark safely where they can reasonably find alternate transportation.","topic":"Refusing passengers","id":"6-c9","chapter":6},{"front":"What are the rules for let-down or jump seats?","back":"Under the Passenger Transportation Act you must have a licence or permit before using them. They may be used only in the rear of sedans and only if the manufacturer designed the vehicle to carry them.","topic":"Let-down/jump seats","id":"6-c10","chapter":6},{"front":"What are the key rules for transporting people with disabilities?","back":"You can't refuse to transport someone just because they have a disability. You must allow service animals (such as guide dogs) with their owners. Speak directly to the person, not their companion; always ask before helping; properly secure wheelchairs, scooters and mobility aids.","topic":"Transporting people with disabilities","id":"6-c11","chapter":6},{"front":"What is a chauffeur's permit and who issues it?","back":"Some municipalities require all limousine and taxi drivers to have one. It's usually issued by the municipal police; you may have to allow a police check and complete a hospitality course (such as the TaxiHost program) first.","topic":"Chauffeur's permit","id":"6-c12","chapter":6},{"front":"What are the inside lighting requirements for public passenger vehicles?","back":"Vehicles seating more than 12 occupants (including the driver) must have lights that illuminate the passenger aisle behind the driver, kept on between sunset and sunrise. Passenger vehicles must also have a light at each entrance that turns on when the door opens.","topic":"Inside lights","id":"6-c13","chapter":6},{"front":"What inspection documentation must a vehicle with a passenger transportation plate have?","back":"If your vehicle is licensed in British Columbia and has a passenger transportation plate, you must ensure it displays a valid commercial vehicle inspection decal and carry the certificate in the vehicle. The vehicle must also be clean and sanitary at all times.","topic":"Vehicle inspection","id":"6-c14","chapter":6},{"front":"What emergency equipment must a commercial passenger vehicle seating more than 10 occupants (including driver) carry?","back":"One first-aid kit (meeting WorkSafeBC guidelines), one spare tire, and at least one fire extinguisher. The carrier is responsible for ensuring this equipment is available and in working order. Vehicles seating more than 12 (including driver) also need an emergency exit door or emergency windows; vehicles seating more than 10 passengers must carry warning devices such as flags and flares.","topic":"Emergency equipment","id":"6-c15","chapter":6},{"front":"What must you do about defects, breakdowns and deficiencies?","back":"End the trip if a problem could endanger passenger safety or comfort — fix it or remove the danger before continuing. If a crash or breakdown stops the trip, immediately arrange to have passengers transported to their destination with as little delay as possible. Report any defect that could make the vehicle unsafe in writing to your carrier at the time you find it or by the end of that day.","topic":"Defects and breakdowns","id":"6-c16","chapter":6},{"front":"What are the fuelling precautions for passenger vehicles?","back":"Don't refuel while the engine is running, the on-board radio is transmitting, or any open flame is present. Keep the fuel nozzle in contact with the filler pipe at all times to ground the connection; if there's a ground strap, connect it to the filler pipe too.","topic":"Fuelling","id":"6-c17","chapter":6},{"front":"How must baggage and cargo be carried on a bus?","back":"In properly designed overhead racks (with elastic cord, doors, or a rigid vertical edge half the height of the opening), stowed under seats against a barrier preventing forward movement, in a separate enclosed compartment, or on a passenger's lap. It must never block any aisle or exit, obscure the driver's view, obstruct emergency equipment, or interfere with the driver's arms or legs.","topic":"Baggage","id":"6-c18","chapter":6},{"front":"What are the key school bus maintenance and cleanliness rules?","back":"Test the brakes every day — never operate a school bus unless the brakes are safe. Never transport passengers on a defective school bus; if an inspector or peace officer finds it unfit, it can't operate as a school bus until fixed. Wash the floor with disinfectant solution at least once a week. Refuel only with all passengers off and the engine turned off.","topic":"School bus operation","id":"6-c19","chapter":6},{"front":"What signs and mirrors must a school bus have?","back":"Two \"School Bus\" signs (letters at least 20 cm high, black on yellow) at the front and rear — rear sign immediately above or below the rear window. New school buses need two sets of rear-view mirrors per side, a mirror viewing the entrance door, and a convex mirror at the front to see the roadway immediately in front where passengers may cross.","topic":"School bus operation","id":"6-c20","chapter":6},{"front":"What are the rules for school bus stops (taking on/letting off passengers)?","back":"Come to a full stop; have at least 3 metres of road on the left side; be visible to other drivers from at least 60 metres in either direction; passengers enter and leave from the right side only. Use alternating flashing red lights whenever passengers are crossing the road; all drivers must stop for the flashing red lights. Passengers must never stand — all must be seated before the bus moves.","topic":"School bus operation","id":"6-c21","chapter":6},{"front":"What does the law allow and require when operating an emergency vehicle?","back":"Ambulance flashing red lights are used only when responding to an emergency call or transporting a patient. You may exceed speed limits and go through red lights or stop signs if you give appropriate warning — use both lights and siren. Before doing so, consider the condition and use of the highway, the amount of traffic on or expected on it, and the seriousness of the emergency.","topic":"Emergency vehicles","id":"6-c22","chapter":6}],"questions":[{"q":"In addition to checking your side mirror, what should you do before leaving the curb?","choices":["Sound your horn to warn other traffic","Rely on the interior mirror to confirm the lane is clear","Check over your shoulder that traffic is clear","Flash your headlights at approaching vehicles"],"answerIndex":2,"explanation":"Don't rely on side mirrors alone — look over your shoulder to check that traffic is clear, signal, then check over your shoulder again before moving.","topic":"Leaving the curb","page":121,"id":"6-q0","chapter":6},{"q":"The Motor Vehicle Act gives public transit buses the right-of-way when leaving a bus stop in areas where the speed limit is:","choices":["Less than 60 km/h","Less than 80 km/h","50 km/h or more","Any speed limit, as long as the yield sign is displayed"],"answerIndex":0,"explanation":"The bus right-of-way rule applies where the speed limit is less than 60 km/h, when the driver signals and the bus displays a yield sign.","topic":"Bus right-of-way","page":122,"id":"6-q1","chapter":6},{"q":"As a transit bus driver displaying the yield sign, what responsibility do you still have when pulling away from a bus stop?","choices":["None — other drivers must always yield to you","You must still ensure it's safe before moving into traffic","You only need to check your mirrors once","You must wait for a gap of at least 85 metres"],"answerIndex":1,"explanation":"The regulation doesn't remove any responsibility from bus drivers — don't assume you have the right-of-way, as other drivers don't have to yield if it's unsafe.","topic":"Bus right-of-way","page":122,"id":"6-q2","chapter":6},{"q":"Which of the following is a clue that a parked vehicle might pull into traffic?","choices":["Its windows are fogged up","Its parking brake is set","Its doors are locked","Its front wheels are turned out"],"answerIndex":3,"explanation":"Clues include front wheels turned out, a driver behind the wheel, exhaust from the tail pipe, and brake, back-up or signal lights.","topic":"Passing parked cars","page":122,"id":"6-q3","chapter":6},{"q":"When taking on or letting off passengers on the highway, you must stop where other drivers can see your vehicle from at least what distance in front and behind?","choices":["60 metres","85 metres (285 ft)","100 metres","150 metres"],"answerIndex":1,"explanation":"Stop in a location that allows other drivers to see your vehicle from a distance of at least 85 metres (285 ft) in front and behind.","topic":"Taking on/letting off passengers","page":123,"id":"6-q4","chapter":6},{"q":"When stopping on a highway to take on or let off passengers, how much space should you leave to the left of your vehicle so traffic can pass?","choices":["At least three metres (10 ft)","At least one metre (3 ft)","At least five metres (16 ft)","Half a lane width"],"answerIndex":0,"explanation":"Leave at least three metres (10 ft) to the left of your vehicle so that traffic may pass by.","topic":"Taking on/letting off passengers","page":123,"id":"6-q5","chapter":6},{"q":"When is it illegal to smoke in any motor vehicle?","choices":["Only when the vehicle is in motion","Only in vehicles carrying more than 10 passengers","When there are any passengers under 16 years old","Only when a passenger asks you not to smoke"],"answerIndex":2,"explanation":"It's illegal to smoke in any motor vehicle when there are any passengers under 16 years old, who are especially vulnerable to second-hand smoke.","topic":"Smoking rules","page":123,"id":"6-q6","chapter":6},{"q":"Is it allowable to collect a fare or make change while your vehicle is in motion?","choices":["Yes, if the passenger has exact change","Yes, but only when stopped at a red light","Yes, if you keep one hand on the wheel","No — you must not collect fares or make change any time the vehicle is moving"],"answerIndex":3,"explanation":"Any time your vehicle is moving you must not collect fares, make change, or take on or let off passengers — passenger safety is your first priority.","topic":"Focus on driving","page":123,"id":"6-q7","chapter":6},{"q":"In a sedan-type vehicle, how many passengers may sit on your right side in the front seat?","choices":["None — the front seat is for the driver only","Up to two, if there's room to operate safely and there are designated seating positions with seatbelts","Up to three, if they are all adults","One only, regardless of seatbelts"],"answerIndex":1,"explanation":"You may have up to two passengers on your right side in a sedan, but only with enough room to operate safely and designated belted seating positions.","topic":"Passenger safety","page":123,"id":"6-q8","chapter":6},{"q":"When may passengers stand while a commercial passenger vehicle is in motion?","choices":["Only if the vehicle's passenger transportation licence allows standing passengers","Whenever all seats are full","Any time, as long as they hold a handrail","Never, in any commercial passenger vehicle"],"answerIndex":0,"explanation":"Passengers may not stand while the vehicle is in motion unless the passenger transportation licence allows it; the licence limits the number, which must be displayed in the vehicle.","topic":"Standing passengers","page":123,"id":"6-q9","chapter":6},{"q":"Under which condition may you refuse to transport a paying passenger?","choices":["The passenger has a disability","The passenger is travelling with a service animal","The passenger is smoking, using profane language, or acting in a disorderly manner","The trip is shorter than you would like"],"answerIndex":2,"explanation":"You may refuse if the vehicle is already at maximum capacity, or the passenger is smoking, using profane or offensive language, or acting disorderly or offensively to others.","topic":"Refusing passengers","page":124,"id":"6-q10","chapter":6},{"q":"Where may let-down or jump seats be used in a passenger vehicle?","choices":["In the front seat of any taxi","Anywhere in a limousine","In any vehicle with a passenger transportation plate","Only in the rear of sedans, and only if the manufacturer designed the vehicle to carry them"],"answerIndex":3,"explanation":"Under the Passenger Transportation Act you need a licence or permit to use them, and they may be used only in the rear of sedans designed by the manufacturer to carry them.","topic":"Let-down/jump seats","page":124,"id":"6-q11","chapter":6},{"q":"A passenger who is blind arrives with a guide dog. What must you do?","choices":["Ask them to book a specialized vehicle instead","Allow the service animal in your vehicle with its owner","Refuse the trip unless the dog travels in the trunk area","Charge an extra fee for the animal"],"answerIndex":1,"explanation":"You can't refuse to transport a person because of a disability, and you must allow service animals such as guide dogs in your vehicle with their owners.","topic":"Transporting people with disabilities","page":124,"id":"6-q12","chapter":6},{"q":"Who usually issues a chauffeur's permit in municipalities that require one?","choices":["The municipal police","ICBC","The Passenger Transportation Board","Commercial Vehicle Safety and Enforcement"],"answerIndex":0,"explanation":"Some municipalities require limousine and taxi drivers to have a chauffeur's permit, usually issued by the municipal police, possibly after a police check and a hospitality course such as TaxiHost.","topic":"Chauffeur's permit","page":125,"id":"6-q13","chapter":6},{"q":"When must the interior aisle lights in a public passenger vehicle seating more than 12 occupants be kept on?","choices":["Only when passengers are boarding","Whenever the vehicle is in motion","Between the hours of sunset and sunrise","Only when the doors are open"],"answerIndex":2,"explanation":"These lights must be kept on between sunset and sunrise so passengers can move safely in the vehicle; a separate light at each entrance turns on when the door opens.","topic":"Inside lights","page":125,"id":"6-q14","chapter":6},{"q":"What is the minimum emergency equipment required in a commercial passenger vehicle with a seating capacity of more than 10 occupants, including the driver?","choices":["A fire extinguisher and a tow rope","A first-aid kit and a cellular phone","Two fire extinguishers and reflective triangles","One first-aid kit (meeting WorkSafeBC guidelines), one spare tire and at least one fire extinguisher"],"answerIndex":3,"explanation":"Vehicles seating more than 10 occupants including the driver must carry one WorkSafeBC-standard first-aid kit, one spare tire and at least one fire extinguisher.","topic":"Emergency equipment","page":125,"id":"6-q15","chapter":6},{"q":"Who is responsible for ensuring a commercial passenger vehicle's emergency equipment is available and in working order?","choices":["The passengers","The carrier","ICBC","The municipal police"],"answerIndex":1,"explanation":"The carrier is responsible for ensuring the emergency equipment is available and in working order.","topic":"Emergency equipment","page":125,"id":"6-q16","chapter":6},{"q":"Your commercial passenger vehicle breaks down and you cannot continue the trip. What must you do?","choices":["Immediately arrange to have your passengers transported to their destination with as little delay as possible","Refund the fares and leave passengers to find their own way","Wait with the vehicle until a mechanic arrives before doing anything else","Continue the trip slowly if the vehicle can still move"],"answerIndex":0,"explanation":"If a crash or breakdown makes it impossible to continue, you must make immediate arrangements to have your passengers transported to their destination with as little delay as possible.","topic":"Defects and breakdowns","page":126,"id":"6-q17","chapter":6},{"q":"Why must you keep the fuel nozzle in contact with the filler pipe while refuelling?","choices":["To speed up fuel flow","To prevent fuel theft","To ground the connection","To avoid overfilling the tank"],"answerIndex":2,"explanation":"Keeping the nozzle in contact with the filler pipe grounds the connection; if there's a ground strap, connect it to the filler pipe as well. Never refuel with the engine running, the on-board radio transmitting, or any open flame present.","topic":"Fuelling","page":126,"id":"6-q18","chapter":6},{"q":"How must you report a defect or deficiency that could make your vehicle unsafe?","choices":["Verbally to a peace officer within 48 hours","By noting it in the vehicle log within one week","Only if the vehicle actually breaks down","In writing to the carrier, at the time you find it or by the end of that day"],"answerIndex":3,"explanation":"The report must be made in writing and given to the carrier you work for at the time you find the defect or by the end of that day.","topic":"Defects and breakdowns","page":127,"id":"6-q19","chapter":6},{"q":"How often must you test the brakes on a school bus?","choices":["Once a week","Every day","Before each trip carrying passengers","At every scheduled inspection"],"answerIndex":1,"explanation":"Test the brakes on your school bus every day, and don't operate any school bus unless the brakes are safe.","topic":"School bus operation","page":127,"id":"6-q20","chapter":6},{"q":"What are the requirements for the \"School Bus\" signs on a school bus?","choices":["Two signs, front and rear, with black letters at least 20 cm high on a yellow background","One sign at the rear with red letters at least 15 cm high","Two signs on each side with white letters on a black background","One sign at the front with yellow letters at least 25 cm high"],"answerIndex
