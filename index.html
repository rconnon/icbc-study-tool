or one year and allows practice with a supervisor."},{"q":"How many motor-vehicle-related Criminal Code convictions are allowed in the previous three years?","choices":["Three","Two","One","Zero"],"answerIndex":3,"explanation":"Applicants must show zero motor-vehicle-related Criminal Code convictions in the previous three years."}]},{"title":"Road tests and the pre-trip inspection test","points":["All road tests include a pre-trip inspection, an air brake pre-trip inspection (if equipped) and the road test itself.","Under the National Safety Code, pre-trip inspections must always be done before the first run of the day.","During the inspection, tell the examiner what you're checking and complete a written trip inspection report.","You must demonstrate starting, stopping, shifting, turning, steering, backing, parking, merging, exiting and driving in traffic.","Class 1 and code 20 tests add coupling and uncoupling a tractor unit from a trailer.","Bring a safe, representative, properly licensed and insured vehicle; unsafe vehicles get the test cancelled.","Passing with an automatic transmission restricts a Class 1, 2 or 3 licence to automatics only."],"mustKnow":["A Class 1 road test takes about two hours; Class 2, 3, 4 and heavy trailer tests take less than two hours","No-show fee applies without 48 hours notice or a valid reason; arrive at least 15 minutes early","Class 1 test vehicle: loaded tandem/tridem tractor-trailer with air brakes, on-road loaded weight at least 28,000 kg","Class 1 semi-trailer must be at least 13 metres long (7.5 metres if pintle hitch trailer)","Heavy trailer endorsement test: trailer with its load must weigh at least 4,600 kg, no air brakes"],"check":[{"q":"About how long does a Class 1 road test take?","choices":["Two hours","30 minutes","Four hours","One hour"],"answerIndex":0,"explanation":"A Class 1 road test takes about two hours; other commercial tests take less than two hours."},{"q":"How much must the loaded Class 1 road test vehicle weigh on the road, at minimum?","choices":["4,600 kg","28,000 kg","40,500 kg","63,500 kg"],"answerIndex":1,"explanation":"The Class 1 test requires a loaded tractor-trailer with an on-road loaded weight of at least 28,000 kg."}]}],"summary":["Each licence class (1-4) covers specific vehicles, with minimum ages of 19 (18 for Class 3) and a full-privilege Class 5 prerequisite.","Air brake vehicles need a code 15 endorsement; trailers over 4,600 kg without air brakes need a code 20 heavy trailer endorsement.","The application path is: knowledge and signs tests, learner's licence, supervised practice, road test with pre-trip inspection, then medical form.","All new Class 1 drivers must complete MELT, a one-time course that includes air brake training.","Keeping a commercial licence means regular medical reports on a set age schedule and re-examination whenever RoadSafetyBC asks."]},"2":{"chapter":2,"title":"heavy vehicle braking","objectives":["Explain why heavy vehicles take longer to stop than smaller passenger vehicles","Describe the basic scientific principles of braking, including how friction converts motion into heat","Identify the elements that make up total stopping distance","State the effects of doubling weight and speed on the stopping power required","Explain how to brake safely on ice, downgrades, water and with ABS-equipped combination vehicles"],"sections":[{"title":"Power to move, power to stop and stopping distance","points":["An engine converts heat energy into motion; brakes do the opposite, converting motion back into heat through friction.","Brake linings rub against drums, or pads against rotors; the heat is absorbed and dissipated mostly through the drums/rotors.","A loaded tractor-trailer may take over one kilometre and one minute to reach 100 km/h, but must stop far faster.","An emergency stop in about seven seconds needs roughly nine times the acceleration force — about 4,000 hp of stopping force.","With 16 brakes sharing the work, a few out-of-adjustment brakes overload the rest and lengthen stopping distance.","Total stopping distance is see-think-do: perception, reaction, brake lag and braking time combined.","Heavy vehicle drivers should never follow closer than five seconds at highway speeds."],"mustKnow":["An average driver's reaction time is about 3/4 of a second (plus about 3/4 of a second perception time)","Air brake lag time is approximately 4/10 of a second between applying and the brakes beginning to function","Total stopping time = perception time + reaction time + brake lag time + braking time","Heavy vehicles: never less than five seconds behind the vehicle ahead at highway speeds","Stopping a tractor-trailer in seven seconds takes about nine times the acceleration force — approximately 4,000 hp"],"check":[{"q":"What is the approximate brake lag time of an air brake system?","choices":["3/4 of a second","2 seconds","4/10 of a second","1/9 of a second"],"answerIndex":2,"explanation":"Air brakes have a lag of about 4/10 of a second between application and the brakes functioning."},{"q":"At highway speeds, how far behind the vehicle ahead should a heavy vehicle driver stay?","choices":["At least two seconds","At least five seconds","At least ten seconds","At least one second"],"answerIndex":1,"explanation":"Drivers of buses, trucks and other large heavy vehicles should never be less than five seconds behind."}]},{"title":"Speed, weight and brake heat","points":["More speed or more weight means more stopping power is needed and a longer stopping distance.","Doubling speed quadruples the stopping power needed; doubling weight doubles it; doubling both needs eight times.","Trucks and buses have bigger brakes and more linings than cars, yet still take longer to stop.","Going downhill lengthens stopping distance because of gravity; going uphill shortens it.","Excessive hard braking builds heat faster than brakes can dissipate it; hot drums expand away from the linings.","Too much heat causes brake fade, brake damage or failure — components or tires can even catch fire."],"mustKnow":["2 x vehicle speed requires 4 x the stopping power","2 x vehicle weight requires 2 x the stopping power","2 x speed and 2 x weight together require 8 x the stopping power","Brakes heat to about 120 degrees C in normal stopping and should not exceed about 250 degrees C under hard braking","Heavy tractor-trailer combinations can weigh up to 63,500 kg when loaded"],"check":[{"q":"If you double your vehicle's speed, how much more stopping power do you need?","choices":["Two times","Three times","Eight times","Four times"],"answerIndex":3,"explanation":"Doubling speed requires four times the stopping power; doubling weight only doubles it."},{"q":"What temperature should brake components not exceed under hard braking?","choices":["About 250 degrees C","About 120 degrees C","About 500 degrees C","About 100 degrees C"],"answerIndex":0,"explanation":"Brakes operate best around 120 degrees C and should not exceed about 250 degrees C."}]},{"title":"Retarders","points":["Retarders provide auxiliary slowing, such as controlling speed on long downgrades, saving the main brakes for emergencies.","The four main types are engine, exhaust, hydraulic driveline and electric driveline retarders.","Many retarders can absorb as much or more horsepower than the engine develops.","Engine retarders work best at higher engine r.p.m. and lower vehicle speed, so select your gear before the hill.","On slippery roads, retarders can lock the drive wheels, stall the engine, or even jackknife a tractor-trailer.","Obey municipal signs restricting engine retarder/engine brake use."],"mustKnow":["Four main types of retarders: engine, exhaust, hydraulic driveline, electric driveline","Engine retarders are most effective at higher r.p.m. with the transmission in a low gear","Select your gear before you start down a hill — you're more likely to miss a shift on the downgrade"],"check":[{"q":"When is an engine retarder most efficient?","choices":["At low r.p.m. and high speed","At higher r.p.m. and lower vehicle speed","Only when the brakes are hot","In the highest gear available"],"answerIndex":1,"explanation":"Engine retarders are more efficient at a higher engine r.p.m. and a lower vehicle speed."},{"q":"Which of these is NOT one of the four main types of retarders?","choices":["Exhaust retarder","Hydraulic driveline retarder","Engine retarder","Air driveline retarder"],"answerIndex":3,"explanation":"The four main types are engine, exhaust, hydraulic driveline and electric driveline retarders."}]},{"title":"Braking technique: ice, downgrades, water and runaway lanes","points":["On ice, use extremely light brake pressure — a slowly revolving wheel grips better than a locked, skidding wheel.","Use snow tires and/or properly sized, tightly mounted chains; mount them in chain-up areas, not on the hill.","Descend in a lower gear than you climbed with; never shift to a higher gear on a downgrade unless speed is controlled.","Pick a safe speed, a low gear and the retarder so you can descend without using the service brakes.","If speed still climbs, brake hard enough to drop 10 to 15 km/h, then downshift, and repeat as needed.","Through water, keep a slight drag on the brakes, then apply light pressure afterward to dry them out.","Runaway lanes beside downhill grades are only for slowing or stopping when brakes fail — never for anything else."],"mustKnow":["Fines up to $2,000 for operating a vehicle with brakes not adjusted correctly or not performing adequately","On a downgrade, apply brakes hard enough to reduce speed by 10 to 15 km/h, then downshift to a lower main gear","Almost all brake failures and downhill runaway crashes are caused by poor speed control (overdriving the brakes)","Keep your vehicle in gear all the way down the hill"],"check":[{"q":"If speed keeps rising on a downgrade, how much should each brake application reduce your speed?","choices":["5 km/h","20 to 25 km/h","10 to 15 km/h","30 km/h"],"answerIndex":2,"explanation":"Apply the brakes hard enough to reduce speed by 10 to 15 km/h, then downshift to a lower main gear."},{"q":"What should you do with the brakes while driving through water on the roadway?","choices":["Place a slight constant drag on them","Pump them rapidly","Avoid touching them entirely","Apply them fully and release"],"answerIndex":0,"explanation":"A slight drag on the brakes reduces the amount of water entering the brake drums and shoes."}]},{"title":"Combination braking, ABS and traction control","points":["In an air brake vehicle, all brakes apply at the same time and the same pressure when you press the pedal.","Braking too hard, or using only trailer brakes on slippery roads, can lock wheels and cause a skid or jackknife.","Brakes, tires and suspension work best when the vehicle is legally loaded and weight is properly distributed among axles.","ABS prevents wheel lockup from overbraking on slippery surfaces, but doesn't let you drive faster or stop sooner.","With ABS, apply firm, continuous pedal pressure — never pump — and expect normal noise, movement and shudder.","If tractor and trailers don't all have ABS, brake as if the combination has no ABS.","ATC uses the ABS wheel sensors to brake a spinning drive wheel and can reduce engine power in slippery conditions."],"mustKnow":["ABS is mandatory in Canada on all trucks and buses over 4,560 kg manufactured since April 1, 2000, and on all commercial trailers with air brakes","A full jackknife occurs when tractor and trailer form an angle of 90 degrees or less — possible even at very low speeds","On some surfaces such as gravel, braking distance with ABS may be longer"],"check":[{"q":"What is the correct way to make an emergency stop with ABS?","choices":["Pump the brakes on and off","Apply firm, hard continuous pressure until the vehicle stops","Apply only the trailer brakes","Brake lightly and steer hard"],"answerIndex":1,"explanation":"Pumping turns ABS on and off; apply firm, continuous pressure to the brake pedal until stopped."},{"q":"ABS is mandatory on trucks and buses over what weight manufactured since April 1, 2000?","choices":["28,000 kg","63,500 kg","10,000 kg","4,560 kg"],"answerIndex":3,"explanation":"ABS is mandatory on all trucks and buses over 4,560 kg built since April 1, 2000."}]}],"summary":["Brakes are heat machines: friction converts the energy of motion into heat, which drums and rotors must absorb and dissipate.","Total stopping distance adds perception, reaction, brake lag and braking time — so heavy vehicles keep at least five seconds back.","Doubling speed needs four times the stopping power; doubling weight doubles it; both together need eight times.","Control downgrade speed with a low gear and retarder so service brakes stay cool; overheating causes brake fade and failure.","With ABS, brake firmly and continuously without pumping; know which units in a combination have ABS before you need it."]},"3":{"chapter":3,"title":"basic driving skills","objectives":["Explain safe following-distance rules for different commercial vehicle types and various techniques for driving safely in traffic","Define the term danger zone and describe how to reduce the size of your danger zone","Identify the factors that affect your vehicle's turning characteristics, including off track, and techniques to help you turn safely","Describe how to back up safely, with and without a guide","State when and how to shift gears, including double-clutching and progressive shifting","Identify potential vehicle and personal safety issues and describe how to reduce risks for yourself and other road users"],"sections":[{"title":"Sharing the road","points":["Use the two-second rule in a taxi, limousine, ride-hailing vehicle, ambulance or van; leave more space behind motorcycles.","Buses, trucks and other heavy vehicles need at least five seconds; increase it when conditions are less than ideal.","Match the traffic flow within the speed limit; faster or slower than the flow raises your crash risk.","Let tailgaters pass — they may sit in the blind spot directly behind you; keep stops gradual.","Use the right lane when slower than traffic, and four-way flashers driving slowly up or down hills.","Your danger zone is the road you travel before you can stop; it grows with speed and poor roads.","Reduce your danger zone by slowing down and covering the brake pedal when you see a potential hazard."],"mustKnow":["Two-second following distance: taxi, limousine, ride-hailing vehicle, ambulance or van.","At least five-second following distance: bus, truck or other heavy vehicle.","Leave at least 60 m (200 ft) between large commercial vehicles on a highway.","Vehicles travelling at less than 40 km/h should display a red triangle slow moving vehicle sign."],"check":[{"q":"What minimum following distance should you keep when driving a bus, truck or other heavy vehicle in ideal conditions?","choices":["Two seconds","Three seconds","Five seconds","Ten seconds"],"answerIndex":2,"explanation":"Heavy vehicles need more time and distance to stop, so keep at least a five-second following distance."},{"q":"On a highway, how much space should you leave between your large commercial vehicle and other large commercial vehicles?","choices":["30 m (100 ft)","60 m (200 ft)","100 m (330 ft)","150 m (500 ft)"],"answerIndex":1,"explanation":"The manual says to leave at least 60 m (200 ft) between large commercial vehicles on a highway."}]},{"title":"Manoeuvring: turns, off track and roundabouts","points":["Seat position (conventional, cab-over, forward-control) changes your viewpoint, so you start turns at different points.","Off track: rear wheels follow a different path than front wheels; longer wheelbases and combinations off-track more.","Inertia pushes you off a curve's path — slow down before the curve and apply gradual power through it.","Turning right too tightly can scrape curbs, crowd cyclists, or hit poles; keep your rear close to the curb.","The most dangerous point turning right is when the tractor has turned but the trailer hasn't.","With two left-turn lanes, turn from the right-hand turn lane to accommodate off tracking.","In roundabouts, yield to traffic in the circle; a large vehicle may need more than one lane."],"mustKnow":["If another vehicle arrives at a traffic circle at the same time as you, yield to the vehicle on your right.","Go around traffic circles and roundabouts to the right (counter-clockwise).","Large trucks and buses may encroach on the median or drive over the truck apron to get through."],"check":[{"q":"What is \"off track\"?","choices":["The difference between the path of the front wheels and the path of the rear wheels","The distance a vehicle skids when braking hard","The gap between a trailer and the curb during a turn","The turning radius of the steering tires"],"answerIndex":0,"explanation":"Off track is the difference between the paths of the front and rear wheels when moving around a curve."},{"q":"An intersection has two left-turn lanes. Which lane should you turn from in a large commercial vehicle?","choices":["Either lane","The leftmost lane","The centre of both lanes","The right-hand turn lane"],"answerIndex":3,"explanation":"The right-hand turn lane better accommodates your vehicle's off tracking."}]},{"title":"Backing up","points":["With few exceptions, you're responsible for any crash that happens while you're backing up.","Avoid backing up whenever possible; if you must, plan ahead to minimize the distance.","Use a guide whenever possible, positioned with a clear, continuous view and visible to you throughout.","Without a guide, walk completely around the vehicle first and repeat every vehicle length.","Back out of traffic rather than into traffic, and back to the view side, not the blind side.","A series of short backing-up manoeuvres is safer than one long one."],"mustKnow":["Sound your horn at least once every vehicle length to warn other road users you're about to move.","Without a guide, get out and walk completely around the vehicle before backing; repeat every vehicle length."],"check":[{"q":"When backing up, how often should you sound your horn?","choices":["Only before you start","Every 30 seconds","At least once every vehicle length","Only when someone is visible behind"],"answerIndex":2,"explanation":"Sound the horn at least once every vehicle length to warn other road users that you're moving."}]},{"title":"Seeing and being seen","points":["Large vehicles have blind spots in front of the hood, alongside (especially the passenger side) and directly behind.","Scan ahead, behind and to the sides constantly; check mirrors frequently and never assume other drivers see you.","A \"stale\" green light has been green a while — expect it to change and be prepared to stop.","On freeways, use the far right or centre lane; fewer lane changes means less collision risk.","For emergency vehicles with flashing lights and siren, pull parallel to the nearest edge, stop clear of intersections.","Your air turbulence can endanger cars and cyclists riding near your vehicle; slow down until they're out.","Help drivers pass you safely by reducing speed and giving them room, but don't wave them past."],"mustKnow":["Passing stopped vehicles with flashing lights: no faster than 70 km/h where the limit is 80 km/h or more.","No faster than 40 km/h where the limit is less than 80 km/h.","If you're in the lane nearest the stopped vehicle, also change lanes if it's safe to do so.","Convex or spot mirrors make things look smaller and farther away than they actually are."],"check":[{"q":"The speed limit is 100 km/h. How fast may you drive when passing a stopped vehicle displaying flashing lights?","choices":["No faster than 40 km/h","No faster than 70 km/h","No faster than 80 km/h","The posted limit, if you change lanes"],"answerIndex":1,"explanation":"Where the limit is 80 km/h or more, you must drive no faster than 70 km/h when passing stopped vehicles with flashing lights."},{"q":"A small vehicle keeps riding in your area of air turbulence. What should you do?","choices":["Slow down until it's out","Speed up to pull away","Sound your horn continuously","Change lanes immediately"],"answerIndex":0,"explanation":"The manual says to slow down until the smaller vehicle is out of your area of turbulence."}]},{"title":"Shifting gears and parking","points":["Most heavy manual transmissions lack synchromesh gears, so you must become skilled at double-clutching.","Upshifting goes to a higher gear to go faster; downshifting goes lower as you slow down.","Operate between peak torque and peak horsepower — the engine's normal operating r.p.m. range; a tachometer helps.","Shift progressively: use only enough torque to get moving, then shift to the next higher gear.","Before a curve, slow down and downshift to a gear that lets you use engine power throughout.","When parking, set parking brakes, put transmissions in gear (low forward uphill, reverse downhill) and block wheels on grades.","Never use a trailer hand valve to hold an unattended unit — air may drain and release the brakes."],"mustKnow":["Double-clutching means depressing the clutch pedal twice in the process of moving from one gear to another.","Single-unit vehicle uphill with a curb: turn wheels left toward the centre of the road.","Single-unit vehicle uphill with no curb: turn wheels right toward the edge of the roadway.","Tractor-trailer uphill, with or without a curb: always turn wheels left; on any downgrade, always turn wheels right.","A two-speed axle must be left in low range when parked."],"check":[{"q":"What does double-clutching mean?","choices":["Using two clutch pedals at once","Holding the clutch down through the whole shift","Skipping a gear when upshifting","Depressing the clutch pedal twice while moving from one gear to another"],"answerIndex":3,"explanation":"Double-clutching is depressing the clutch pedal twice in the process of moving from one gear to another."},{"q":"You park a single-unit vehicle facing uphill where there's a curb. Which way do you turn the wheels?","choices":["Straight ahead","Left, toward the centre of the road","Right, toward the edge of the roadway","It doesn't matter if the parking brake is set"],"answerIndex":1,"explanation":"For a single-unit vehicle on an uphill with a curb, turn the wheels left toward the centre of the road."}]},{"title":"Crossings: intersections and railways","points":["Never assume you have the right-of-way; give the right-of-way, don't try to take it.","Get in the proper lane well before turning, signal, and slow gradually; watch for stale green lights.","Don't change lanes, pass or overtake while approaching or going through an intersection.","From an alley, lane or side road, stop before the sidewalk and yield to pedestrians and highway traffic.","At controlled railway crossings, stop when signalled; never cross if the gate is down.","School buses with children, buses with passengers, and vehicles carrying explosive, poisonous or flammable cargo must stop at uncontrolled main crossings.","Never shift gears while crossing railway tracks, and be sure there's room for your vehicle beyond the tracks."],"mustKnow":["Stop five to 15 m from a railway crossing.","Don't park any vehicle within 15 m of the nearest rail of a railway crossing.","Check the track is clear far enough to give you at least 10 seconds to cross.","The maximum speed in a lane or alley is 20 km/h unless otherwise posted."],"check":[{"q":"How far from a railway crossing should you stop?","choices":["1 to 3 m","3 to 5 m","5 to 15 m","15 to 30 m"],"answerIndex":2,"explanation":"The manual says to stop five to 15 m from the railway crossing."},{"q":"What is the maximum speed in a lane or alley unless otherwise posted?","choices":["20 km/h","30 km/h","40 km/h","50 km/h"],"answerIndex":0,"explanation":"The maximum speed in a lane or alley is 20 km/h unless otherwise posted."}]},{"title":"Conditions and vehicle safety","points":["Watch for animals at dusk and dawn, in spring and fall; if you see one animal, expect more.","If you can't avoid a large animal, brake firmly, steer to strike at an angle, easing off the brake just before impact.","On ice, sleet or snow, test steering and brakes at slow speed, reduce speed and use chains if necessary.","At night, travel at a speed that lets you stop within the distance you can see — high beams light only about 100 m.","Underinflated tires overheat, wear the tread's outer edges and increase hydroplaning risk; check pressure when tires are cool.","Don't drive with loose or missing lug nuts, stripped studs or cracked rims; retorque wheel nuts after changing a tire.","Air- or vacuum-brake vehicles need failure warning devices, and every vehicle needs two braking systems, one mechanical."],"mustKnow":["Switch from high beam to low beam at least 150 m from any vehicle you're approaching or following.","Defective tire tread: less than 3 mm front or 1.6 mm rear (GVW 5,500 kg or more); less than 1.6 mm on a trailer; less than 3.5 mm for a winter tire.","Tires are defective with tread cuts, cracks or snags longer than 2.5 cm (1 in) deep enough to expose ply cords.","Disabled vehicle: place warning devices approximately 30 m ahead and 30 m behind.","Approved warning devices required for vehicles seating more than 10 passengers or with overall/load width over 2.3 m; daylight flags at least 30 cm by 30 cm."],"check":[{"q":"On a vehicle with a GVW of 5,500 kg or more, a front tire is defective when its tread depth is less than:","choices":["1.6 mm","2.5 mm","3.5 mm","3 mm"],"answerIndex":3,"explanation":"Front tires need at least 3 mm (1/8 in) of tread on vehicles with a GVW of 5,500 kg or more."},{"q":"Where should you place warning devices when your commercial vehicle becomes disabled?","choices":["10 m ahead and behind","About 30 m ahead and 30 m behind","Only 60 m behind","At the vehicle's front and rear bumpers"],"answerIndex":1,"explanation":"Place warning devices approximately 30 m ahead and 30 m behind the disabled vehicle."}]},{"title":"Personal safety","points":["Carbon monoxide is odourless, colourless and tasteless; if you feel dizzy or drowsy, pull over and get fresh air.","Wear your seatbelt with the lap belt low over the pelvis and the shoulder strap snug across the chest.","Hand-held electronic devices are prohibited while driving; hands-free single-button devices are permitted for non-GLP drivers.","Alcohol, marijuana, illicit drugs and even some prescribed or stay-awake drugs can impair your driving.","Police can prohibit you if impairment is suspected — no need for BAC over .08 or 2 nanograms THC.","Stay-awake tablets don't reduce mental fatigue; there's no safe substitute for proper rest or sleep.","Never use water on gasoline or oil fires; don't open the hood to fight an under-hood fire."],"mustKnow":["Correct lap and shoulder belt use reduces the likelihood of death in a crash by 50 per cent; some drivers are exempt at 40 km/h or less.","Allow at least 25 cm (10 in) between your breastbone and the steering-wheel airbag unit.","Police can impound a vehicle for seven days, escalating to 30 or 60 days for repeat offenders; excessive speeding is 40 km/h or more over the limit.","A BC-marked extinguisher puts out grease, oil, gasoline and electrical fires; ABC also puts out Class A fires like paper and cloth.","Vehicles transporting explosives must carry two fire extinguishers; school buses, public passenger vehicles and limited passenger vehicles seating more than 10 must carry one."],"check":[{"q":"By how much does correct use of a lap and shoulder belt system reduce the likelihood of death in a crash?","choices":["50 per cent","25 per cent","75 per cent","90 per cent"],"answerIndex":0,"explanation":"Correct lap and shoulder belt use is estimated to reduce the likelihood of death in a crash by 50 per cent."},{"q":"How many fire extinguishers must a vehicle transporting explosives carry?","choices":["None","One","Two","Four"],"answerIndex":2,"explanation":"Vehicles transporting explosives must carry two fire extinguishers."}]}],"summary":["Keep a two-second following distance in taxis, limousines, ambulances or vans, and at least five seconds in buses and trucks.","Slow down to shrink your danger zone, cover the brake near hazards, and allow for off track in every turn.","Back up only when necessary: use a guide, sound your horn each vehicle length, and back to the view side.","Know the exam numbers: 60 m between big rigs, 70/40 km/h past flashing lights, 5-15 m railway stop, 30 m warning devices, 150 m headlight dimming.","Protect yourself: wear your seatbelt, avoid hand-held devices, never drive impaired or fatigued, and carry the required fire extinguishers."]},"4":{"chapter":4,"title":"fuel-efficient driving","objectives":["Explain fuel-efficient driving techniques that let you drive smart and save money","Identify vehicle maintenance practices that help conserve fuel","List commercial vehicle components and features that help make a vehicle more fuel efficient","State how driving habits, idling and trip planning affect fuel consumption"],"sections":[{"title":"Why fuel efficiency matters and making smart choices","points":["Fuel-efficient driving controls fuel costs and reduces greenhouse gas emissions.","Nearly 30 per cent of all greenhouse gas emissions in Canada are produced by vehicles.","Fuel-efficient driving techniques can improve fuel economy by up to 30 per cent.","Fuel-efficient driving is also safe driving: look ahead, keep space margins, anticipate hazards.","Smart practices include trip planning, maintenance and inspections, proper starting, proper driving, and reducing idle time."],"mustKnow":["Nearly 30 per cent of all greenhouse gas emissions in Canada are produced by vehicles.","Fuel-efficient driving techniques can improve fuel economy by up to 30 per cent."],"check":[{"q":"Approximately how much can fuel-efficient driving techniques improve fuel economy?","choices":["Up to 10 per cent","Up to 20 per cent","Up to 30 per cent","Up to 50 per cent"],"answerIndex":2,"explanation":"The manual states fuel-efficient driving techniques can improve fuel economy by up to 30 per cent."},{"q":"About what share of greenhouse gas emissions in Canada is produced by vehicles?","choices":["Nearly 30 per cent","Nearly 10 per cent","Nearly 50 per cent","Nearly 70 per cent"],"answerIndex":0,"explanation":"Nearly 30 per cent of all greenhouse gas emissions in Canada come from vehicles."}]},{"title":"Preparation, planning and starting the engine","points":["Use the correct fuel for the season; summer fuel can improve economy but causes cold-weather engine problems.","Consider biodiesel: similar power, less carbon dioxide and sulfur, low particulate emissions.","Plan routes to avoid heavy commuter traffic, busy city driving and hills; flat highway routes are most efficient.","Snow-covered roads can increase fuel consumption by 15 to 20 per cent; adjust speed and following distance.","Start with zero throttle and never pump the throttle; it wastes fuel.","Warm up three to five minutes only, or seven to 10 minutes below 0 degrees C.","Check oil and air pressure rise to normal ranges; use ether sparingly and only if permitted."],"mustKnow":["Summer fuel can improve fuel economy by as much as three per cent.","Driving on snow-covered roads can increase fuel consumption by 15 to 20 per cent.","Warm up the engine three to five minutes only, or seven to 10 minutes if below 0 degrees C.","A flat multi-lane highway improves fuel efficiency four to 11 per cent over a flat two-lane, up to 18 per cent over mountainous, and 25 to 35 per cent over suburban roads."],"check":[{"q":"How long should you let a heavy-duty diesel engine warm up when the temperature is below 0 degrees C?","choices":["One to two minutes","Three to five minutes","Seven to 10 minutes","At least 20 minutes"],"answerIndex":2,"explanation":"Warm up three to five minutes normally, but seven to 10 minutes when the temperature is below 0 degrees C."},{"q":"By how much can driving on snow-covered roads increase fuel consumption?","choices":["5 to 10 per cent","15 to 20 per cent","25 to 35 per cent","40 to 50 per cent"],"answerIndex":1,"explanation":"The manual states snow-covered roads can increase fuel consumption by 15 to 20 per cent."}]},{"title":"Smart driving techniques and reducing idling","points":["Accelerate slowly after warm-up, keeping engine rpm down for several kilometres.","Practise progressive shifting, run in the highest gear range, and always use the clutch.","Back off the throttle over hill crests, use cruise control where appropriate, and reduce average speed.","Use see-think-do to anticipate hazards and keep a constant speed; power not used is fuel not burned.","Keep at least five seconds behind the vehicle ahead at highway speeds.","Anticipate stops and traffic lights; easing off the throttle beats braking at the last minute.","Turn the engine off when stopped for any length of time; idling wastes fuel and money."],"mustKnow":["Shifting gears properly can improve operating costs by 30 per cent.","Driving 105 km/h instead of 90 km/h is 15 per cent faster but consumes about 20 per cent more fuel.","Large heavy vehicles should never be less than five seconds behind the vehicle ahead at highway speeds.","Idling can burn up to four litres of fuel per hour; cutting one hour a day saves over 1,000 litres and over $1,500 per year at $1.50 per litre."],"check":[{"q":"How much fuel can idling burn per hour?","choices":["Up to one litre","Up to two litres","Up to three litres","Up to four litres"],"answerIndex":3,"explanation":"Idling can burn up to four litres of fuel per hour."},{"q":"Driving at 105 km/h instead of 90 km/h consumes about how much more fuel?","choices":["5 per cent","20 per cent","35 per cent","50 per cent"],"answerIndex":1,"explanation":"You travel 15 per cent faster but consume about 20 per cent more fuel."}]},{"title":"Maintenance and choosing a fuel-efficient vehicle","points":["Regular maintenance keeps fuel efficiency up; fix small problems before they become big.","Inflate tires to manufacturer's recommendations and check fluid levels; do pre-trip, enroute and post-trip inspections.","Conduct enroute inspections, including tires and cargo, at least every three hours.","Choose the right truck for the job; a lighter truck carrying the same payload saves fuel.","Aerodynamic features like sloped hoods, roof fairings, trailer side skirts and gap reducers cut fuel use.","Rib tread tires beat lug tread on drive and steering axles; super-singles lower rolling resistance and weight.","Keep flatbed loads low and tarped; accessories like block heaters and on-board computers help efficiency."],"mustKnow":["For every 10 p.s.i. (69 kPa) a tire is underinflated, one per cent of fuel is wasted.","Conduct enroute inspections, including tires and cargo, at least every three hours.","Low-viscosity lubricants such as synthetic motor oil can improve fuel economy by up to four per cent.","At 90 to 100 km/h, about 50 per cent of fuel consumed is used to overcome air resistance.","Aerodynamic features can improve fuel economy by 15 to 20 per cent."],"check":[{"q":"How much fuel is wasted for every 10 p.s.i. (69 kPa) that a tire is underinflated?","choices":["One per cent","Five per cent","10 per cent","15 per cent"],"answerIndex":0,"explanation":"For every 10 p.s.i. (69 kPa) of underinflation, one per cent of fuel is wasted."},{"q":"At speeds between 90 and 100 km/h, about how much of the fuel consumed is used to overcome air resistance?","choices":["10 per cent","25 per cent","50 per cent","75 per cent"],"answerIndex":2,"explanation":"About 50 per cent of fuel consumed at 90 to 100 km/h goes to overcoming air resistance."}]}],"summary":["Fuel-efficient driving can improve fuel economy by up to 30 per cent and is also safe driving.","Plan routes, use seasonal fuel, and warm up three to five minutes (seven to 10 below 0 degrees C).","Drive smoothly: progressive shifting, steady speeds, five-second following distance, and anticipate stops.","Turn the engine off when stopped; idling burns up to four litres of fuel per hour.","Maintain tires, fluids and filters, and choose aerodynamic, properly specified vehicles to save fuel."]},"5":{"chapter":5,"title":"skills for driving trucks and trailers","objectives":["Describe the safety considerations and basic techniques for driving with a trailer","List the steps for coupling and uncoupling a tractor and trailer","Identify the devices for securing loads and explain how to use them to safely secure a load","Explain how to safely handle special cargo such as livestock and liquid tank loads","List the nine classes of dangerous goods and state the legal responsibilities when transporting them","State the allowable vehicle and load dimensions and the requirements for oversize loads, permits and weigh scales"],"sections":[{"title":"driving with a trailer","points":["To back a semi-trailer, first steer opposite to where you want the trailer to go, then follow its path.","If the tractor doesn't follow a path matching the trailer's, you risk jackknifing; a right-angle back-up follows an S-shaped curve.","Keep cargo low, centred and spread out — a higher centre of gravity makes rollover more likely.","With doubles, couple the heavier trailer to the tractor; the last trailer is most likely to roll over.","Never unlock the pintle hook with the dolly still under the rear trailer — the tow bar may fly up.","Whipping or swerving can come from speed, sudden steering, bad connections, shifted loads, dragging brakes or a flat tire.","If the trailer whips or swerves, slow down, stop when safe, and check the vehicle and load."],"mustKnow":["The last trailer in a doubles combination is the most likely to roll over.","Block the wheels of a parked trailer so it can't roll.","Without spring brakes, trailer brakes release as air pressure drops; with spring brakes, they remain applied."],"check":[{"q":"When you start backing a tractor with a semi-trailer, which way do you turn the steering wheel?","choices":["Opposite to the direction you want the trailer to go","The same direction you want the trailer to go","Straight, making no steering input","Fully to the left in all cases"],"answerIndex":0,"explanation":"Turn the wheel opposite to where you want the trailer to go, then reverse the input once the trailer begins to turn."},{"q":"When towing two trailers, which trailer should be coupled to the tractor?","choices":["The lighter trailer","The more heavily loaded trailer","The longer trailer","The trailer without spring brakes"],"answerIndex":1,"explanation":"Couple the more heavily loaded trailer to the tractor with the lighter trailer behind."}]},{"title":"coupling and uncoupling with a fifth wheel","points":["Inspect the fifth wheel for damage, lubrication and security; it must tilt down toward the rear with jaws open.","Block trailer wheels, check the kingpin and apron, and make sure trailer brakes are applied before coupling.","Back up straight and slowly; stop when the fifth wheel just touches the trailer apron, then check height and alignment.","After connecting, check no space or daylight between fifth wheel and apron and the release handle is locked.","Go under the trailer with a flashlight to confirm the jaws are closed around the kingpin; remove ignition keys first.","Do a tug test against the trailer brakes with landing gear slightly raised, then raise the gear fully.","To uncouple: line up, ease jaw pressure, block wheels, lower landing gear, disconnect lines, pull release handle, pull ahead slowly."],"mustKnow":["If a trailer has no spring brakes, connect the air lines, charge the trailer system and apply trailer brakes before coupling.","Both landing gear supports must touch the ground to support a trailer.","A trip inspection report is required for every new trailer you pick up each day."],"check":[{"q":"When backing under a trailer, when should you stop before checking height and alignment?","choices":["When the kingpin locks into the jaws","When the tractor wheels touch the landing gear","When the fifth wheel just touches the trailer apron","When the trailer moves backward slightly"],"answerIndex":2,"explanation":"Stop when the fifth wheel just touches the trailer apron so you can check height and alignment before connecting."},{"q":"How do you test that the fifth wheel connection is secure after coupling?","choices":["Drive at highway speed and brake hard","Gently tug against the applied trailer brakes","Rock the trailer sideways with the landing gear up","Apply full throttle in reverse"],"answerIndex":1,"explanation":"With tractor brakes released and trailer brakes applied, gently tug forward to confirm the kingpin is held by the jaws."}]},{"title":"pintle hitches and other connections","points":["A pintle hitch uses a hook on the front vehicle and an eye on the trailer; some have a ram to remove slack.","Any coupling device other than a fifth wheel must also use safety chains or cables equal in strength to the coupling device.","Adjust the drawbar so the pintle eye sits just slightly higher than the pintle hook before backing the final distance.","After lowering the eye onto the hook, close the safety latch and attach safety cables and/or chains.","A converter dolly — an axle, fifth wheel and hitch — is used when towing more than one trailer.","If trailer brakes don't release when you charge the trailer system, the air lines may be crossed.","Fasten disconnected air lines to dead-end (dummy) connectors to keep out dirt and prevent chafing."],"mustKnow":["The drawbar or connection between motor vehicle and trailer may not be more than five metres long unless towing a pole trailer.","Safety chains or cables must be equal to the strength of the coupling device.","Coupling devices must be fastened to a structurally adequate part of the frame of each vehicle."],"check":[{"q":"What is the maximum length of a drawbar between a motor vehicle and trailer, unless towing a pole trailer?","choices":["Two metres","Three metres","Four metres","Five metres"],"answerIndex":3,"explanation":"The drawbar or other connection may not exceed five metres unless you're towing a pole trailer."},{"q":"Which connection type requires safety chains or cables?","choices":["A fifth wheel connection","Any coupling device other than a fifth wheel","Only converter dolly connections","No connections require chains"],"answerIndex":1,"explanation":"When using any coupling device other than a fifth wheel, chains or cables equal to the coupler's strength are required."}]},{"title":"loading and weight distribution","points":["Poor weight distribution can overload axles or tires, bend the frame and cause steering misalignment.","Place a concentrated heavy load partially over or just ahead of the rear axles, longest side down, securely blocked.","Never load one side heavily or load on the tailgate — this strains equipment and can cause collisions.","Five-ton freight trucks are designed for about 90 per cent of cargo weight on rear axles, 10 per cent on the steering axle.","Cement mixers and dump trucks are designed for about 70 per cent rear, 30 per cent steering axle.","The average semi-trailer's central weight distribution point is approximately the middle of the trailer."],"mustKnow":["Trailers should carry about 45 per cent of cargo weight on the trailer axle unit, 45 per cent on the drive axle unit and 10 per cent on the steering axle.","A tridem drive truck must have a loaded steering axle weight of at least 25 per cent of the tridem axle weight — 40 per cent with twin steering axles."],"check":[{"q":"Where should most of a concentrated heavy load be placed on a single-unit truck?","choices":["Directly against the cab","On the tailgate","Partially over or just ahead of the rear axles","Entirely on one side"],"answerIndex":2,"explanation":"Most of the load should be partially over or just ahead of the rear axles to get proper tire loading."},{"q":"How should cargo weight be distributed on a trailer?","choices":["45% trailer axles, 45% drive axles, 10% steering axle","90% trailer axles, 10% steering axle","70% trailer axles, 30% steering axle","Equal weight on all axles including steering"],"answerIndex":0,"explanation":"Trailers should have about 45 per cent on the trailer axle unit, 45 per cent on the drive axle unit and 10 per cent on the steering axle."}]},{"title":"securing cargo: tiedowns, working load limits and structures","points":["B.C. has adopted the North American Standard on cargo securement; it and Division 35 of the MVAR apply regardless of GVW.","Tiedowns must be taut, tightenable by the driver (except steel strapping), and protected by edge protectors where they contact cargo.","Never use tiedowns with cracked welds, bent or worn links, knots, cut webbing, missing wire strands or weakened anchor points.","Rub rails must not be used as anchor points; keep tiedowns inboard of rub rails if possible.","Lock every load binder handle in place with rope, wire, chain or a locking mechanism.","Aggregate loads like sand or gravel that could bounce, blow or drop must be covered with a tarp.","Loads projecting more than 1.2 m beyond the rear need a red flag by day or a red light at night."],"mustKnow":["The securement system must withstand 0.8g forward, 0.5g rearward, 0.5g sideways, and a downward force of at least 20 per cent of cargo weight.","Use two tiedowns for the first 3.04 m of load and one for every 3.04 m after that; the aggregate working load limit must be at least 50 per cent of cargo weight.","Unmarked tiedowns are prohibited as of January 1, 2010; an unmarked friction mat is assumed to resist 50 per cent of the cargo weight on it.","Front-end structures under 1.83 m must withstand 50 per cent of cargo weight (40 per cent if 1.83 m or taller), be at least 122 cm above the deck and resist penetration at 6.1 m/s² deceleration.","Front load projections: max one metre beyond front wheels or bumper; trailer fronts 2 m radius (TAC) or 2.25 m (non-TAC); rear projections max 4 m beyond the turn centre."],"check":[{"q":"What forward deceleration force must a cargo securement system withstand?","choices":["0.5g","0.8g","1.0g","0.2g"],"answerIndex":1,"explanation":"The system must withstand 0.8g deceleration forward, 0.5g rearward and 0.5g sideways."},{"q":"A 600 kg article 3.65 m long is not prevented from moving forward. Using tiedowns rated at 100 kg, how many are needed?","choices":["One","Two","Three","Six"],"answerIndex":2,"explanation":"Three tiedowns meet both the length rule (2 + 1 per extra 3.04 m) and the 50 per cent aggregate working load limit (300 kg)."}]},{"title":"specific cargo types and dangerous goods overview","points":["Log stakes must angle 90 degrees or less with the bunk; inspect log loads before entering a highway from a private road.","Metal coil and paper roll rules apply to shipments weighing 2,268 kg or more.","Vehicles under 4,500 kg GVW need at least two tiedowns; heavier vehicles need at least four tiedowns of 2,268 kg working load limit each.","Boulders over 5,000 kg or two cubic metres need hardwood blocking or a crib and at least two chains.","Use false bulkheads to bunch livestock with partial loads; leaning animals can shift the centre of gravity and cause rollover.","Hanging meat and unbaffled liquid tank loads have high centres of gravity and surge — slow down for curves, stops and starts.","Dangerous goods fall into nine classes; drivers must be trained, certified and carry complete shipping documents in the cab."],"mustKnow":["The nine dangerous goods classes: explosives, gases, flammable liquids, flammable solids, oxidizing substances and organic peroxides, poisonous and infectious substances, radioactive materials, corrosives, and miscellaneous products.","Report any dangerous goods incident immediately to local police or the Provincial Emergency Program at 1-800-663-3456.","Stacked or crushed vehicle tiedowns must have a working load limit of at least 2,268 kg and must not be synthetic webbing."],"check":[{"q":"How many classes of dangerous goods are there?","choices":["Five","Seven","Nine","Twelve"],"answerIndex":2,"explanation":"There are nine classes, from explosives through miscellaneous products or substances."},{"q":"A heavy vehicle over 4,500 kg carried as cargo must be restrained by at least how many tiedowns?","choices":["Four, each with a working load limit of at least 2,268 kg","Two, one front and one rear","Three, equally spaced","One winch at the front only"],"answerIndex":0,"explanation":"Vehicles over 4,500 kg need a minimum of four tiedowns, each with a working load limit of at least 2,268 kg."}]},{"title":"dimensions, permits, pilot cars and weigh scales","points":["Know your height, width, length and weight at all times and obey all posted dimension and weight signs.","Items like mud flaps, load securement devices, ladders and placards may extend up to 10 cm beyond the sides without counting as width.","GVW is vehicle plus load; GVWR is the manufacturer's rating; licensed GVW is at least 1.5 times the vehicle's net weight.","Oversize permits are required before operating overwidth, overlength or overheight vehicles, loaded or not.","Mark oversize extremities with red flags at least 30 cm by 30 cm; at night use amber lights front and red lights rear.","A pilot car warns other drivers and must carry a D (over dimension) sign when required.","Fixed and portable weigh scales operate throughout B.C.; follow light board directions and bring papers in if asked."],"mustKnow":["Maximum legal width of a vehicle and load is 2.6 m; loose hay or straw vehicles may be up to 3.1 m wide.","Maximum allowable height is 4.15 m without an oversize load permit.","Permits are not normally given for loads or vehicles wider than 4.4 m.","A pilot car must travel between 100 and 500 m behind or in front of the oversize vehicle.","Vehicles with a licensed GVW over 5,500 kg must report to a weigh scale when directed by a sign, police officer or authorized person."],"check":[{"q":"What is the maximum legal width of a vehicle and its load without an oversize permit?","choices":["2.3 m","2.6 m","3.1 m","4.4 m"],"answerIndex":1,"explanation":"The maximum legal width is 2.6 m unless the driver has an oversize load permit."},{"q":"Which commercial vehicles must report to a weigh scale when directed?","choices":["Only tractor-trailer combinations","Vehicles with a licensed GVW over 5,500 kg","All vehicles over 4.15 m tall","Only vehicles carrying dangerous goods"],"answerIndex":1,"explanation":"If your licensed GVW is more than 5,500 kg, you must report whenever a sign, police officer or authorized person directs you."}]}],"summary":["Steer opposite first when backing a semi-trailer, load cargo low and centred, and stop to check if a trailer whips or swerves.","Follow the full coupling sequence — inspect, align, connect, check the jaws with a flashlight, and tug test before pulling away.","Secure cargo to withstand 0.8g forward and 0.5g rearward/sideways; tiedown working load limits must total at least 50 per cent of cargo weight.","Know the key limits: 2.6 m width, 4.15 m height, 1 m front and 4 m rear projections, and two tiedowns per first 3.04 m of load.","Carry dangerous goods documents and your training certificate, get permits before moving oversize loads, and report to weigh scales when licensed GVW exceeds 5,500 kg."]},"6":{"chapter":6,"title":"skills for driving buses, taxis, limousines and ride-hailing vehicles","objectives":["Define the various types of Class 2 and Class 4 vehicles and describe their uses","Describe how to safely deal with common driving situations such as leaving the curb and passing parked cars","Identify and describe key regulations that apply to operating buses, taxis, limousines and ride-hailing vehicles","List and describe the requirements for operating a school bus","Describe the special considerations and regulations for driving an emergency vehicle"],"sections":[{"title":"Passenger safety and manoeuvring","points":["Passenger safety is always more important than meeting schedules.","Most bus passenger injuries come from stopping, starting or turning too quickly, or opening/closing doors too fast.","Keep a safe following distance and avoid getting blocked in so you always have an escape route.","Before leaving the curb, check your side mirror and over your shoulder — never rely on mirrors alone.","Watch that the rear of the bus doesn't swing over the sidewalk and hit pedestrians, cyclists, poles or sign posts.","When passing parked cars, watch for vehicles pulling out, doors opening and pedestrians stepping out between cars.","Clues to hazards: front wheels turned out, driver behind the wheel, exhaust, brake or back-up lights, people near the road."],"mustKnow":["A bus seats more than 10 persons including the driver; a taxi or limousine carries not more than 10.","A large capacity limousine carries more than 10 and up to 24 persons, including the driver.","Public transit buses have right-of-way when signalling to leave a bus stop or curb lane where the speed limit is less than 60 km/h and the bus displays a yield sign.","The right-of-way rule doesn't remove responsibility — the bus driver must still ensure it's safe before moving into traffic."],"check":[{"q":"The transit bus right-of-way rule applies in areas where the speed limit is:","choices":["Less than 30 km/h","Less than 50 km/h","Less than 60 km/h","Less than 80 km/h"],"answerIndex":2,"explanation":"The Motor Vehicle Act gives transit buses right-of-way leaving a stop where the speed limit is less than 60 km/h."},{"q":"Before leaving the curb, in addition to your side mirror you should check:","choices":["Over your shoulder","Your fuel gauge","The interior mirror only","Your speedometer"],"answerIndex":0,"explanation":"Don't rely on side mirrors alone — look over your shoulder to confirm traffic is clear before leaving the curb."}]},{"title":"Operating a bus, taxi, limousine or ride-hailing vehicle","points":["You need a passenger transportation licence to be responsible for a vehicle transporting passengers for hire.","When stopping on a highway, signal, be visible from at least 85 metres front and behind, and leave 3 metres for passing traffic.","Never collect fares, make change, or take on or let off passengers while the vehicle is moving.","Passengers may not stand unless the vehicle's passenger transportation licence allows it; the standing capacity must be displayed.","You may refuse a passenger who smokes, uses profane language or acts in a disorderly or offensive manner, or when full.","You can't refuse someone because of a disability, and service animals such as guide dogs must be allowed with their owners.","Some municipalities require taxi and limousine drivers to hold a chauffeur's permit, usually issued by the municipal police."],"mustKnow":["Stop where drivers can see your vehicle from at least 85 metres (285 ft) in front and behind, leaving at least three metres (10 ft) on the left.","Up to two passengers may sit to your right in a sedan-type vehicle, only with designated seating positions and seatbelts.","It's illegal to smoke in any motor vehicle when there are passengers under 16 years old.","If you order a person out, ensure they can disembark safely where they can reasonably find alternate transportation.","Vehicles seating more than 12 occupants including the driver must have aisle lights kept on between sunset and sunrise."],"check":[{"q":"How many passengers may sit to the driver's right in a sedan-type vehicle?","choices":["None","Up to two","Up to three","One only"],"answerIndex":1,"explanation":"Up to two passengers may sit on your right if there is room to operate safely and designated seatbelt-equipped positions."},{"q":"When taking on passengers on a highway, other drivers must be able to see your vehicle from at least:","choices":["60 metres","100 metres","50 metres","85 metres"],"answerIndex":3,"explanation":"Stop where your vehicle is visible from at least 85 metres (285 ft) in front and behind."}]},{"title":"Vehicle condition, equipment and baggage","points":["A B.C.-licensed vehicle with a passenger transportation plate must display a valid inspection decal and carry the certificate.","Your bus or taxi must be clean and sanitary at all times.","End the trip if a problem could endanger passenger safety or comfort; fix it before continuing.","After a crash or breakdown, arrange onward transport for your passengers with as little delay as possible.","When fuelling: engine off, no radio transmitting, no open flame, and keep the nozzle in contact with the filler pipe.","Load baggage so it can't fall on passengers, doesn't block boarding, and never blocks any aisle or exit.","Don't smoke with passengers in your vehicle, moving or not, and never be under the influence of alcohol on duty."],"mustKnow":["Commercial passenger vehicles seating more than 10 occupants including the driver must carry a first-aid kit, a spare tire and at least one fire extinguisher.","The carrier is responsible for ensuring emergency equipment is available and in working order.","Vehicles seating more than 12 including the driver need an emergency exit door or emergency windows.","Vehicles seating more than 10 passengers must carry warning devices such as flags and flares.","Report any defect or deficiency in writing to your carrier when you find it or by the end of that day."],"check":[{"q":"A defect that could make your vehicle unsafe must be reported to the carrier:","choices":["Within one week","At the next scheduled inspection","In writing by the end of that day","Verbally within 48 hours"],"answerIndex":2,"explanation":"Defect reports must be made in writing and given to the carrier when found or by the end of that day."},{"q":"Who is responsible for ensuring the emergency equipment is available and in working order?","choices":["The carrier","The passenger","ICBC","The municipal police"],"answerIndex":0,"explanation":"The carrier is responsible for ensuring the required emergency equipment is available and working."}]},{"title":"Operating a school bus","points":["Test school bus brakes every day and never operate the bus unless the brakes are safe.","Never transport passengers on a defective school bus; an unfit bus can't operate until defects are fixed.","Ensure all passengers are off and the engine is turned off before refuelling.","Passengers may not stand — everyone must be seated before you move the bus.","Before opening doors: full stop, 3 metres of road on the left, visible from 60 metres either direction, right side only.","Use alternating flashing red lights whenever passengers cross the road; all drivers must stop for them.","Turn off flashing lights and draw in the stop sign once passengers are safely aboard or across the road."],"mustKnow":["School buses must display two 'School Bus' signs, front and rear, with black letters at least 20 cm high on a yellow background.","The school bus floor must be washed with a disinfectant solution at least once a week.","Passengers must enter or leave a school bus from the right side only.","Other drivers must be able to see your stopped school bus from at least 60 metres in either direction.","A rental replacement bus must comply with school bus regulations, and you must notify Commercial Vehicle Safety and Enforcement as soon as possible."],"check":[{"q":"How often must you test the brakes on a school bus?","choices":["Every day","Once a week","Every month","Before each semester"],"answerIndex":0,"explanation":"School bus brakes must be tested every day, and the bus must not operate unless the brakes are safe."},{"q":"The letters on a school bus sign must be black on a yellow background and at least:","choices":["10 cm high","15 cm high","25 cm high","20 cm high"],"answerIndex":3,"explanation":"'School Bus' signs at the front and rear must have black letters at least 20 cm high on a yellow background."}]},{"title":"Operating emergency vehicles","points":["Ambulance flashing red lights may be used only when responding to an emergency call or transporting a patient.","You may exceed speed limits and pass red lights or stop signs only if you give other drivers appropriate warning.","Use both flashing red lights and the siren to warn other drivers.","Use caution at all times — other drivers may not see or hear your warning."],"mustKnow":["Before exceeding limits or driving through stop signals, consider: the condition and use of the highway, the amount of traffic, and the seriousness of the emergency."],"check":[{"q":"When may an ambulance driver use flashing red lights?","choices":["Whenever traffic is heavy","Only when responding to an emergency call or transporting a patient","Any time the ambulance is on duty","Only at night"],"answerIndex":1,"explanation":"Flashing red lights are used only when responding to an emergency call or transporting a patient."}]}],"summary":["Passenger safety always comes before schedules — drive smoothly and check passengers are settled before moving.","Know the key distances: visible from 85 m when stopping on a highway (60 m for school buses) and leave 3 m on the left.","Carry the required emergency equipment, report defects in writing by the end of the day, and never continue with an unsafe vehicle.","School buses need daily brake tests, two 20 cm 'School Bus' signs, seated passengers, and right-side boarding only.","Emergency vehicles may exceed limits only with lights and siren, weighing highway conditions, traffic and the seriousness of the emergency."]},"7":{"chapter":7,"title":"hours of service requirements","objectives":["State examples of off-duty and on-duty time","Explain the difference between on-duty driving and on-duty-not-driving time","Explain how long you can drive before you must take a break","List the minimum requirements for filling in a RODS (Record of Duty Status)","Identify the hours of service requirements in other jurisdictions"],"sections":[{"title":"National Safety Code and on/off-duty definitions","points":["The NSC sets minimum safety standards for commercial vehicles, drivers and carriers in Canada.","NSC applies to commercial vehicles over 5,000 kg GVW, Passenger Transportation Act vehicles, and vehicles seating 10-plus passengers plus driver.","Hours of service rules limit driving time because fatigued drivers are more likely to crash.","On-duty time includes driving, inspecting, servicing, loading/unloading, checking loads, and waiting at scales or customs.","Travelling as a passenger to start driving is on duty if the carrier requested it and you lacked eight consecutive hours off beforehand.","Off-duty time is any time you are not on duty, including time in a sleeper berth.","Ferry time is not on-duty time unless you are working, such as a bus driver selling tickets."],"mustKnow":["The NSC program includes commercial vehicles licensed with a GVW more than 5,000 kg.","It also covers vehicles under the Passenger Transportation Act and commercial vehicles seating 10 or more passengers plus the driver.","A sleeper berth does not include the back seat of a bus or a reclining seat."],"check":[{"q":"The National Safety Code program includes commercial vehicles licensed with a GVW of more than what weight?","choices":["3,500 kg","5,000 kg","8,000 kg","11,000 kg"],"answerIndex":1,"explanation":"The NSC includes commercial vehicles licensed with a GVW more than 5,000 kg."},{"q":"Which of the following counts as off-duty time?","choices":["Resting in a sleeper berth","Loading a commercial vehicle","Waiting at a weigh scale for a load check","Inspecting the load"],"answerIndex":0,"explanation":"Off-duty time includes time spent in a sleeper berth; the other activities are on-duty time."}]},{"title":"Daily limits and the three-point check","points":["A day is a 24-hour period beginning at the hour designated by the carrier.","Three-point daily check: at least 10 hours off duty, no more than 13 hours driving, no driving after 14 hours on duty.","Off-duty time beyond the mandatory eight consecutive hours may be split into blocks of 30 minutes or more.","Daily off-duty time must include at least two hours outside the eight-consecutive-hour block.","All drivers must take 24 consecutive hours off duty every 14 days.","You can put in 14 hours of on-duty time without doing any driving at all."],"mustKnow":["Minimum 10 hours of off-duty time must be taken every day.","Maximum 13 hours of driving in a day.","No driving after 14 hours on duty in a day.","Off-duty blocks other than the eight consecutive hours must be 30 minutes or more, including at least two hours outside the eight-hour block.","All drivers must take 24 consecutive hours off duty every 14 days."],"check":[{"q":"What is the maximum number of hours you are allowed to drive in a day?","choices":["11 hours","12 hours","13 hours","14 hours"],"answerIndex":2,"explanation":"You are allowed to drive a maximum of 13 hours in a day."},{"q":"How often must every driver take 24 consecutive hours of off-duty time, regardless of cycle?","choices":["Every 7 days","Every 10 days","Every 30 days","Every 14 days"],"answerIndex":3,"explanation":"All drivers must take 24 consecutive hours off duty every 14 days."}]},{"title":"Work shift, cycles and resets","points":["A work shift is the elapsed time between two off-duty periods of at least eight consecutive hours.","No driving after 16 hours of elapsed time until you take eight consecutive hours off duty.","Every off-duty period of eight consecutive hours or more resets the work shift.","Cycle 1: no driving after 70 on-duty hours in seven days.","Cycle 2: no driving after 120 hours in 14 days, with 24 consecutive hours off before accumulating 70 on-duty hours.","The cycle start time stays the same; you must reset a cycle to change it.","A peace officer can order you (not the vehicle) out of service for exceeding cycle on-duty hours."],"mustKnow":["No driving after 16 hours of elapsed time in a work shift.","Cycle 1: maximum 70 on-duty hours in seven days.","Cycle 2: maximum 120 hours in 14 days, plus at least 24 consecutive hours off duty before accumulating 70 on-duty hours.","Reset Cycle 1 with 36 consecutive hours off duty; reset Cycle 2 with 72 consecutive hours off duty."],"check":[{"q":"How many consecutive hours off duty are required to reset Cycle 1?","choices":["24 hours","36 hours","48 hours","72 hours"],"answerIndex":1,"explanation":"Taking 36 consecutive hours off duty resets Cycle 1; 72 hours resets Cycle 2."},{"q":"Under Cycle 2, you must not drive after completing how many on-duty hours in 14 days?","choices":["70 hours","80 hours","100 hours","120 hours"],"answerIndex":3,"explanation":"Cycle 2 drivers must not drive after completing 120 hours in 14 days."}]},{"title":"Deferral, sleeper berth and personal use","points":["You may defer up to two hours of the daily 10-hour off-duty requirement to the next day.","Deferred hours cannot come from the eight consecutive off-duty hours and must be added to the next day's eight consecutive hours.","Mark deferral as 'Day 1' and 'Day 2' on your RODS.","Single drivers may split off-duty time into two sleeper-berth periods: neither under two hours, totalling at least 10 hours.","Team drivers may split into two periods: neither under four hours, totalling at least eight hours, with total off-duty time at least 10 hours.","Personal use is off duty only if unloaded, no trailer, maximum 75 km a day, odometer recorded, not out of service."],"mustKnow":["Off-duty time may be deferred by up to two hours to the next day, with 'Day 1' and 'Day 2' noted on the RODS.","Single-driver sleeper berth split: two periods, neither less than two hours, total off-duty at least 10 hours.","Team-driver sleeper berth split: two periods, neither less than four hours, totalling at least eight hours, with total off-duty time at least 10 hours.","Personal use maximum is 75 km a day with the vehicle unloaded and not towing a trailer."],"check":[{"q":"What is the maximum distance you may drive a commercial vehicle each day under the personal use exemption?","choices":["50 km","75 km","100 km","160 km"],"answerIndex":1,"explanation":"Personal use is limited to a maximum of 75 km a day with the vehicle unloaded and not towing a trailer."},{"q":"By how many hours may you defer your daily 10-hour off-duty requirement to the next day?","choices":["Up to two hours","Up to four hours","Up to six hours","Deferral is not permitted"],"answerIndex":0,"explanation":"You may reduce the 10-hour off-duty requirement by up to two hours, added to the next day's eight consecutive hours."}]},{"title":"ELDs, RODS, local exemption and other jurisdictions","points":["ELDs are required as of August 1st, 2023; they automatically record driving time, which may not be shortened.","Drivers must verify entries, certify their RODS daily, and use only one ELD at a time.","If an ELD malfunctions, notify the carrier when parked; the carrier has 14 days to repair or replace it.","Keep RODS for the current day plus the previous 14 days (24 for oilwell service hours) and submit to your carrier within 20 days.","Within 160 km of home terminal: exempt from RODS and ELDs if returning daily for 10 consecutive hours off; carrier keeps records.","North of the 60th parallel: maximum 15 hours driving, no driving after 18 hours on duty; Cycle 1 is 80 hours in seven days.","In the U.S.: 11 hours driving after 10 hours off, no driving beyond the 14th hour, 60 hours/7 days or 70 hours/8 days, 34-hour restart."],"mustKnow":["ELDs are required as of August 1st, 2023; a malfunctioning ELD must be repaired or replaced within 14 days.","Keep copies of your RODS for the present day and the previous 14 days (24 days for oilwell service vehicle hours); submit RODS and supporting records to your carrier within 20 days.","160 km exemption: operate within 160 km of the home terminal, return daily for 10 consecutive hours off duty, no deferral; carrier keeps records at least 6 months.","North of 60: maximum 15 hours driving, no driving after 18 hours on duty; Cycle 1 is 80 hours in 7 days, Cycle 2 is 120 hours in 14 days with 24 hours off before 80 on-duty hours.","U.S. rules: 11 hours driving after 10 hours off duty, no driving beyond the 14th hour, 60 hours in 7 days or 70 hours in 8 days, restart after at least 34 consecutive hours off."],"check":[{"q":"Within how many days must you submit your RODS and supporting records to your carrier?","choices":["7 days","14 days","20 days","30 days"],"answerIndex":2,"explanation":"You must submit your RODS and all supporting records to your carrier within 20 days."},{"q":"When driving in the U.S., how many hours may you drive after taking 10 hours of off-duty time?","choices":["10 hours","11 hours","13 hours","15 hours"],"answerIndex":1,"explanation":"U.S. rules allow 11 hours of driving after 10 hours of off-duty time."}]}],"summary":["Daily three-point check: at least 10 hours off duty, maximum 13 hours driving, no driving after 14 hours on duty.","No driving after 16 hours of elapsed work-shift time; eight consecutive hours off resets the shift.","Cycle 1 is 70 hours/7 days (36-hour reset); Cycle 2 is 120 hours/14 days with 24 hours off before 70 hours (72-hour reset).","ELDs are mandatory since August 1st, 2023; keep RODS for 14 days and submit to your carrier within 20 days.","Rules differ north of 60 and in the U.S. — learn each jurisdiction's requirements before you enter."]},"8":{"chapter":8,"title":"air brakes","objectives":["Identify the components of an air brake system","Explain how an s-cam foundation brake works","Describe what happens when one or more air brake system components fail","Explain how trailer brakes are applied","State the key air pressure values for governor operation, low-air warning and spring parking brake automatic application"],"sections":[{"title":"Why air brakes and compressed air basics","points":["Air brakes apply much greater force than hydraulic brakes, needed for the heavy loads of commercial vehicles.","Air systems tolerate small leaks; the compressor generates more compressed air as needed.","In a hydraulic system, a small leak could result in brake failure.","Squeezing air into a smaller space increases resistance, creating pressure that converts into mechanical force to apply brakes.","Pressure is measured in pounds per square inch (p.s.i.) or kilopascals (kPa)."],"mustKnow":[],"check":[{"q":"Why are air brakes used instead of hydraulic brakes on heavy commercial vehicles?","choices":["They apply much greater force and are more tolerant of small leaks","They are cheaper to install and maintain","They are lighter than hydraulic systems","They never need adjustment"],"answerIndex":0,"explanation":"Air brakes use much greater force than hydraulic systems and tolerate small leaks because the compressor replenishes air."}]},{"title":"Brake chambers, force multiplication and s-cam foundation brakes","points":["The brake chamber converts compressed-air force into strong mechanical force through the pushrod and slack adjuster.","The slack adjuster acts as a lever (force multiplication) and adjusts brakes for lining and drum wear.","Chamber sizes range from Type 9 to Type 36; Type 30 is most common on drive and trailer axles.","Long stroke chambers have square-shaped inlet ports and/or a trapezoid-shaped name tag on a clamp bolt.","In s-cam brakes, the pushrod moves the slack adjuster, rotating the s-cam to press linings against the drum.","Brake shoe return springs keep linings away from the drum when chamber air pressure is released."],"mustKnow":["Through force multiplication, 100 p.s.i. (690 kPa) of air pressure produces a pushrod force of 3,000 pounds.","Even though truck air brake system pressures are 100 p.s.i. (690 kPa) and above, much lower air application pressure, usually less than 20 p.s.i. (138 kPa), is used to make normal stops."],"check":[{"q":"A Type 30 brake chamber applied with 100 p.s.i. of air pressure develops what pushrod force?","choices":["1,500 pounds","2,000 pounds","3,000 pounds","5,000 pounds"],"answerIndex":2,"explanation":"A Type 30 chamber applied at 100 p.s.i. (690 kPa) develops a pushrod force of 3,000 pounds."},{"q":"In an s-cam foundation brake, what rotates the s-cam to press the linings against the drum?","choices":["The brake shoe return spring","The slack adjuster, moved by the chamber pushrod","The governor","The relay valve"],"answerIndex":1,"explanation":"Air pressure moves the pushrod forward, causing the slack adjuster to rotate the s-cam and apply the linings."}]},{"title":"Compressor, governor and reservoirs","points":["The engine-driven compressor pumps air to the supply reservoir and runs whenever the engine runs.","The governor unloads the compressor at maximum pressure and restarts it when pressure drops about 20 p.s.i.","A safety (pop-off) valve on the first reservoir prevents over-pressurization if the governor fails to unload the compressor.","The supply reservoir (wet tank) collects water, oil and carbon sludge; most manufacturers recommend draining reservoirs daily.","Stay out of the direct path of compressed air when draining reservoirs."],"mustKnow":["Many current air brake systems operate with a maximum pressure of approximately 125 p.s.i. (862 kPa).","The range between minimum and maximum pressure should be approximately 20 p.s.i. (138 kPa).","The governor must restart the compressor if the air pressure drops below 80 to 85 p.s.i. (552 to 586 kPa).","Safety valves are normally set to vent the excess pressure at approximately 150 p.s.i. (1,034 kPa).","The compressor must be capable of building pressure in the reservoirs from 50 p.s.i. to 90 p.s.i. within three minutes at a fast idle (1,000 – 1,200 r.p.m.)."],"check":[{"q":"The governor must restart the compressor if air pressure drops below what level?","choices":["60 p.s.i.","100 p.s.i.","125 p.s.i.","80 p.s.i. (552 kPa)"],"answerIndex":3,"explanation":"Vehicle safety standards require the governor to resume compressing air if pressure drops below 80 p.s.i. (552 kPa)."},{"q":"Safety valves on the first reservoir are normally set to vent excess pressure at approximately what pressure?","choices":["125 p.s.i.","150 p.s.i. (1,034 kPa)","175 p.s.i.","135 p.s.i."],"answerIndex":1,"explanation":"The safety valve vents excess pressure at approximately 150 p.s.i. (1,034 kPa) if the governor fails to unload the compressor."}]},{"title":"Foot valve and how a basic system applies and releases","points":["The foot valve is a foot-controlled pressure regulator; press it farther, not harder, for more braking force.","Holding the treadle in one position keeps delivered pressure constant, automatically replenishing small downstream leaks.","Applying: reservoir air flows through the foot valve to the brake chambers, forcing linings against the drums.","Releasing: application air exhausts through the foot valve exhaust port; return springs retract pushrods and linings.","A basic system needs a compressor with governor, air lines, reservoir, foot valve and foundation brakes."],"mustKnow":["The maximum brake application will not exceed the pressure in the reservoirs.","If reservoir pressure is 80 p.s.i. (552 kPa), the maximum brake application you could make wouldn't exceed 80 p.s.i."],"check":[{"q":"If reservoir pressure is 80 p.s.i., what is the maximum brake application pressure you could make?","choices":["100 p.s.i.","125 p.s.i.","80 p.s.i.","60 p.s.i."],"answerIndex":2,"explanation":"The maximum brake application will not exceed the pressure in the reservoirs."}]},{"title":"Dual air systems — gauges, low-air warning, quick release and relay valves","points":["The dual foot valve divides braking into independent primary (usually drive axle) and secondary (usually steering axle) sections.","Most dual systems use a supply reservoir plus primary and secondary service reservoirs filled through one-way check valves.","Reservoir pressure gauges (often one gauge with two needles) show primary and secondary pressure; check them frequently.","If one section totally fails, you can still make a controlled stop, though braking power is reduced.","Quick release valves exhaust chamber air near the chambers so brakes release quickly and fully.","Relay valves reduce lag time on application and release, delivering reservoir air matching the foot valve control pressure.","If the low-air warning activates, stop and do not proceed until the cause is found and fixed."],"mustKnow":["The low-air warning device must come on when air pressure drops below 60 p.s.i. (414 kPa).","The air pressure remaining in the system (approximately 60 p.s.i.) will be enough to stop the vehicle if you act promptly."],"check":[{"q":"The low-air warning device must come on when system air pressure drops below what level?","choices":["70 p.s.i.","60 p.s.i. (414 kPa)","50 p.s.i.","40 p.s.i."],"answerIndex":1,"explanation":"All air brake vehicles must have a warning device that activates below 60 p.s.i. (414 kPa)."},{"q":"What is the purpose of a relay valve in an air brake system?","choices":["To protect reservoirs from over-pressurization","To keep the spring parking brakes released","To warn the driver of low air pressure","To reduce lag time when brakes are applied and released"],"answerIndex":3,"explanation":"Relay valves are remote-controlled air valves mounted near the chambers to speed brake application and release."}]},{"title":"Spring parking brakes — apply, release, compounding and caging","points":["Parking force must be maintained by mechanical means and be unaffected by loss of air pressure.","Spring parking brakes are mou
