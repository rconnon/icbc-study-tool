nted on rear axles only; air pressure holds the powerful coil spring compressed (released).","Push the yellow dash button in to release (air flows in); pull it out to apply (air exhausts).","Compounding adds spring force to a heavy service application and can damage slack adjusters, s-cams, shoes and drums.","Caging manually releases spring brakes for towing only; block the wheels first — a caged chamber has no parking force.","In dual systems, a two-way check valve supplies the parking control with blended air from the higher-pressure reservoir.","Safety actuator parking brakes on some buses use a locking mechanism, not spring force, and can't be compounded."],"mustKnow":["If the air pressure in the system falls below approximately 60 p.s.i., the spring brakes may begin to drag, and at 20 to 45 p.s.i. (138 to 310 kPa) may automatically fully apply.","In some of these systems, they may begin to apply at 90 p.s.i. or higher.","The coil spring in most spring parking brake chambers can exert a force of between 1,500 and 2,000 pounds.","This could add a further 3,000 lbs for a total of 5,000 lbs.","Lighter brake applications of less than 30 to 40 p.s.i. (207 to 276 kPa), to prevent a vehicle from rolling while the spring parking brakes are being released or applied, aren't harmful."],"check":[{"q":"At what pressure range may spring parking brakes automatically fully apply?","choices":["20 to 45 p.s.i. (138 to 310 kPa)","60 to 75 p.s.i.","80 to 85 p.s.i.","100 to 125 p.s.i."],"answerIndex":0,"explanation":"Spring brakes may begin to drag below about 60 p.s.i. and may automatically fully apply at 20 to 45 p.s.i."},{"q":"Compounding a heavy service application on top of applied spring brakes can produce a total force of about how much?","choices":["2,000 lbs","3,000 lbs","5,000 lbs","6,000 lbs"],"answerIndex":2,"explanation":"Up to 2,000 lbs of spring force plus 3,000 lbs of air application force totals 5,000 lbs, which can damage brake components."}]},{"title":"Tractor-trailer systems — relay emergency valve, tractor protection, hand valve and breakaway","points":["Trailers have no compressor; the supply (emergency) line fills trailer reservoirs and the control (service) line signals applications.","Glad hands couple the lines: blue indicates the control line, red indicates the supply line.","Trailers without spring brakes use a relay emergency valve that dynamites the brakes with full reservoir pressure on breakaway.","Trailers with spring parking brakes use spring force to dynamite the brakes if the supply line loses pressure.","The tractor protection system (dash trailer air supply valve plus tractor protection valve) preserves tractor air after breakaway.","The hand valve applies only the trailer brakes; never use it for parking or normal service braking.","Bobtail proportioning reduces drive-axle braking pressure to prevent rear-wheel lockup when driving without a trailer."],"mustKnow":["Motor vehicle safety standards require these systems to remain applied for a minimum of 15 minutes.","Some tractor protection systems will shut off immediately in a breakaway, but some will allow tractor pressure to drop to as low as 20 p.s.i (138 kPa) before shutting off.","Automatic shutoff of the air supply to the trailer — in the event that the pressure in the tractor air system is lowered to between 20 and 45 p.s.i. (138 and 310 kPa).","A peace officer may place your vehicle out of service if the tractor protection system allows the tractor pressure to drop below 20 p.s.i. (138 kPa) without the trailer air supply valve automatically closing.","When bobtailing, the braking pressure to the drive axle brakes is reduced by as much as 75 per cent."],"check":[{"q":"A relay emergency valve applies full trailer reservoir pressure to the trailer brakes when it senses what?","choices":["Loss of pressure in the supply line","A heavy foot valve application","Low pressure in the tractor primary reservoir","The hand valve being applied"],"answerIndex":0,"explanation":"When the supply line loses pressure (breakaway or disconnection), the relay emergency valve dynamites the trailer brakes."},{"q":"The hand valve applies which brakes?","choices":["Tractor brakes only","Both tractor and trailer brakes","Steering axle brakes only","Trailer brakes only"],"answerIndex":3,"explanation":"The hand valve allows independent application of the trailer brakes, such as when coupling; never use it for parking."}]},{"title":"Other components and ABS — dryers, drain valves, limiting systems and other foundation brakes","points":["Air dryers, installed between the compressor and first reservoir, remove water vapour, oil mist and carbon particles.","Alcohol evaporators and injectors add methyl hydrate vapour as anti-freeze; reservoirs must still be drained regularly.","Automatic drain (spitter) valves expel contaminants; open manual drains periodically to check for water.","Front wheel limiting systems reduce steering-axle brake pressure to help prevent lockup on slippery surfaces.","Wedge, air disc and air-over-hydraulic brakes must be adjusted and repaired only by a qualified mechanic.","ABS senses wheel lockup and releases and re-applies the brakes; apply firm continuous pedal pressure and keep steering.","If the ABS lamp stays on, normal braking still operates — only the anti-lock feature is disabled."],"mustKnow":["Shutoff pressures vary between 60 and 90 p.s.i. (414 and 620 kPa), depending on the manufacturer's specifications.","At brake application pressures below 40 p.s.i. (276 kPa), the steering axle brake pressure is approximately 50 per cent of drive axle pressure.","It reaches an application pressure that may be used during an emergency stop (60 to 70 p.s.i. — 414 to 483 kPa) and steering axle and drive axle brakes receive equal pressure.","Most systems are capable of cycling the brakes up to five times per second.","The dash lamp may light, flash briefly, then stay lit until vehicle speed reaches 7–11 km/h, or light briefly then turn off."],"check":[{"q":"Where is an air dryer installed in an air brake system?","choices":["Between the foot valve and the brake chambers","In the compressor discharge line between the compressor and the first reservoir","Between the primary and secondary reservoirs","At the trailer glad hand connections"],"answerIndex":1,"explanation":"Air dryers are installed in the compressor discharge line so contaminants are removed before air reaches the first reservoir."},{"q":"If the ABS warning lamp comes on while driving, what happens to the brakes?","choices":["Normal braking still works; only the anti-lock feature is disabled","All braking is lost immediately","The spring parking brakes automatically apply","Only the trailer brakes will work"],"answerIndex":0,"explanation":"An ABS failure disables only the anti-lock feature; normal braking remains operational and the vehicle may be driven for repairs."}]}],"summary":["Compressed air converts a light pedal effort into powerful mechanical braking force through chambers, slack adjusters and s-cams.","The governor keeps system pressure near 125 p.s.i. maximum; the low-air warning below 60 p.s.i. means stop immediately.","Dual air systems let you make a controlled stop even if one complete circuit fails.","Spring parking brakes apply mechanically when air is lost; release them before heavy service applications to avoid compounding.","Tractor protection and trailer dynamiting systems preserve tractor air and automatically stop a broken-away trailer."]},"9":{"chapter":9,"title":"air brake adjustment","objectives":["Explain why air brake adjustment must be checked regularly and who is responsible for it","State the maximum pushrod travel limits for the applied stroke and pry (free stroke) methods","Explain how to measure air brake chamber pushrod travel and adjust a manual slack adjuster","Identify common misconceptions about air brake adjustment and the facts that correct them"],"sections":[{"title":"Why adjustment is critical — and the law","points":["Foundation brakes are the most important part of any braking system; poor adjustment defeats even the best air system.","Brake failures and runaways are almost never caused by air system failure — poor maintenance and missed daily checks are.","Daily pre- and post-trip inspections, including checking and adjusting brakes, are mandatory.","Federal and provincial laws require daily checks of manual and automatic slack adjusters during the pre-trip inspection.","You must also check brakes before driving down steep grades posted with regulatory signs.","The driver is ultimately responsible for brake condition, even if the company has a maintenance crew."],"mustKnow":["You may be fined as much as $2,000 if you're operating a vehicle with brakes that are defective, including excessive brake chamber pushrod stroke.","Check air brake chamber pushrod travel at least daily.","The driver may be held responsible if the brakes are incorrectly adjusted or not working properly."],"check":[{"q":"Who is ultimately responsible for ensuring the brakes are operating properly before a vehicle is moved?","choices":["The maintenance crew","The driver","The fleet supervisor","The roadside inspector"],"answerIndex":1,"explanation":"One person is ultimately responsible for the brakes before the vehicle is moved — the driver."},{"q":"What is the maximum fine for operating a vehicle with defective brakes, including excessive pushrod stroke?","choices":["$500","$1,000","$2,000","$5,000"],"answerIndex":2,"explanation":"The manual states you may be fined as much as $2,000 for operating with defective brakes."}]},{"title":"How s-cam adjustment works — released, applied, hot and cold drums","points":["Pushrod travel is the distance the pushrod extends from the air brake chamber when brakes are applied.","The common Type 30 chamber has a maximum available stroke of 2½ inches (65 mm); the Type 30LS has three inches.","A correctly adjusted brake strokes less than half its maximum when applied.","When correctly adjusted, running clearance between lining and drum is only a few thousandths of an inch.","An out-of-adjustment brake may still seem effective while the drum is cool — a false sense of security.","Hot cast iron drums expand, making the chamber stroke further; a sudden stop could bottom out the chamber.","On long downgrades, hot drum expansion can cause total loss of braking and a runaway."],"mustKnow":["Type 30 chambers have a maximum available stroke of 2½ inches (65 mm); a Type 30LS has a maximum available stroke of three inches.","Each brake on an axle should be adjusted to have a similar amount of pushrod travel to the brake on the other side.","Cast iron brake drums expand when heated, causing the air chamber to stroke further as the temperature rises."],"check":[{"q":"What is the maximum available stroke of a standard Type 30 air brake chamber?","choices":["1¾ inches (45 mm)","2 inches (50 mm)","3 inches (75 mm)","2½ inches (65 mm)"],"answerIndex":3,"explanation":"The Type 30, the most common chamber on trucks and trailers, has a maximum available stroke of 2½ inches (65 mm)."},{"q":"Why can an incorrectly adjusted brake fail on a long downgrade even though it worked when cold?","choices":["Hot drums expand and the chamber can bottom out","Air pressure rises with heat","Brake linings shrink when heated","The slack adjuster locks up"],"answerIndex":0,"explanation":"Heated cast iron drums expand, increasing stroke until the chamber bottoms out and braking power is lost."}]},{"title":"Checking adjustment — applied stroke, pry method, indicators and limits","points":["Before checking, park safely, block the wheels, build full air pressure, release spring parking brakes, and shut the engine off.","Applied stroke method: mark the pushrod at rest, then hold a full 90 to 100 p.s.i. application and measure the difference.","The applied stroke method is used by roadside inspectors and usually needs two people.","Pry method: push the pushrod fully in, mark it, pry it out with a bar, and measure free stroke.","New pushrods have a marking (usually red) that shows when adjustment is needed immediately — don't wait for it to appear.","Adjust before your measurements approach the maximum limits — they are maximums, not targets."],"mustKnow":["Applied stroke: 1 inch to 1½ inches (25 to 38 mm) is a good range; more than 1¾ of an inch (45 mm) means the brakes need adjustment.","Free stroke (pry method): ½ to ¾ of an inch (12 to 20 mm) is a good range; more than ¾ of an inch (20 mm) means the brakes need adjustment.","Apply and hold a full brake application of 90 to 100 p.s.i. (620 – 690 kPa) for the applied stroke method.","Reservoir pressure must be at least 100 p.s.i. (690 kPa) before checking, with parking brakes released.","If the red marking on the pushrod is visible at the chamber face, the brake is dangerously out of adjustment and needs immediate attention."],"check":[{"q":"Using the applied stroke method on a Type 30 chamber with a manual slack adjuster, brakes need adjustment when travel exceeds:","choices":["¾ of an inch (20 mm)","1 inch (25 mm)","1¾ of an inch (45 mm)","2½ inches (65 mm)"],"answerIndex":2,"explanation":"More than 1¾ of an inch (45 mm) of applied stroke means the brakes need adjustment."},{"q":"Using the pry method, brakes need adjustment when free stroke is more than:","choices":["½ of an inch (12 mm)","¾ of an inch (20 mm)","1 inch (25 mm)","1½ inches (38 mm)"],"answerIndex":1,"explanation":"Free stroke of more than ¾ of an inch (20 mm) means the brakes need adjustment."}]},{"title":"Manual vs automatic slack adjusters — and misconceptions","points":["To adjust a manual slack adjuster, depress the locking sleeve and turn the adjusting bolt with a 9/16 inch wrench.","Correct direction: the cam rotates as if the brakes were applying; the pushrod must never move in or out.","Turn until solid resistance (lining contacts drum), then back off about 1/3 of a turn for running clearance.","All commercial trucks and trailers with air brakes have been built with automatic slack adjusters since 1996.","Automatic slack adjusters self-adjust in normal driving but must still be checked daily on the pre-trip inspection.","Manually adjusting automatic slack adjusters is dangerous — it gives a false sense of security and is emergency-only.","You cannot reliably check adjustment from the cab, by pressure drop, or by the 90-degree slack adjuster angle."],"mustKnow":["With an automatic slack adjuster on a Type 30 chamber, brakes need repair if applied stroke is more than two inches (50 mm) or free stroke is more than ¾ of an inch (20 mm).","Manufacturers recommend automatic slack adjusters be checked by a mechanic at every chassis lubrication interval, every 40,000 km, or every three months, whichever comes first.","A Transport Canada study showed vehicles with manual slack adjusters were put out-of-service at a rate 150 per cent higher than those with automatic slack adjusters.","Under B.C. Commercial Vehicle Safety and Enforcement rules, it's illegal to retrofit manual slack adjusters on a vehicle manufactured with automatic slack adjusters.","Some parking brake control valves stay open with as little as 20 p.s.i. (138 kPa), so ensure 90 to 100 p.s.i. before checking adjustment."],"check":[{"q":"Since what year have all commercial trucks and trailers with air brakes been manufactured with automatic slack adjusters?","choices":["1996","1986","2000","1990"],"answerIndex":0,"explanation":"All air-braked commercial trucks and trailers have been built with automatic slack adjusters since 1996."},{"q":"What does it usually mean if an automatic slack adjuster strokes beyond the maximum allowed?","choices":["It just needs a quick manual adjustment","The air compressor is failing","The brake drums are too cold","There are other brake problems needing a qualified mechanic"],"answerIndex":3,"explanation":"Excessive stroke usually means the adjuster failed, was installed incorrectly, or the foundation brake has a problem needing repair."}]}],"summary":["The driver is legally responsible for checking brake adjustment daily — fines can reach $2,000 for defective brakes.","Manual slack adjuster limits on a Type 30: adjust if applied stroke exceeds 1¾ inch (45 mm) or free stroke exceeds ¾ inch (20 mm).","Hot brake drums expand and increase stroke — a brake that works cold can bottom out and cause a runaway.","Always block wheels, build at least 100 p.s.i., release parking brakes, and shut off the engine before checking.","Never routinely hand-adjust automatic slack adjusters — excessive stroke (over two inches applied) means repair by a qualified mechanic."]},"10":{"chapter":10,"title":"vehicle and air brake pre-trip inspections","objectives":["Explain the importance of conducting a pre-trip inspection and who is responsible for it","State which vehicles require daily written inspection reports and what every report must include","Explain how to perform an air brake system inspection, including all key pressure values","List the steps of a pre-trip inspection: under hood, in cab, circle checks and brake tests","Identify the time limits for completing the pre-trip inspection for each licence class","State when pre-hill, en route and post-trip inspections are required and what to check"],"sections":[{"title":"Driver responsibility and NSC trip-inspection rules","points":["You must determine your vehicle is in safe operating condition before you drive it — every time.","NSC vehicles must be inspected before use each day (pre-trip) and after the final trip (post-trip).","The driver or another person specified by the carrier inspects; driver and carrier share responsibility.","Written daily reports: buses seating more than 10 including driver, heavy two-axle trucks, trucks towing heavy trailers.","Every report lists plate/unit numbers, all defects (or states none found), date and inspector's signature.","If you couple to another trailer, obtain and carry that trailer's trip inspection report for the day.","With co-drivers, one signature is enough if all agree; if they disagree, all must sign and note it."],"mustKnow":["Written reports required for a bus, school bus, special activity bus, special vehicle or limousine with a seating capacity of more than 10 including the driver","Written reports required for a two-axle truck or truck-tractor with a licensed GVW greater than 14,600 kg","Written reports required for a truck or truck-tractor towing a trailer that has a licensed GVW greater than 8,200 kg","All trip inspection reports must be given to the carrier within 20 days"],"check":[{"q":"Within how many days must trip inspection reports be given to the carrier?","choices":["7 days","14 days","20 days","30 days"],"answerIndex":2,"explanation":"The manual states all trip inspection reports must be given to the carrier within 20 days."},{"q":"A two-axle truck needs a daily written inspection report when its licensed GVW is greater than:","choices":["8,200 kg","10,000 kg","14,600 kg","4,600 kg"],"answerIndex":2,"explanation":"Two-axle trucks or truck-tractors with a licensed GVW greater than 14,600 kg require daily written reports."}]},{"title":"Cargo securement and re-inspection intervals","points":["Under the NSC, every vehicle transporting cargo on a highway must be inspected for cargo securement, regardless of weight.","Before driving, confirm operating equipment (tailgate, doors, tarpaulins, spare tire) is secured.","Ensure cargo doesn't interfere with safe operation of the vehicle or with exiting it.","Re-inspect the cargo securement system within 80 km of the loading point.","Then re-inspect at the earliest of: a change in duty status, three hours, or 240 km of driving.","Record cargo securement inspections on your daily logs.","No inspection needed if cargo is sealed and you're ordered not to inspect it, or it's inaccessible."],"mustKnow":["Re-inspect the cargo securement system within 80 km from the point where the cargo was loaded","Re-inspect at the earliest of: a change in duty status of the driver, three hours of driving, or 240 km of driving since the last inspection"],"check":[{"q":"After loading, you must re-inspect the cargo securement system within:","choices":["80 km","160 km","240 km","40 km"],"answerIndex":0,"explanation":"The first cargo re-check must happen within 80 km from the point where the cargo was loaded."},{"q":"During the trip, cargo must be re-inspected at the earliest of a duty status change, three hours of driving, or:","choices":["100 km of driving","150 km of driving","200 km of driving","240 km of driving"],"answerIndex":3,"explanation":"The interval is the earliest of a duty status change, three hours, or 240 km since the last inspection."}]},{"title":"Road-test inspection report and time limits","points":["On your road test, the examiner gives you a blank trip inspection report to complete and return.","Part of your grade is based on how completely and accurately you fill out the report.","Corrected defects must be noted with a signature certifying the correction; minor defects noted as not needing immediate repair.","Time limits: Class 1 under 45 minutes; Class 3 under 30 minutes; Class 2 under 30 minutes.","Class 4 unrestricted (bus) under 20 minutes; Class 4 restricted under 15 minutes.","With manual slack adjusters you must adjust a brake; with automatic ones, explain how manual adjustment is done.","During the test, point to or touch items you inspect and tell the examiner what you're looking for."],"mustKnow":["Class 1 pre-trip inspection: complete in less than 45 minutes","Class 3 pre-trip inspection: complete in less than 30 minutes","Class 2 pre-trip inspection: less than 30 minutes; Class 4 (unrestricted) less than 20 minutes","Class 4 (restricted) pre-trip inspection: complete in less than 15 minutes"],"check":[{"q":"How long do you have to complete a Class 1 tractor-trailer pre-trip inspection on your road test?","choices":["Less than 30 minutes","Less than 45 minutes","Less than 60 minutes","Less than 20 minutes"],"answerIndex":1,"explanation":"The Class 1 pre-trip inspection should be completed in less than 45 minutes."},{"q":"If your test vehicle has automatic slack adjusters, you will be asked to:","choices":["Skip the brake adjustment portion","Replace a slack adjuster","Adjust the automatic slack adjusters by hand","Explain how to adjust manual slack adjuster brakes"],"answerIndex":3,"explanation":"With automatic slack adjusters, you must explain how to adjust manual slack adjuster brakes for proper pushrod travel."}]},{"title":"Inspection structure: under hood, in cab, circle checks and brake tests","points":["Before starting: park on level ground away from traffic, set parking brakes, shut off the engine, block the wheels.","Under hood: check fluids, belts, hoses, compressor, steering components, suspension and frame; drain the supply reservoir.","In cab: check tires/wheels/mud flaps, foundation brakes, gauges, wipers, heater, horns, emergency equipment, seatbelts, mirrors, documents.","Walk the circle check counter-clockwise so you're facing oncoming traffic.","Circle check for lights: turn signals, low and high beams, tail, licence plate, clearance and brake lights.","Finish with tug tests against the parking brakes, then move ahead slowly checking brake response and steering wheel slack.","Follow the same order every time so you don't miss items."],"mustKnow":["A peace officer may place your vehicle out of service if drum brake linings are less than 1/4 inch (6.4 mm) thick or air disc brake pads are less than 1/8 inch (3.2 mm) thick"],"check":[{"q":"In which direction should you walk during the circle check?","choices":["Clockwise, starting at the rear","Counter-clockwise, so you face oncoming traffic","Either direction, alternating each day","Clockwise, so traffic approaches from behind"],"answerIndex":1,"explanation":"Walk counter-clockwise so you're facing oncoming traffic during the circle check."},{"q":"A vehicle may be placed out of service if drum brake linings are thinner than:","choices":["1/8 inch (3.2 mm)","1/2 inch (12.7 mm)","1/4 inch (6.4 mm)","3/8 inch (9.5 mm)"],"answerIndex":2,"explanation":"Drum linings under 1/4 inch (6.4 mm), or disc pads under 1/8 inch (3.2 mm), can put a vehicle out of service."}]},{"title":"Air brake system test and its numbers","points":["Check the compressor stops pumping (cuts out) between 105 and 135 p.s.i.","Pump down to about 80 per cent of maximum; the governor must cut the compressor in before pressure falls below 80 p.s.i.","Pump down farther: low-air warning devices must activate at or above 60 p.s.i.","Class 1: trailer air supply valve must close between 20 and 45 p.s.i.; check trailer brakes applied.","Class 1: disconnect glad hands and confirm no air escapes; also check them during a foot brake application.","Pressure must rebuild from 50 to 90 p.s.i. within three minutes at fast idle.","Full brake application held one minute: air loss max 4 p.s.i./min (Class 1), 6 with two trailers, 3 for a single-unit truck."],"mustKnow":["Compressor stops pumping between 105 and 135 p.s.i. (724 and 931 kPa)","The governor must cause the compressor to cut in before pressure falls below 80 p.s.i. (552 kPa)","Low-air warning device(s) activate at or above 60 p.s.i. (414 kPa)","Trailer air supply valve closes when the highest reservoir pressure gauge reads between 20 to 45 p.s.i. (138 to 310 kPa)","Air pressure builds from 50 to 90 p.s.i. (345 to 620 kPa) within three minutes at a fast idle (1,000 to 1,200 r.p.m.); full application (90 to 100 p.s.i.) held one minute — air loss not more than 4 p.s.i. (27.6 kPa) per minute, 6 p.s.i. (41.4 kPa) with two trailers, three p.s.i. (20.7 kPa) for a single-unit truck"],"check":[{"q":"The low-air warning device must activate at or above:","choices":["45 p.s.i.","60 p.s.i.","80 p.s.i.","100 p.s.i."],"answerIndex":1,"explanation":"Low-air warning devices must activate at or above 60 p.s.i. (414 kPa)."},{"q":"During the buildup test, air pressure must rise from 50 to 90 p.s.i. within:","choices":["One minute","Two minutes","Three minutes","Five minutes"],"answerIndex":2,"explanation":"Pressure must build from 50 to 90 p.s.i. within three minutes at a fast idle of 1,000 to 1,200 r.p.m."}]},{"title":"Class differences and ongoing inspections","points":["Class 1 adds trailer items: fifth wheel flush to apron, jaws locked on kingpin, landing gear raised, glad hands, trailer tug test and hand-valve check.","Class 3 single-unit: pump below 50 p.s.i., rebuild pressure, release spring parking brakes if they applied.","Class 2/4 bus adds passenger compartment checks: seats, doors, step lights, emergency windows and exits with alarm.","Class 4 restricted adds trunk, spare tire, jack, brake fluid and propane tank checks; no air brake test.","Pre-hill: stop in the pullout, check reservoir pressure, air leaks, glad hands, drum/hub heat and pushrod travel — even with automatic slack adjusters.","En route: walk around counter-clockwise checking tires, wheels, brakes, hubs, coupling, cargo and suspension.","Post-trip: inspect at the end of the final trip and complete a trip inspection report noting any defects."],"mustKnow":["Commercial trailers with an overall width of 2.05 m or more are required to have reflective markings to the rear and sides","You may be fined for failing to stop to conduct a brake pre-hill inspection"],"check":[{"q":"At a pre-hill brake check, must you check pushrod travel if your vehicle has automatic slack adjusters?","choices":["Yes, you must check pushrod travel even with automatic slack adjusters","Only if the low-air warning came on","No, automatic adjusters make it unnecessary","Only on vehicles towing two trailers"],"answerIndex":0,"explanation":"The manual states you must check pushrod travel even if equipped with automatic slack adjusters."},{"q":"Commercial trailers must have reflective markings to the rear and sides when their overall width is:","choices":["2.05 m or more","2.6 m or more","1.85 m or more","2.3 m or more"],"answerIndex":0,"explanation":"Trailers with an overall width of 2.05 m or more require reflective markings to the rear and sides."}]}],"summary":["You are responsible for confirming your vehicle is safe before every drive; NSC vehicles need daily pre-trip and post-trip inspections.","Written reports must list defects or state none, be signed and dated, and reach the carrier within 20 days.","Know the air numbers: cut-out 105-135 p.s.i., cut-in before 80, warning at 60, trailer valve closes 20-45, buildup 50-90 in three minutes.","Air-loss limits with full application held one minute: 4 p.s.i./min Class 1, 6 with two trailers, 3 for a single-unit truck.","Keep inspecting after departure: cargo within 80 km then every duty change/3 hours/240 km, pre-hill brake checks, en route walkarounds and a post-trip report."]},"11":{"chapter":11,"title":"signs, signals and road markings","objectives":["Identify signs by their shape, colour and message, including regulatory, school, playground and crosswalk signs","Explain the rules set by lane use, turn control, parking and reserved lane signs","Identify warning, object marker, construction and information signs and the hazards they describe","State the meaning of railway signs, lane control signals and each traffic light indication","Explain the meaning of yellow lines, white lines and reserved lane road markings"],"sections":[{"title":"Regulatory, school, playground and crosswalk signs","points":["Signs can be read three ways: by shape, colour, and the message printed on them.","Regulatory signs state driving laws — disregarding them is an offence under the B.C. Motor Vehicle Act.","A red octagon means stop completely and continue only when safe; a red-and-white triangle means yield the right-of-way.","A posted speed limit is the maximum legal speed when the road is bare and dry and visibility is good.","School zone signs are fluorescent yellow-green; reduce speed when children are present.","Slow traffic delaying five vehicles must use pullouts where regulatory pullout signs are posted.","At school and pedestrian crosswalks, yield to people crossing and follow any crossing guard's directions."],"mustKnow":["A school zone speed tab with only a speed limit is in effect from 8 a.m. to 5 p.m. on school days.","Playground zone — 30 km/h limit is in effect every day from dawn to dusk.","School zone signs are fluorescent yellow-green.","It is an offence under the B.C. Motor Vehicle Act to disregard regulatory signs."],"check":[{"q":"A school zone sign has a tab underneath showing only a speed limit. When is that limit in effect?","choices":["From 8 a.m. to 5 p.m. on school days","Every day from dawn to dusk","24 hours a day, year-round","Only when a crossing guard is present"],"answerIndex":0,"explanation":"A tab showing only the speed limit applies from 8 a.m. to 5 p.m. on school days."},{"q":"When is the 30 km/h playground zone speed limit in effect?","choices":["School days only","Weekends only","Every day from dawn to dusk","Only when children are visible"],"answerIndex":2,"explanation":"The playground zone 30 km/h limit is in effect every day from dawn to dusk."}]},{"title":"Lane use, turn control, parking and reserved lane signs","points":["Lane use signs are mounted above or beside the lane before the intersection and show whether to turn or go straight.","In a designated lane you must follow the arrows, and you may not move into or out of it within an intersection.","Turn control signs are mounted directly above the intersection; you must follow the direction of the arrow.","Parking signs say where and when you may park; illegal parking can bring fines, towing, or both.","Some parking spots are reserved for vehicles displaying the disabled parking sign and carrying a person with disabilities.","Reserved lane signs are placed over or beside lanes reserved for buses or high occupancy vehicles (HOVs).","A white diamond painted on the road surface marks reserved lanes."],"mustKnow":["You may not move into or out of a designated lane while you are in an intersection.","A white diamond painted on the road surface marks reserved lanes.","HOV signs may show how many people must be in the vehicle to use the lane."],"check":[{"q":"Where are turn control signs mounted?","choices":["On the curb at the corner","Several blocks before the turn","Directly above the intersection","On the far side of the crosswalk"],"answerIndex":2,"explanation":"Turn control signs are mounted directly above the intersection and you must follow the arrow."},{"q":"What symbol painted on the road surface marks a reserved lane?","choices":["A white arrow","A yellow circle","An orange square","A white diamond"],"answerIndex":3,"explanation":"Reserved lanes for buses and HOVs are marked with a white diamond painted on the road surface."}]},{"title":"Warning, object marker, construction and information signs","points":["Most warning signs are yellow and diamond-shaped, warning of possible hazards ahead such as curves, merges or steep hills.","Examples: winding road, hidden side road, road narrows, two-way traffic, slippery road, and stop sign ahead.","A school crosswalk ahead warning sign is fluorescent yellow-green.","Object markers are mounted directly on obstructions and tell you to keep right or left.","Construction signs warn of work zones: obey traffic-control persons, posted speeds, stay back from equipment, pass only when safe.","A recommended exit speed sign means drive slower in poor conditions.","Information and destination signs give destinations, route numbers and facilities; distances are in kilometres."],"mustKnow":["Most warning signs are yellow and diamond-shaped.","Object markers are mounted on obstructions.","Destination sign distances are in kilometres."],"check":[{"q":"What shape and colour are most warning signs?","choices":["Red octagons","Yellow diamonds","Orange rectangles","Green squares"],"answerIndex":1,"explanation":"Most warning signs are yellow and diamond-shaped and warn of possible hazards ahead."},{"q":"Where are object markers mounted?","choices":["On obstructions","Above intersections","On exit ramps only","At railway crossings"],"answerIndex":0,"explanation":"Object markers are mounted on obstructions and direct you to keep right or left."}]},{"title":"Railway signs, lane control signals and traffic lights","points":["Railway crossings are marked with signs or pavement markings and may have mechanical or electrical warning devices.","You must always yield to trains; at a gated crossing, stay stopped until the gate is fully raised.","Lane control signals over a lane: a green arrow means drive in this lane; a red signal means do not.","If lane control signals over all lanes flash yellow, slow down and proceed with caution.","Steady red: stop; after a full stop you may turn right, or left onto a one-way street, unless a sign forbids it.","Flashing green is a pedestrian-controlled light; flashing red means stop, then continue only when safe.","A flashing green arrow with a steady red light allows a left turn while through traffic must stop.","A steady white rectangular transit priority signal means only buses may go."],"mustKnow":["You must always yield to trains.","Steady yellow — slow down and stop before the intersection unless you can't safely stop in time.","Flashing green — pedestrian-controlled light — go only if the intersection is clear.","Transit priority signal — steady white rectangular light — only buses may go on this signal."],"check":[{"q":"You approach an intersection showing a flashing green arrow with a steady red light. What may you do?","choices":["Nothing — wait for green","Go straight through only","Turn right only","Turn left; through traffic must stop"],"answerIndex":3,"explanation":"A flashing green arrow with a steady red light allows a left turn while through traffic stops for the red."},{"q":"What does a flashing green traffic light mean?","choices":["An advance turn signal is coming","It is a pedestrian-controlled light — go only if the intersection is clear","Speed up before the light changes","Buses only may proceed"],"answerIndex":1,"explanation":"A flashing green light is pedestrian-controlled; go only if the intersection is clear."}]},{"title":"Road markings — yellow lines, white lines and reserved lanes","points":["Yellow lines divide traffic moving in opposite directions; white lines separate traffic moving in the same direction.","Broken yellow line: passing allowed when safe; single yellow line: passing allowed with extra caution.","Broken plus solid yellow: pass only when safe and the broken line is on your side; double solid: no passing.","A double broken yellow line marks a reversible lane — lane control signals show whether you may use it.","A two-way left-turn lane is shared by drivers travelling in opposite directions for left turns.","Solid white line: do not change lanes; broken white line: lane changing allowed when safe.","Bicycle lanes are marked with a bicycle outline; keep right of painted islands and never drive on or over them.","It is illegal to drive over freshly painted, wet pavement markings."],"mustKnow":["Yellow lines divide traffic moving in opposite directions.","White lines are used to separate lanes of traffic moving in the same direction.","Double solid line — no passing allowed.","HOV lanes are marked with thick solid or broken lines and white diamond symbols."],"check":[{"q":"What do yellow lines on the road indicate?","choices":["Lanes of traffic moving in the same direction","The edge of the right shoulder","Traffic moving in opposite directions on either side","A crosswalk ahead"],"answerIndex":2,"explanation":"Yellow lines divide traffic moving in opposite directions — traffic comes toward you across a yellow line."},{"q":"You are driving beside a broken yellow line with a solid yellow line beyond it. When may you pass?","choices":["Only when safe and the broken line is on your side","Never — passing is prohibited","Any time traffic is light","Only at intersections"],"answerIndex":0,"explanation":"With a broken and solid line, you may pass only when it is safe and the broken line is on your side."}]}],"summary":["Read signs by shape, colour and message: red octagon stops you, red-and-white triangle yields, yellow diamond warns.","School zone tab limits run 8 a.m. to 5 p.m. on school days; playground 30 km/h runs every day, dawn to dusk.","Follow lane use and turn control arrows, and never change into or out of a designated lane inside an intersection.","Always yield to trains, and know every traffic light meaning, including flashing green (pedestrian-controlled) and white transit signals.","Yellow lines separate opposing traffic and white lines separate same-direction traffic; pass only where markings allow."]},"dg":{"chapter":"dg","title":"transporting dangerous goods","objectives":["List the nine classes of dangerous goods","Explain the requirements for placards, shipping documents and route signs","State the driver's responsibilities for training, certification and incident reporting"],"sections":[{"title":"what counts as dangerous goods: classes, placards and documents","points":["Dangerous goods present a serious potential hazard to handlers, the public and the environment.","There are nine classes, from Class 1 explosives through Class 9 miscellaneous products, substances or organisms.","Placards appear on the sides and both ends of transport trucks; a mixed-load placard exists for combined shipments.","Shipping documents must be complete, correct, readily available in the cab and accompany the shipment.","Some road signs designate routes where dangerous goods vehicles may travel; others prohibit them."],"mustKnow":["The nine classes: explosives, gases, flammable liquids, flammable solids, oxidizing substances and organic peroxides, poisonous and infectious substances, radioactive materials, corrosive substances, and miscellaneous products or substances.","Shipping documents must be complete, correct and readily available in the cab."],"check":[{"q":"How many classes of dangerous goods are there?","choices":["Six","Nine","Eleven","Four"],"answerIndex":1,"explanation":"There are nine classes of dangerous goods, from explosives to miscellaneous products or substances."},{"q":"Where must shipping documents be kept when transporting dangerous goods?","choices":["Filed at the carrier's head office","Attached to the outside of the trailer","Readily available in the cab","Mailed ahead to the destination"],"answerIndex":2,"explanation":"Shipping documents must be complete, correct and readily available in the cab, accompanying the shipment."}]},{"title":"driver responsibilities: training, certification and reporting","points":["Anyone working with dangerous goods has significant legal responsibilities and must be properly trained and appropriately certified.","Your current employer must certify that you've had appropriate dangerous goods training.","Always carry your training certificate with you when transporting dangerous goods.","Report immediately any incident — spills, leaks, fires, explosions or damaged containers — to the nearest police or the Provincial Emergency Program.","Rapid action after an incident may help prevent it from becoming serious."],"mustKnow":["Report dangerous goods incidents in B.C. immediately by calling local police or the Provincial Emergency Program at 1-800-663-3456.","Your current employer must certify your training, and you must carry your training certificate when transporting dangerous goods."],"check":[{"q":"Who must certify that you've had appropriate dangerous goods training?","choices":["Your current employer","ICBC","The local police","The shipper of the goods"],"answerIndex":0,"explanation":"Your current employer must certify your training, and you must carry the certificate while transporting dangerous goods."},{"q":"What should you do if your dangerous goods cargo leaks or spills?","choices":["Finish the trip, then file a report","Wait 24 hours to see if it worsens","Notify only your dispatcher","Report immediately to the nearest police or the Provincial Emergency Program"],"answerIndex":3,"explanation":"Report any incident immediately to the nearest police agency or the Provincial Emergency Program at 1-800-663-3456."}]}],"summary":["There are nine classes of dangerous goods, shown on placards on the sides and both ends of transport trucks.","Shipping documents must be complete, correct and readily available in the cab with the shipment.","You must be trained, certified by your current employer, and carry your training certificate when transporting dangerous goods.","Report any incident — spill, leak, fire, explosion or damaged container — immediately to police or the Provincial Emergency Program at 1-800-663-3456."]}}}</script>

/* pool builders — for a class, "dg" means only the dangerous-goods slice of ch5;
   full ch5 (classes 1 & 3) already includes those items */
function chapterItems(kind, key){
  if(key==="dg") return DATA.chapters[5][kind].filter(x=>x.section==="dg");
  return DATA.chapters[key][kind];
}
function classPool(cls, kind){
  const out=[];
  for(const k of CLASSES[cls].chapters)
    for(const it of chapterItems(kind,k)) out.push(it);
  return out;
}

/* ---------- persistence ---------- */
const STORE_KEY="icbc-study-v1";
let store;
try{ store = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; }catch(e){ store = {}; }
store.perClass = store.perClass || {};
function st(cls){
  if(!store.perClass[cls]) store.perClass[cls]={cardKnown:{}, q:{}, exams:[]};
  const s=store.perClass[cls];
  s.cardKnown=s.cardKnown||{}; s.q=s.q||{}; s.exams=s.exams||[];
  return s;
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
function recordAnswer(cls,qid,ok){
  const s=st(cls); const r=s.q[qid]||(s.q[qid]={seen:0,correct:0});
  r.seen++; if(ok)r.correct++; save();
}

/* ---------- tiny helpers ---------- */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function sample(arr,n){ return shuffle(arr.slice()).slice(0,n); }
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const pct=(a,b)=>b?Math.round(a/b*100):0;

/* build an exam paper: proportional to chapter pool sizes, ≥1 per chapter */
function examPaper(cls){
  const chs=CLASSES[cls].chapters;
  const pools=chs.map(k=>chapterItems("questions",k));
  const total=pools.reduce((a,p)=>a+p.length,0);
  const take=pools.map(p=>Math.max(1,Math.round(p.length/total*EXAM.size)));
  let sum=take.reduce((a,b)=>a+b,0);
  // trim/grow to exactly EXAM.size, adjusting the biggest pools first
  const order=chs.map((_,i)=>i).sort((a,b)=>pools[b].length-pools[a].length);
  let g=0;
  while(sum!==EXAM.size){
    const i=order[g%order.length];
    if(sum>EXAM.size && take[i]>1){take[i]--;sum--;}
    else if(sum<EXAM.size && take[i]<pools[i].length){take[i]++;sum++;}
    g++;
  }
  const paper=[];
  chs.forEach((k,i)=>paper.push(...sample(pools[i],take[i])));
  return shuffle(paper);
}

const REVIEW_AFTER_DAYS=3;
function learnModules(cls){
  return CLASSES[cls].chapters.map(k=>{
    const key = k==="dg" ? "dg" : String(k);
    return {key, lesson:DATA.lessons[key]};
  }).filter(m=>m.lesson);
}
function lstate(cls,key){
  const s=st(cls); s.learn=s.learn||{};
  return s.learn[key]||(s.learn[key]={sec:0,done:false,best:0,ts:0});
}
function reviewDue(ls){
  return ls.done && ls.ts && (Date.now()-ls.ts) > REVIEW_AFTER_DAYS*24*3600*1000;
}
function learnHomeView(cls){
  const c=CLASSES[cls];
  const mods=learnModules(cls);
  app.innerHTML = header("Learn — "+c.n, {name:"class",cls}) + `

    ${LEARN.passPct}%+ on the quiz to complete a module; completed modules resurface
    as review after a few days (spaced repetition).</p>
    ${mods.map((m,i)=>{
      const ls=lstate(cls,m.key);
      const due=reviewDue(ls);
      const status = due?`review due ↻`:ls.done?`✓ done · best ${ls.best}%`:
        ls.sec>0?`in progress · ${ls.sec}/${m.lesson.sections.length}`:"not started";
      const scls = due?"due":ls.done?"done":"";
      return `<button class="rowcard" data-nav='${esc(JSON.stringify({name:"learnMod",cls,key:m.key}))}'>

      </button>`;
    }).join("")}`;
}

    }).join("")}
    <div style="margin-top:16px;display:flex;gap:10px">
      <button class="btn ghost" style="flex:1" id="l-prev" ${learn.step===0?"disabled":""}>&larr; Back</button>
      <button class="btn" style="flex:2" id="l-next" ${allAnswered?"":"disabled"}>
        ${learn.step===n-1?"Reinforcement quiz →":"Continue →"}</button>
    </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const ci=+b.dataset.ci, oi=+b.dataset.oi;
    if(learn.answered[learn.step+"-"+ci]!==undefined) return;
    learn.answered[learn.step+"-"+ci]=oi;
    learnView(cls);
  });
  document.getElementById("l-prev").onclick=()=>{ learn.step--; learnView(cls); };
  document.getElementById("l-next").onclick=()=>{
    learn.step++;
    const ls=lstate(cls,learn.key);
    if(learn.step>ls.sec && !ls.done){ ls.sec=learn.step; save(); }
    learnView(cls);
  };
}
function learnQuizPaper(cls){
  const key=learn.key;
  const own=chapterItems("questions", key==="dg"?"dg":+key);
  const paper=sample(own, Math.min(LEARN.quizOwn, own.length));
  // interleaving: pull a couple of questions from other completed modules
  const s=st(cls); s.learn=s.learn||{};
  const doneKeys=Object.keys(s.learn).filter(k=>k!==key&&s.learn[k].done);
  if(doneKeys.length){
    const other=[];
    doneKeys.forEach(k=>other.push(...chapterItems("questions", k==="dg"?"dg":+k)));
    paper.push(...sample(other, Math.min(LEARN.quizReview, other.length)).map(q=>({...q,review:true})));
  }
  return shuffle(paper);
}
function learnQuizView(cls){
  if(!learn.quiz) learn.quiz={qs:learnQuizPaper(cls), i:0, picked:null, right:0, total:0, log:[]};
  const Q=learn.quiz;
  if(Q.i>=Q.qs.length){ learnResultView(cls); return; }
  const q=Q.qs[Q.i], done=Q.picked!==null;
  app.innerHTML = header("Reinforcement quiz", {name:"learnHome",cls}) + `
    <div class="progress"><i style="width:${pct(Q.i+(done?1:0),Q.qs.length)}%"></i></div>
    <div class="qmeta">${Q.i+1} of ${Q.qs.length}${q.review?" · ↻ review from an earlier module":""} · Guide p. ${q.page||"—"}</div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.choices.map((chc,ci)=>{
      let state="";
      if(done){ if(ci===q.answerIndex) state="correct"; else if(ci===Q.picked) state="wrong"; }
      return `<button class="opt" data-ci="${ci}" data-state="${state}" ${done?"disabled":""}>
        <span class="k">${"ABCD"[ci]}</span><span>${esc(chc)}</span></button>`;
    }).join("")}
    ${done?`<div class="explain">${Q.picked===q.answerIndex?"<b>Correct.</b> ":"<b>Not quite.</b> "}
      ${esc(q.explanation||"")}<span class="src">Driving Commercial Vehicles, p. ${q.page||"—"}</span></div>
      <div style="margin-top:14px"><button class="btn block" id="lq-next">
      ${Q.i===Q.qs.length-1?"See result":"Next"}</button></div>`:""}`;
  if(!done) app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    Q.picked=+b.dataset.ci;
    const ok=Q.picked===q.answerIndex;
    Q.total++; if(ok)Q.right++;
    Q.log.push({q,picked:Q.picked,ok});
    if(q.id) recordAnswer(cls,q.id,ok);
    learnQuizView(cls);
  });
  else document.getElementById("lq-next").onclick=()=>{ Q.i++; Q.picked=null; learnQuizView(cls); };
}
function learnResultView(cls){
  const Q=learn.quiz, p=pct(Q.right,Q.total), passed=p>=LEARN.passPct;
  const ls=lstate(cls,learn.key);
  if(passed){ ls.done=true; ls.ts=Date.now(); ls.sec=0; }
  ls.best=Math.max(ls.best||0,p); save();
  const wrong=Q.log.filter(a=>!a.ok);
  app.innerHTML = header("Module result", {name:"learnHome",cls}) + `
    <div class="card scorehero"><div class="n">${p}%</div>
      <div class="d">${Q.right} of ${Q.total} on the reinforcement quiz</div>
      <div class="verdict ${passed?"pass":"mid"}"><span class="ic">${passed?"✓":"◐"}</span>
        <span>${passed?"Module complete":"Almost — review and retry"}
        <span class="sub">— ${passed?"it'll resurface for review in a few days":
        "you need "+LEARN.passPct+"% to complete the module"}</span></span></div></div>
    ${wrong.length?`<div class="eyebrow">Worth another look</div><div class="card">
      ${wrong.map(a=>`<div class="review-item"><div class="rq">${esc(a.q.q)}</div>
        <div class="ra"><span class="no">✗ You: ${esc(a.q.choices[a.picked])}</span><br>
        <span class="yes">✓ ${esc(a.q.choices[a.q.answerIndex])}</span><br>
        <span style="color:var(--ink2)">${esc(a.q.explanation||"")}${a.q.page?" (p. "+a.q.page+")":""}</span></div></div>`).join("")}
    </div>`:""}
    <div style="margin-top:16px">
      ${passed?"":`<button class="btn block" id="lr-retry">Re-read sections & retry quiz</button>`}
      <button class="btn block ${passed?"":"ghost"}" data-nav='${esc(JSON.stringify({name:"learnHome",cls}))}'>
        ${passed?"Next module":"Back to modules"}</button>
    </div>`;
  const r=document.getElementById("lr-retry");
  if(r) r.onclick=()=>{ learn.step=0; learn.answered={}; learn.quiz=null; go({name:"learnView",cls}); };
}

/* ----- readiness ----- */
function masteryByChapter(cls){
  const s=st(cls);
  return CLASSES[cls].chapters.map(k=>{
    const qs=chapterItems("questions",k);
    let seen=0,correct=0,tried=0;
    qs.forEach(q=>{ const r=s.q[q.id]; if(r&&r.seen){tried++; seen+=r.seen; correct+=r.correct;} });
    return {k, total:qs.length, tried, acc: seen?Math.round(correct/seen*100):null};
  });
}
function readyView(cls){
  const c=CLASSES[cls], s=st(cls);
  const mastery=masteryByChapter(cls);
  const pool=classPool(cls,"questions");
  const coverage=pct(mastery.reduce((a,m)=>a+m.tried,0), pool.length);
  const exams=s.exams.slice(-5);
  const last=exams[exams.length-1];
  const examOk=!!last&&last.pct>=EXAM.passPct&&exams.length>=2&&exams[exams.length-2].pct>=EXAM.passPct;
  const chaptersWeak=mastery.filter(m=>m.acc!==null&&m.acc<75);
  const chaptersUntried=mastery.filter(m=>m.acc===null);
  const chOk=chaptersWeak.length===0&&chaptersUntried.length===0;
  const covOk=coverage>=70;
  const ready=examOk&&chOk&&covOk;
  const verdict = ready?["pass","✓","Test-ready","You're consistently at the passing standard across the board."] :
    (examOk||covOk)?["mid","◐","Nearly there","A focused push on the gaps below should do it."] :
    ["fail","✗","Keep studying","Work through the cue cards and quizzes chapter by chapter first."];
  app.innerHTML = header("Readiness — "+c.n, {name:"class",cls}) + `
    <div class="card">
      <div class="verdict ${verdict[0]}" style="margin-top:0">
        <span class="ic">${verdict[1]}</span><span>${verdict[2]}
        <span class="sub">— ${verdict[3]}</span></span></div>
      <ul class="checklist">
        <li class="${examOk?"ok":"no"}"><span class="ic">${examOk?"✓":"○"}</span>
          <span>Pass two practice exams in a row at ≥${EXAM.passPct}%
          <span class="why">${exams.length?exams.map(e=>e.pct+"%").join(" · "):"none taken yet"}</span></span></li>
        <li class="${chOk?"ok":"no"}"><span class="ic">${chOk?"✓":"○"}</span>
          <span>Every chapter at ≥75% accuracy
          <span class="why">${chOk?"all chapters on standard":
            (chaptersUntried.length?chaptersUntried.length+" chapter(s) untouched":"")+
            (chaptersUntried.length&&chaptersWeak.length?", ":"")+
            (chaptersWeak.length?chaptersWeak.map(m=>(m.k==="dg"?"DG":"Ch "+m.k)+" "+m.acc+"%").join(", "):"")}</span></span></li>
        <li class="${covOk?"ok":"no"}"><span class="ic">${covOk?"✓":"○"}</span>
          <span>Try ≥70% of the question bank
          <span class="why">${coverage}% attempted so far</span></span></li>
      </ul>
    </div>
    <button class="btn block" style="margin-top:14px" id="start-exam">Start practice exam
      (${EXAM.size} questions · ${EXAM.minutes} min guide)</button>
    <div class="eyebrow">Chapter mastery</div>
    <div class="card">
      ${mastery.map(m=>{
        const cls2=m.acc===null?"na":m.acc<65?"low":m.acc<EXAM.passPct?"mid":"";
        return `<div class="meter-row ${cls2}">
          <span class="lbl">${m.k==="dg"?"DG pp.110–11":"Ch "+m.k} · ${esc(chShort(m.k))}</span>
          <span class="val">${m.acc===null?"not tried":m.acc+"% · "+m.tried+"/"+m.total+" tried"}</span>
          <span class="bar"><i style="width:${m.acc||0}%"></i></span></div>`;
      }).join("")}
    </div>
    ${exams.length?`<div class="eyebrow">Recent practice exams</div><div class="card">
      ${exams.slice().reverse().map(e=>`<div class="meter-row ${e.pct<65?"low":e.pct<EXAM.passPct?"mid":""}">
        <span class="lbl">${new Date(e.ts).toLocaleDateString()} ${new Date(e.ts).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span>
        <span class="val">${e.right}/${e.total} · ${e.pct}%</span>
        <span class="bar"><i style="width:${e.pct}%"></i></span></div>`).join("")}
    </div>`:""}
    <details class="tips"><summary>Examiner's tips for the road test</summary>
      <ul>${DATA.extras.examinersTips.general.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></details>
    <details class="tips"><summary>About the real knowledge test</summary>
      <ul>${DATA.extras.knowledgeTestFacts.map(t=>`<li>${esc(t)}</li>`).join("")}
      <li><i>Format note: ICBC's commercial knowledge tests are reported as 35 questions
      with 28 correct (80%) needed to pass — this app's practice exam mirrors that.</i></li></ul></details>`;
  document.getElementById("start-exam").onclick=()=>{
    quiz={qs:examPaper(cls), i:0, answers:new Array(0), picks:{}, started:Date.now()};
    go({name:"exam",cls});
  };
}
function examView(cls){
  const qs=quiz.qs, i=quiz.i, q=qs[i];
  const answered=Object.keys(quiz.picks).length;
  app.innerHTML = header(`Exam — ${i+1}/${qs.length}`, null) + `
    <div class="progress"><i style="width:${pct(answered,qs.length)}%"></i></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span class="qmeta">${esc(q.topic||chShort(q.chapter))}</span>
      <span class="examtimer" id="timer"></span></div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.choices.map((ch,ci)=>`<button class="opt" data-ci="${ci}"
      data-state="${quiz.picks[i]===ci?"picked":""}">
      <span class="k">${"ABCD"[ci]}</span><span>${esc(ch)}</span></button>`).join("")}
    <div class="qgrid">${qs.map((_,n)=>`<button data-n="${n}"
      class="${quiz.picks[n]!==undefined?"answered":""} ${n===i?"current":""}">${n+1}</button>`).join("")}</div>
    <div style="display:flex;gap:10px">
      <button class="btn ghost" style="flex:1" id="e-prev" ${i===0?"disabled":""}>&larr; Prev</button>
      <button class="btn ghost" style="flex:1" id="e-next" ${i===qs.length-1?"disabled":""}>Next &rarr;</button>
    </div>
    <button class="btn block" id="e-submit" ${answered<qs.length?"disabled":""}>
      Submit exam${answered<qs.length?` (${qs.length-answered} unanswered)`:""}</button>
    <p class="footer-note">No feedback until you submit — just like the real thing.
    <button style="color:var(--bad);font-size:12.5px" id="e-quit">Abandon exam</button></p>`;
  const tick=()=>{ const el=document.getElementById("timer"); if(!el)return;
    const secs=Math.floor((Date.now()-quiz.started)/1000);
    el.textContent=String(Math.floor(secs/60)).padStart(2,"0")+":"+String(secs%60).padStart(2,"0")
      +" / "+EXAM.minutes+":00"; };
  tick(); clearInterval(window.__examTimer); window.__examTimer=setInterval(tick,1000);
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    quiz.picks[i]=+b.dataset.ci; examView(cls); });
  app.querySelectorAll(".qgrid button").forEach(b=>b.onclick=()=>{ quiz.i=+b.dataset.n; examView(cls); });
  document.getElementById("e-prev").onclick=()=>{ quiz.i--; examView(cls); };
  document.getElementById("e-next").onclick=()=>{ quiz.i++; examView(cls); };
  document.getElementById("e-quit").onclick=()=>{ clearInterval(window.__examTimer);
    if(confirm("Abandon this practice exam? Nothing will be recorded.")) go({name:"ready",cls});
    };
  document.getElementById("e-submit").onclick=()=>{
    clearInterval(window.__examTimer);
    const answers=qs.map((qq,n)=>({q:qq,picked:quiz.picks[n],ok:quiz.picks[n]===qq.answerIndex}));
    answers.forEach(a=>recordAnswer(cls,a.q.id,a.ok));
    const right=answers.filter(a=>a.ok).length;
    const rec={ts:Date.now(), right, total:qs.length, pct:pct(right,qs.length),
      mins:Math.round((Date.now()-quiz.started)/60000)};
    st(cls).exams.push(rec); save();
    quiz.answers=answers; go({name:"examResults",cls});
  };
}
function examResultsView(cls){
  const answers=quiz.answers, right=answers.filter(a=>a.ok).length, total=answers.length;
  const p=pct(right,total), passed=p>=EXAM.passPct;
  const wrong=answers.filter(a=>!a.ok);
  app.innerHTML = header("Exam results", {name:"ready",cls}) + `
    <div class="card scorehero"><div class="n">${p}%</div>
      <div class="d">${right} of ${total} · ${Math.round((Date.now()-quiz.started)/60000)} min</div>
      <div class="verdict ${passed?"pass":"fail"}"><span class="ic">${passed?"✓":"✗"}</span>
        <span>${passed?"Pass":"Below the line"}
        <span class="sub">— real test standard is ${EXAM.passPct}% (${Math.ceil(EXAM.size*EXAM.passPct/100)}/${EXAM.size})</span></span></div></div>
    ${wrong.length?`<div class="eyebrow">What you missed (${wrong.length})</div><div class="card">
      ${wrong.map(a=>`<div class="review-item"><div class="rq">${esc(a.q.q)}</div>
        <div class="ra"><span class="no">✗ You: ${a.picked===undefined?"no answer":esc(a.q.choices[a.picked])}</span><br>
        <span class="yes">✓ ${esc(a.q.choices[a.q.answerIndex])}</span><br>
        <span style="color:var(--ink2)">${esc(a.q.explanation||"")} (p. ${a.q.page||"—"})</span></div></div>`).join("")}
    </div>`:`<div class="card" style="text-align:center;color:var(--good);font-weight:700">Perfect paper. 🎉</div>`}
    <div style="margin-top:16px">
      <button class="btn block" data-nav='${esc(JSON.stringify({name:"ready",cls}))}'>Back to readiness</button>
    </div>`;
}

/* ---------- router ---------- */
function render(){
  clearInterval(window.__examTimer);
  switch(view.name){
    case "home": homeView(); break;
    case "class": classView(view.cls); break;
    case "learnHome": learnHomeView(view.cls); break;
    case "learnMod": startLearn(view.cls, view.key); break;
    case "learnView": learnView(view.cls); break;
    case "cardsSetup": cardsSetupView(view.cls); break;
    case "cards": cardsView(view.cls); break;
    case "quizSetup": quizSetupView(view.cls); break;
    case "quiz": quizView(view.cls); break;
    case "quizResults": quizResultsView(view.cls); break;
    case "ready": readyView(view.cls); break;
    case "exam": examView(view.cls); break;
    case "examResults": examResultsView(view.cls); break;
    default: homeView();
  }
}
app.addEventListener("click",e=>{
  const t=e.target.closest("[data-nav]");
  if(t){ go(JSON.parse(t.dataset.nav)); }
});
render();
</script>
</body>
</html>
