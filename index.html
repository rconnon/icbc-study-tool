ations and maintain stroke more reliably than manual slack adjusters — but they must still be checked as part of a pre-trip inspection. If one strokes beyond the maximum allowed, it has failed, been incorrectly installed, or there's a foundation brake problem needing a qualified brake service mechanic.","topic":"Automatic slack adjusters","id":"9-c11","chapter":9},{"front":"With a Type 30 chamber and an automatic slack adjuster, at what measurements do the brakes need repair?","back":"More than ¾ of an inch (20 mm) using the pry method of free stroke measurement, or more than two inches (50 mm) using the applied stroke method. Automatic slack adjuster strokes are usually slightly longer than well-adjusted manual ones. Adjustment of automatic slack adjusters is an emergency procedure only — record it on your daily post-trip inspection report and get a repair as soon as possible.","topic":"Automatic slack adjusters","id":"9-c12","chapter":9},{"front":"Why is manually adjusting an automatic slack adjuster dangerous?","back":"It gives a false sense of security — a manual adjustment may temporarily shorten the stroke, but the automatic slack adjuster will soon re-set to its designed stroke. Repeated manual adjustment causes undue wear on internal components and can lead to early failure. Automatic slack adjusters should only be adjusted or repaired by a qualified mechanic, following the manufacturer's instructions.","topic":"Automatic slack adjusters","id":"9-c13","chapter":9},{"front":"How do emergency adjustments differ between hexagonal and square adjusting bolts on automatic slack adjusters?","back":"Hexagonal (six-sided) bolt: turn clockwise until the lining contacts the drum, then back off ½ a turn (backing off may take considerable force with ratcheting — that's normal). Square bolt: first disengage the spring-loaded pawl (pry up the button on the ¾ inch hex cap about 1/32 inch, or remove the hex cap, spring and pawl), set up with a counter-clockwise turn until the lining contacts the drum, then turn ½ a turn clockwise to restore clearance.","topic":"Emergency adjustment","id":"9-c14","chapter":9}],"questions":[{"q":"What is the most common cause of brake failures and runaways in air-brake-equipped vehicles?","choices":["Sudden air system failure","Lack of routine brake maintenance and drivers failing to check the brakes daily","Manufacturing defects in the foundation brakes","Compressor failure at highway speeds"],"answerIndex":1,"explanation":"Crashes from brake failures and runaways are almost never caused by an air system failure — the absence of routine maintenance or the driver failing to check the brakes daily is a much more common factor.","topic":"Why adjustment matters","page":189,"id":"9-q0","chapter":9},{"q":"What is the maximum fine for operating a commercial vehicle with defective brakes, including excessive brake chamber pushrod stroke?","choices":["$500","$1,000","$2,000","$5,000"],"answerIndex":2,"explanation":"You may be fined as much as $2,000 if you're operating a vehicle with brakes that are defective, which includes excessive brake chamber pushrod stroke.","topic":"The law","page":189,"id":"9-q1","chapter":9},{"q":"Who is ultimately responsible for ensuring that a vehicle's brakes are operating properly before it is moved?","choices":["The driver","The company maintenance crew","The carrier's safety officer","A certified brake mechanic"],"answerIndex":0,"explanation":"Even if the company has a maintenance crew, one person is ultimately responsible for the brakes before the vehicle is moved — the driver.","topic":"Responsibility","page":189,"id":"9-q2","chapter":9},{"q":"How often does the law require you to check manual and automatic slack adjusters?","choices":["Weekly, during scheduled maintenance","Every 40,000 km","Only when the brakes feel weak","Daily, during the pre-trip inspection"],"answerIndex":3,"explanation":"Federal and provincial laws require a daily check of manual and automatic slack adjusters during the pre-trip inspection. You must also check brakes before steep grades posted with regulatory signs.","topic":"The law","page":189,"id":"9-q3","chapter":9},{"q":"What is the maximum available stroke of a Type 30 clamp type air brake chamber?","choices":["1¾ inches (45 mm)","2½ inches (65 mm)","Two inches (50 mm)","Three inches (75 mm)"],"answerIndex":1,"explanation":"The Type 30, the most common chamber on trucks and trailers, has a maximum available stroke of 2½ inches (65 mm). The long-stroke Type 30LS has a maximum of three inches.","topic":"Brake chambers","page":190,"id":"9-q4","chapter":9},{"q":"When an s-cam brake is correctly adjusted and applied, how far should the brake chamber stroke?","choices":["Exactly to its maximum stroke","About three-quarters of its maximum stroke","Less than half of its maximum stroke","No more than 1/32 of an inch"],"answerIndex":2,"explanation":"A correctly adjusted brake strokes less than half of the chamber's maximum stroke when applied, leaving reserve travel for heat expansion of the drum.","topic":"S-cam brakes","page":190,"id":"9-q5","chapter":9},{"q":"When brakes are correctly adjusted, how large is the running clearance between the brake lining and the drum?","choices":["Only a few thousandths of an inch — hardly thicker than three sheets of paper","About ½ an inch","About ¼ of an inch","About 1/8 of an inch"],"answerIndex":0,"explanation":"The manual notes that correct running clearance between lining and drum is only a few thousandths of an inch — hardly thicker than three sheets of paper.","topic":"S-cam brakes","page":190,"id":"9-q6","chapter":9},{"q":"What is the danger of operating a vehicle whose pushrod travel is barely within tolerance while the brake drums are cold?","choices":["The compressor will cycle too often and overheat","The spring parking brakes may drag and wear out","The air reservoirs will drain more quickly than normal","As the drums heat up they expand, the chambers stroke further and can bottom out, greatly reducing or eliminating braking power"],"answerIndex":3,"explanation":"Cast iron drums expand when heated, making the chamber stroke further. A brake that seems fine cold can bottom out when hot — on long downgrades this can cause a total loss of braking and a runaway.","topic":"Hot brake drums","page":191,"id":"9-q7","chapter":9},{"q":"What is the first thing you should do when preparing to check brake adjustment?","choices":["Pump the reservoir pressure down to 60 p.s.i.","Make sure the vehicle is safely parked with the wheels blocked","Apply the spring parking brakes firmly","Start the engine and leave it running"],"answerIndex":1,"explanation":"Always block the wheels before checking any brakes. The air system should be at full pressure, spring parking brakes released, and the engine off so you can listen for air leaks.","topic":"Preparation","page":191,"id":"9-q8","chapter":9},{"q":"Using the applied stroke method, how much brake application pressure should you apply and hold?","choices":["20 to 30 p.s.i. (138 – 207 kPa)","50 to 60 p.s.i. (345 – 414 kPa)","90 to 100 p.s.i. (620 – 690 kPa)","120 to 130 p.s.i. (827 – 896 kPa)"],"answerIndex":2,"explanation":"The applied stroke method requires a full brake application of 90 to 100 p.s.i. (620 – 690 kPa), with reservoir pressure at least 100 p.s.i. (690 kPa) to start and the engine off.","topic":"Applied stroke method","page":192,"id":"9-q9","chapter":9},{"q":"With a Type 30 chamber and a manual slack adjuster, the brakes need adjustment if the applied stroke is more than:","choices":["1¾ inches (45 mm)","1 inch (25 mm)","¾ of an inch (20 mm)","2½ inches (65 mm)"],"answerIndex":0,"explanation":"An applied stroke of 1 inch to 1½ inches (25 – 38 mm) is a good range; more than 1¾ inches (45 mm) means adjustment is needed. Adjust as measurements approach the limit — don't wait.","topic":"Applied stroke method","page":192,"id":"9-q10","chapter":9},{"q":"Using the pry method, the free stroke of a Type 30 chamber pushrod indicates the brakes need adjustment when it is more than:","choices":["1½ inches (38 mm)","¾ of an inch (20 mm)","Two inches (50 mm)","¼ of an inch (6 mm)"],"answerIndex":1,"explanation":"A free stroke of ½ to ¾ of an inch (12 – 20 mm) is a good range; more than ¾ of an inch (20 mm) means the brakes need adjustment.","topic":"Free stroke / pry method","page":193,"id":"9-q11","chapter":9},{"q":"What does it mean if the red marking on a brake chamber pushrod is visible at the chamber face?","choices":["The brake has been recently adjusted","The pushrod is a long-stroke type","The chamber diaphragm needs lubrication","The brake is dangerously out of adjustment and needs immediate attention"],"answerIndex":3,"explanation":"New pushrods carry a marking (usually red) that shows when travel becomes excessive. Don't wait until the red marking is exposed before adjusting the brakes.","topic":"Adjustment indicators","page":193,"id":"9-q12","chapter":9},{"q":"What equipment should you carry to check and adjust manual slack adjusters?","choices":["Only a tire pressure gauge and gloves","A torque wrench and feeler gauges","A flashlight, chalk or marker, a ruler, a pry tool and a wrench (usually 9/16 inch)","A hydraulic jack and axle stands"],"answerIndex":2,"explanation":"You'll need a flashlight to inspect components, chalk or another marker plus a ruler to check free stroke, a tool to pry on the pushrod, and a wrench to adjust manual slack adjusters — plus sturdy clothing, hard hat and eye protection.","topic":"Preparation","page":193,"id":"9-q13","chapter":9},{"q":"While turning the adjusting bolt of a manual slack adjuster, how do you know you're turning in the correct direction?","choices":["The pushrod slowly pulls out of the brake chamber","The camshaft end rotates in the same direction it would if the brakes were being applied","You hear air escaping from the chamber","The slack adjuster arm moves outward"],"answerIndex":1,"explanation":"Watch the end of the camshaft — it should rotate in the brake-applying direction. The pushrod and slack adjuster arm should never move in or out; if the pushrod is being pulled out of the chamber, you're turning the wrong way.","topic":"Manual adjustment","page":194,"id":"9-q14","chapter":9},{"q":"After turning a manual slack adjuster's bolt until solid resistance is met, what should you do next?","choices":["Back the bolt off about 1/3 of a turn and make sure the locking sleeve re-engages","Back the bolt off two full turns","Leave it exactly at the point of resistance","Tighten it a further ½ turn to seat the linings"],"answerIndex":0,"explanation":"Solid resistance means the linings have contacted the drum. Backing off about 1/3 of a turn establishes correct running clearance; the locking sleeve must re-engage so the adjustment won't back off. Then re-measure the free stroke.","topic":"Manual adjustment","page":194,"id":"9-q15","chapter":9},{"q":"Since what year have all commercial trucks and trailers with air brakes been manufactured with automatic slack adjusters?","choices":["1986","1990","2001","1996"],"answerIndex":3,"explanation":"All commercial trucks and trailers with air brakes have been manufactured with automatic slack adjusters since 1996. They still must be checked as part of every pre-trip inspection.","topic":"Automatic slack adjusters","page":195,"id":"9-q16","chapter":9},{"q":"What is an advantage of automatic slack adjusters over manual slack adjusters?","choices":["They adjust themselves during normal brake applications and maintain brake stroke more reliably","They never need to be checked once installed","They allow a longer maximum pushrod stroke before repair is needed","They can be adjusted from inside the cab"],"answerIndex":0,"explanation":"Automatic slack adjusters adjust themselves during day-to-day driving and maintain stroke more reliably — a Transport Canada study found vehicles with manual slack adjusters were put out of service at a rate 150 per cent higher. But automatics must still be checked in every pre-trip inspection.","topic":"Automatic slack adjusters","page":195,"id":"9-q17","chapter":9},{"q":"With a Type 30 chamber and an automatic slack adjuster, the brakes need repair if the applied stroke is more than:","choices":["1½ inches (38 mm)","1¾ inches (45 mm)","Two inches (50 mm)","2½ inches (65 mm)"],"answerIndex":2,"explanation":"Automatic slack adjuster strokes are usually slightly longer than well-adjusted manual ones: repair is needed at more than two inches (50 mm) applied stroke, or more than ¾ of an inch (20 mm) free stroke by the pry method.","topic":"Automatic slack adjusters","page":196,"id":"9-q18","chapter":9},{"q":"Why is it dangerous to manually adjust an automatic slack adjuster?","choices":["It voids the vehicle's inspection certificate","It immediately releases the spring parking brakes","It permanently shortens the pushrod","It gives a false sense of security — the adjuster soon re-sets to its designed stroke, and repeated adjustment causes wear that can lead to early failure"],"answerIndex":3,"explanation":"A manual adjustment only temporarily shortens the stroke; the automatic slack adjuster will re-set itself, and repeated adjustment wears internal components. Excessive stroke usually signals a problem that a qualified brake mechanic must repair.","topic":"Automatic slack adjusters","page":195,"id":"9-q19","chapter":9},{"q":"On an automatic slack adjuster with a square adjusting bolt, what must you do before attempting an emergency adjustment?","choices":["Disengage the spring-loaded pawl (pry up and hold the button on the hex cap, or remove the hex cap, spring and pawl)","Cage the spring brake with the caging bolt","Drain all air reservoirs to zero","Remove the clevis pin from the pushrod"],"answerIndex":0,"explanation":"Don't try adjusting a square-bolt unit until the spring-loaded pawl that meshes with internal teeth is disengaged. These brakes set up with a counter-clockwise turn, then ½ a turn clockwise restores running clearance.","topic":"Emergency adjustment","page":197,"id":"9-q20","chapter":9},{"q":"Why can't brake adjustment be reliably checked from the cab by watching for an 8 to 12 p.s.i. pressure drop during a full application?","choices":["The pressure drop would actually be much larger than 8 to 12 p.s.i.","Modern trucks have very large reservoirs so the drop never reaches that range, and gauge markings aren't fine enough to read such changes","The dash gauges only show secondary system pressure","The governor automatically replaces any air used during an application"],"answerIndex":1,"explanation":"Even if all brakes had excess pushrod travel, the pressure drop would not reach the 8 to 12 p.s.i. (55.2 to 82.8 kPa) range on modern trucks, and most reservoir gauges can't be read that precisely. There's no reliable substitute for physically checking brake adjustment.","topic":"Misconceptions","page":197,"id":"9-q21","chapter":9},{"q":"Why is it unsafe to assume the spring brakes are fully released just because the parking brake control valve and trailer supply valve are open?","choices":["The valves close automatically whenever the engine is off","Open valves always mean the service brakes are applied instead","These valves can remain open with as little as 20 p.s.i. (138 kPa) of system pressure, so the spring brakes may still be partially or fully applied","The trailer supply valve has no effect on spring brakes"],"answerIndex":2,"explanation":"Some control valves stay open at very low pressure while spring brakes remain partly or fully applied. Make sure system pressure is at least 90 to 100 p.s.i. (620 to 690 kPa) and all parking brakes are released before checking adjustment.","topic":"Misconceptions","page":198,"id":"9-q22","chapter":9},{"q":"Under B.C. Commercial Vehicle Safety and Enforcement rules, what is the rule about retrofitting slack adjusters?","choices":["Manual slack adjusters may replace automatic ones if adjusted daily","Automatic slack adjusters must be replaced with manual ones every five years","Retrofitting is allowed only on trailers, not trucks","It is illegal to retrofit manual slack adjusters on a vehicle manufactured with automatic slack adjusters"],"answerIndex":3,"explanation":"It's illegal in B.C. to retrofit manual slack adjusters onto a vehicle manufactured with automatic slack adjusters. Automatics adjust for brake wear as the brakes are used, while manual units stay out of adjustment until someone adjusts them.","topic":"The law","page":198,"id":"9-q23","chapter":9}]},"10":{"title":"vehicle and air brake pre-trip inspections","cards":[{"front":"Who is responsible for ensuring a commercial vehicle is safe before it's driven each day?","back":"You, the driver, are responsible for ensuring your vehicle is safe every time you drive it. Either you or another person specified by the carrier must do the daily inspections, but both the driver and the carrier share the responsibility to ensure the inspections are done properly.","topic":"Driver responsibility","id":"10-c0","chapter":10},{"front":"Under the National Safety Code (NSC), when must commercial vehicles be inspected?","back":"All commercial vehicles that fall under the NSC must be inspected before they're used each day (pre-trip inspection) and at the end of the final trip of each day (post-trip inspection). These inspections are required under the Motor Vehicle Act Regulations.","topic":"NSC inspection requirements","id":"10-c1","chapter":10},{"front":"Which vehicles require daily written trip inspection reports?","back":"1) A bus, school bus, special activity bus, special vehicle or limousine with a seating capacity of more than 10 including the driver; 2) a two-axle truck or truck-tractor with a licensed GVW greater than 14,600 kg; 3) a truck or truck-tractor towing a trailer that has a licensed GVW greater than 8,200 kg.","topic":"Written report requirements","id":"10-c2","chapter":10},{"front":"How often must you re-inspect the cargo securement system during a trip?","back":"Within 80 km from the point where the cargo was loaded, and then on a regular basis at the earliest of: a change in your duty status, three hours of driving, or 240 km of driving since the last inspection. Record cargo securement inspections on your daily log. You don't need to inspect cargo that is sealed and you've been ordered not to inspect, or cargo that is inaccessible.","topic":"Cargo securement","id":"10-c3","chapter":10},{"front":"What must every written trip inspection report include?","back":"The licence plate or unit numbers of the vehicle and/or trailers; all defects that may affect safe operation (or a statement that no defect was discovered); the date; and the signature of the person making the report. It must be completed prior to the first trip of the day.","topic":"Written report requirements","id":"10-c4","chapter":10},{"front":"On a trip lasting more than one day, when must new trip inspection reports be completed?","back":"No later than the first rest stop of every subsequent day of the trip.","topic":"Written report requirements","id":"10-c5","chapter":10},{"front":"What must you do if you couple to another trailer during the day?","back":"You must obtain and carry the trip inspection report completed for that trailer that day. If a trip inspection report for that trailer hasn't been done, you must complete one.","topic":"Written report requirements","id":"10-c6","chapter":10},{"front":"When more than one driver shares a vehicle, who signs the trip inspection report?","back":"Only one driver is required to sign, provided there's no disagreement — all drivers must agree about which defects are reported and how. If there's a disagreement over the defects to be reported, all drivers must sign and indicate the nature of the disagreement.","topic":"Written report requirements","id":"10-c7","chapter":10},{"front":"How soon must trip inspection reports be given to the carrier?","back":"All trip inspection reports must be given to the carrier within 20 days.","topic":"Written report requirements","id":"10-c8","chapter":10},{"front":"What tools should you use to conduct a pre-trip inspection?","back":"A flashlight to inspect components; a tire pressure gauge; chalk or other marker and a ruler or measuring device to check pushrod free stroke; a tool to pry on the air brake chamber pushrod; a wrench to adjust air brakes; and a watch or timing device to check air brake leakage and buildup time. Wear sturdy clothing, a hard hat and eye protection.","topic":"Pre-trip preparation","id":"10-c9","chapter":10},{"front":"What is a good order to follow for a full pre-trip inspection?","back":"1) Under hood; 2) in cab; 3) air brake system test; 4) circle check for lights; 5) mechanical circle check; 6) brake response, tug and steering wheel slack tests (pull ahead slowly to check brake and steering response). You may inspect in any order, but use the same order every time to avoid missing items.","topic":"Inspection structure","id":"10-c10","chapter":10},{"front":"Before beginning a pre-trip inspection, what should you do, and which direction should you walk during the circle check?","back":"Park in a safe location away from traffic, on level ground if possible; set the parking brakes; shut off the engine; and on a large commercial vehicle block the wheels (a block in front of and behind a tire on the same axle). Walk counter-clockwise during the circle check so you're facing oncoming traffic.","topic":"Pre-trip preparation","id":"10-c11","chapter":10},{"front":"At what pressure should the compressor stop pumping (governor cut-out)?","back":"Between 105 and 135 p.s.i. (724 and 931 kPa).","topic":"Air brake system test","id":"10-c12","chapter":10},{"front":"How do you confirm governor cut-in pressure, and what is the minimum allowed?","back":"Pump the brake pedal down to approximately 80 per cent of maximum pressure (for example, if maximum is 125 p.s.i., pump down to 100 p.s.i.) and check that air pressure begins to build. In all cases, the governor must cause the compressor to cut in before pressure falls below 80 p.s.i. (552 kPa).","topic":"Air brake system test","id":"10-c13","chapter":10},{"front":"At what pressure must the low-air warning device(s) activate?","back":"At or above 60 p.s.i. (414 kPa).","topic":"Air brake system test","id":"10-c14","chapter":10},{"front":"At what pressure should the trailer air supply valve close?","back":"When the highest reservoir pressure gauge reads between 20 to 45 p.s.i. (138 to 310 kPa). The parking brake control valve may — or may not — also close. Then check that the trailer brakes have applied.","topic":"Air brake system test","id":"10-c15","chapter":10},{"front":"How quickly must air reservoir pressure build during the buildup test?","back":"Air pressure must build from 50 to 90 p.s.i. (345 to 620 kPa) within three minutes at a fast idle (1,000 to 1,200 r.p.m.), regardless of the type of system.","topic":"Air brake system test","id":"10-c16","chapter":10},{"front":"What are the maximum allowed air-loss rates during a full brake application (90 to 100 p.s.i., held one minute)?","back":"After the initial pressure drop: not more than 3 p.s.i. (20.7 kPa) per minute for a single-unit truck; not more than 4 p.s.i. (27.6 kPa) per minute for a tractor-trailer; not more than 6 p.s.i. (41.4 kPa) per minute with two trailers. There should also be no audible air leaks. Check that air pressure is at least 100 p.s.i. (690 kPa) before the test.","topic":"Air brake system test","id":"10-c17","chapter":10},{"front":"At what brake lining thickness may a peace officer place your vehicle out of service?","back":"If drum brake linings are less than 1/4 inch (6.4 mm) thick or air disc brake pads are less than 1/8 inch (3.2 mm) thick.","topic":"Foundation brakes","id":"10-c18","chapter":10},{"front":"How long should each class of pre-trip inspection take?","back":"Class 1 tractor-trailer: less than 45 minutes. Class 3 single-unit truck: less than 30 minutes. Class 2 bus: less than 30 minutes. Class 4 unrestricted bus: less than 20 minutes. Class 4 restricted passenger vehicle (taxi): less than 15 minutes.","topic":"Inspection classes","id":"10-c19","chapter":10},{"front":"What does the Class 4 (restricted) passenger-vehicle pre-trip inspection cover?","back":"1) Under hood (leaks, fluids including brake fluid, belts, hoses, battery, engine compartment); 2) in passenger compartment (seats/seatbelts, mirrors, windows, documentation, instrument panel, wipers/washers, heater/defroster, interior lights, four-way flashers, horn, engine noises); 3) circle check for lights, doors, exhaust, fuel cap, body, tires/wheels, licence plate and trunk (spare tire, jack, propane tank if present); 4) brake response tests including a gentle tug against the parking brake. There is no air brake system test.","topic":"Class 4 restricted inspection","id":"10-c20","chapter":10},{"front":"What must you check at a pre-hill brake check (air brake vehicle)?","back":"That the compressor maintains full reservoir pressure; there are no audible air leaks; glad hands and air lines are secure; brake drums and hubs are not overheated; and pushrod travel is within limits. You must check pushrod travel even if the vehicle has automatic slack adjusters. Also check load security. You may be fined for failing to stop for a pre-hill brake inspection.","topic":"Pre-hill inspections","id":"10-c21","chapter":10},{"front":"How do you stay aware of the braking system's condition while in service (driving)?","back":"1) Check the air pressure gauges frequently; 2) check the dashboard to see if the low-air warning indicator is on; 3) feel the braking response when you make a brake application.","topic":"In-service brake checks","id":"10-c22","chapter":10},{"front":"What are the post-trip inspection and lights/reflectors requirements?","back":"At the end of the final trip of the day you must inspect the vehicle and complete a trip inspection report noting any defects; it may be added to the pre-trip report completed for the same vehicle that day. Examine lights and reflectors every time you inspect your vehicle — check proper colour, operation, mounting and visibility. Commercial trailers 2.05 m or more in overall width must have reflective markings to the rear and sides.","topic":"Post-trip and lights","id":"10-c23","chapter":10}],"questions":[{"q":"Under the National Safety Code, when must a commercial vehicle be inspected?","choices":["Before it's used each day and at the end of the final trip of each day","Once a week and after any repair","Only before trips longer than 160 km","Every 5,000 km or once a month, whichever comes first"],"answerIndex":0,"explanation":"All commercial vehicles under the NSC must have a pre-trip inspection before use each day and a post-trip inspection at the end of the final trip of the day, as required under the Motor Vehicle Act Regulations.","topic":"NSC inspection requirements","page":200,"id":"10-q0","chapter":10},{"q":"Who may perform the required daily trip inspections, and who is responsible for ensuring they're done properly?","choices":["Only a licensed mechanic; the carrier alone is responsible","Either the driver or another person specified by the carrier; the driver and carrier share responsibility","Only the driver; the driver alone is responsible","Only a government inspector at a weigh scale"],"answerIndex":1,"explanation":"Either you or another person specified by the carrier must do the inspections, and both the driver and the carrier share the responsibility to ensure they're done properly.","topic":"Driver responsibility","page":200,"id":"10-q1","chapter":10},{"q":"A two-axle truck requires a daily written inspection report when its licensed GVW is greater than:","choices":["5,500 kg","8,200 kg","11,000 kg","14,600 kg"],"answerIndex":3,"explanation":"Daily written inspection reports are required for a two-axle truck or truck-tractor with a licensed GVW greater than 14,600 kg.","topic":"Written report requirements","page":200,"id":"10-q2","chapter":10},{"q":"A truck towing a trailer requires a daily written inspection report when the trailer's licensed GVW is greater than:","choices":["4,600 kg","8,200 kg","10,000 kg","14,600 kg"],"answerIndex":1,"explanation":"A truck or truck-tractor towing a trailer with a licensed GVW greater than 8,200 kg requires daily written inspection reports.","topic":"Written report requirements","page":200,"id":"10-q3","chapter":10},{"q":"A bus or limousine requires daily written inspection reports when its seating capacity is:","choices":["More than 10 including the driver","More than 15 excluding the driver","More than 24 including the driver","Any seating capacity — all buses require them"],"answerIndex":0,"explanation":"A bus, school bus, special activity bus, special vehicle or limousine with a seating capacity of more than 10 including the driver requires daily written inspection reports.","topic":"Written report requirements","page":200,"id":"10-q4","chapter":10},{"q":"Under the NSC, you must re-inspect the cargo securement system within what distance from the point where the cargo was loaded?","choices":["40 km","160 km","80 km","240 km"],"answerIndex":2,"explanation":"The NSC requires you to re-inspect the cargo securement system within 80 km from the point where the cargo was loaded.","topic":"Cargo securement","page":200,"id":"10-q5","chapter":10},{"q":"After the first cargo securement re-inspection, how often must you re-inspect cargo during the trip?","choices":["Only at the end of the day's trip","At the earliest of a change in duty status, three hours of driving, or 240 km of driving","At the latest of five hours of driving or 400 km","Every hour or 80 km, whichever comes first"],"answerIndex":1,"explanation":"You must re-inspect cargo securement on a regular basis at the earliest of: a change in your duty status, three hours of driving, or 240 km of driving since the last inspection, and record it on your daily log.","topic":"Cargo securement","page":200,"id":"10-q6","chapter":10},{"q":"When are you NOT required to inspect the cargo during a trip?","choices":["When the trip is shorter than 100 km","When another driver loaded the cargo","When the cargo weighs less than 500 kg","When the cargo is sealed and you've been ordered not to inspect it, or it's inaccessible"],"answerIndex":3,"explanation":"You don't need to inspect cargo if it's sealed and you've been ordered not to inspect it, or if the cargo is inaccessible.","topic":"Cargo securement","page":200,"id":"10-q7","chapter":10},{"q":"When must the daily written trip inspection report be completed?","choices":["Within one hour of starting to drive","By the end of the first trip of the day","Prior to the first trip of the day","At the first weigh scale of the day"],"answerIndex":2,"explanation":"Every written trip inspection report must be completed prior to the first trip of the day, and must include plate or unit numbers, defects (or that none were found), the date and a signature.","topic":"Written report requirements","page":201,"id":"10-q8","chapter":10},{"q":"If a trip lasts more than one day, when must new inspection reports be completed?","choices":["No later than the first rest stop of every subsequent day of the trip","Only when the vehicle crosses a provincial border","Every 24 hours from the time of the original report","Only if a defect develops"],"answerIndex":0,"explanation":"On trips lasting more than one day, new inspection reports must be completed no later than the first rest stop of every subsequent day of the trip.","topic":"Written report requirements","page":201,"id":"10-q9","chapter":10},{"q":"Two drivers sharing a vehicle disagree about which defects should be reported. What must happen on the trip inspection report?","choices":["The senior driver's opinion prevails and only they sign","The carrier decides and signs on behalf of both drivers","Neither driver signs until a mechanic resolves the disagreement","All drivers must sign and indicate the nature of the disagreement"],"answerIndex":3,"explanation":"Normally only one driver needs to sign if all agree, but if there's a disagreement over the defects to be reported, all drivers must sign and indicate the nature of the disagreement.","topic":"Written report requirements","page":201,"id":"10-q10","chapter":10},{"q":"Within how many days must trip inspection reports be given to the carrier?","choices":["7 days","20 days","30 days","90 days"],"answerIndex":1,"explanation":"All trip inspection reports must be given to the carrier within 20 days.","topic":"Written report requirements","page":201,"id":"10-q11","chapter":10},{"q":"You couple to another trailer during the day and no trip inspection report has been done for it that day. What must you do?","choices":["Note the missing report on your own vehicle's report and proceed","Proceed, as trailers only need weekly inspections","Complete a trip inspection report for that trailer","Refuse to tow the trailer until the carrier inspects it"],"answerIndex":2,"explanation":"You must obtain and carry the trip inspection report completed for that trailer that day; if one hasn't been done, you must complete one.","topic":"Written report requirements","page":201,"id":"10-q12","chapter":10},{"q":"On your road-test trip inspection report, how must you record a defect that was repaired during the pre-trip inspection?","choices":["Note the defect and include a signature certifying the defect was corrected","Leave it off the report since it's been fixed","Note it only in the remarks section without a signature","Report it verbally to the driver examiner instead"],"answerIndex":0,"explanation":"If a defect was identified and repaired during your pre-trip inspection, your report must note the defect and show a signature certifying the defect was corrected. Defects that don't affect safe operation must still be recorded, noting that immediate repair isn't required.","topic":"Road test report","page":202,"id":"10-q13","chapter":10},{"q":"In which direction should you walk when doing a circle check, and why?","choices":["Clockwise, so you finish at the driver's door","Counter-clockwise, so you're facing oncoming traffic","Either direction, as long as you alternate each day","Clockwise, so you check the curb side first"],"answerIndex":1,"explanation":"Walk counter-clockwise when you do the circle check so you're facing oncoming traffic, and be particularly cautious when your back is to traffic.","topic":"Circle check","page":203,"id":"10-q14","chapter":10},{"q":"Before beginning a pre-trip inspection on a large commercial vehicle, you should:","choices":["Leave the engine idling so air pressure stays up","Park on a slope so leaks are easier to spot","Set the parking brakes, shut off the engine and block the wheels","Release all brakes so you can check slack adjusters"],"answerIndex":2,"explanation":"Park in a safe location away from traffic (level ground if possible), set the parking brakes, shut off the engine, and block the wheels securely with a block in front of and behind a tire on the same axle.","topic":"Pre-trip preparation","page":203,"id":"10-q15","chapter":10},{"q":"In what time should you be able to complete a Class 1 tractor-trailer pre-trip inspection?","choices":["Less than 20 minutes","Less than 30 minutes","Less than 60 minutes","Less than 45 minutes"],"answerIndex":3,"explanation":"You should be able to complete the Class 1 tractor-trailer combination pre-trip inspection in less than 45 minutes. The Class 3 and Class 2 inspections should take less than 30 minutes.","topic":"Inspection classes","page":204,"id":"10-q16","chapter":10},{"q":"During your road test, which air reservoir are you required to drain?","choices":["The primary reservoir","The supply reservoir","The secondary reservoir","All reservoirs must be drained during the test"],"answerIndex":1,"explanation":"For your road test you're only required to drain the supply reservoir, although all reservoirs should be drained daily.","topic":"Under hood","page":205,"id":"10-q17","chapter":10},{"q":"After draining only the supply reservoir, other reservoirs have also lost pressure. What may this indicate?","choices":["A one-way check valve is not functioning","The governor cut-out pressure is set too high","Normal operation — reservoirs share air equally","The low-air warning device is defective"],"answerIndex":0,"explanation":"Check the gauges to confirm that only the supply reservoir air was drained; if other reservoirs have lost pressure, this may indicate that a one-way check valve is not functioning.","topic":"Air brake system test","page":207,"id":"10-q18","chapter":10},{"q":"The compressor should stop pumping (governor cut-out) when air pressure is between:","choices":["85 and 95 p.s.i.","90 and 100 p.s.i.","105 and 135 p.s.i.","125 and 150 p.s.i."],"answerIndex":2,"explanation":"Check that the compressor stops pumping between 105 and 135 p.s.i. (724 and 931 kPa).","topic":"Air brake system test","page":208,"id":"10-q19","chapter":10},{"q":"In all cases, the governor must cause the compressor to cut in before air pressure falls below:","choices":["60 p.s.i. (414 kPa)","100 p.s.i. (690 kPa)","50 p.s.i. (345 kPa)","80 p.s.i. (552 kPa)"],"answerIndex":3,"explanation":"Pump down to about 80 per cent of maximum pressure and check that pressure begins to build; the governor must cause the compressor to cut in before pressure falls below 80 p.s.i. (552 kPa).","topic":"Air brake system test","page":208,"id":"10-q20","chapter":10},{"q":"The low-air warning device(s) must activate at or above:","choices":["60 p.s.i. (414 kPa)","45 p.s.i. (310 kPa)","80 p.s.i. (552 kPa)","20 p.s.i. (138 kPa)"],"answerIndex":0,"explanation":"As you pump the pressure down, the low-air warning device(s) must activate at or above 60 p.s.i. (414 kPa).","topic":"Air brake system test","page":208,"id":"10-q21","chapter":10},{"q":"During the air brake system test, the trailer air supply valve should close when the highest reservoir pressure gauge reads between:","choices":["50 to 60 p.s.i.","20 to 45 p.s.i. (138 to 310 kPa)","60 to 80 p.s.i.","5 to 15 p.s.i."],"answerIndex":1,"explanation":"The trailer air supply valve should close between 20 to 45 p.s.i. (138 to 310 kPa); the parking brake control valve may or may not also close. Then check that the trailer brakes have applied.","topic":"Air brake system test","page":208,"id":"10-q22","chapter":10},{"q":"During the buildup test, air reservoir pressure must build from 50 to 90 p.s.i. within:","choices":["One minute at idle","Five minutes at highway r.p.m.","Three minutes at a fast idle (1,000 to 1,200 r.p.m.)","Ten minutes at a fast idle"],"answerIndex":2,"explanation":"Regardless of the type of system, air pressure must build from 50 to 90 p.s.i. (345 to 620 kPa) within three minutes at a fast idle (1,000 to 1,200 r.p.m.).","topic":"Air brake system test","page":208,"id":"10-q23","chapter":10},{"q":"After disconnecting the supply and control line glad hands during the Class 1 air brake test, what should you check?","choices":["That the trailer brakes release automatically","That air escapes steadily from the tractor side only","That the tractor protection valve opens fully","That no air escapes from either the tractor or the trailer through the glad hands, including during a foot brake application"],"answerIndex":3,"explanation":"With the glad hands disconnected, check that no air escapes from either the tractor or the trailer, then make a foot brake application and listen to ensure no air escapes through the supply or control line.","topic":"Air brake system test","page":208,"id":"10-q24","chapter":10},{"q":"For a tractor-trailer with one trailer, after a full brake application (90 to 100 p.s.i.) held for one minute, air loss must not be more than:","choices":["4 p.s.i. (27.6 kPa) per minute","3 p.s.i. (20.7 kPa) per minute","6 p.s.i. (41.4 kPa) per minute","10 p.s.i. per minute"],"answerIndex":0,"explanation":"After the initial pressure drop, air loss must not be more than 4 p.s.i. (27.6 kPa) per minute for a tractor-trailer, and there should be no audible air leaks.","topic":"Air loss rates","page":213,"id":"10-q25","chapter":10},{"q":"For a combination with two trailers, the maximum allowed air loss during a full brake application is:","choices":["3 p.s.i. per minute","6 p.s.i. (41.4 kPa) per minute","4 p.s.i. per minute","8 p.s.i. per minute"],"answerIndex":1,"explanation":"With two trailers, air loss after the initial pressure drop must not be more than 6 p.s.i. (41.4 kPa) per minute.","topic":"Air loss rates","page":213,"id":"10-q26","chapter":10},{"q":"For a Class 3 single-unit truck, the maximum allowed air loss during a full brake application held for one minute is:","choices":["6 p.s.i. per minute","4 p.s.i. per minute","3 p.s.i. (20.7 kPa) per minute","1 p.s.i. per minute"],"answerIndex":2,"explanation":"For a single-unit truck, after the initial pressure drop, air loss must not be more than 3 p.s.i. (20.7 kPa) per minute, with no audible air leaks.","topic":"Air loss rates","page":221,"id":"10-q27","chapter":10},{"q":"Before making the full brake application for the air-loss test, you should check that air pressure is at least:","choices":["60 p.s.i. (414 kPa)","80 p.s.i. (552 kPa)","90 p.s.i. (620 kPa)","100 p.s.i. (690 kPa)"],"answerIndex":3,"explanation":"Return to the cab and check that air pressure is at least 100 p.s.i. (690 kPa) and the parking brakes are released, then make a full brake application (90 to 100 p.s.i.) and hold it for one minute.","topic":"Air brake system test","page":213,"id":"10-q28","chapter":10},{"q":"A peace officer may place your vehicle out of service if drum brake linings are less than:","choices":["1/4 inch (6.4 mm) thick","1/8 inch (3.2 mm) thick","1/2 inch (12.7 mm) thick","1/16 inch (1.6 mm) thick"],"answerIndex":0,"explanation":"A vehicle may be placed out of service if drum brake linings are less than 1/4 inch (6.4 mm) thick or air disc brake pads are less than 1/8 inch (3.2 mm) thick.","topic":"Foundation brakes","page":206,"id":"10-q29","chapter":10},{"q":"What is the purpose of the tug test during a pre-trip inspection?","choices":["To measure pushrod travel under load","To check that the parking brakes will prevent the vehicle from moving when you gently tug against them in low gear","To verify the fifth wheel slider can move freely","To warm the brake linings before driving"],"answerIndex":1,"explanation":"In low gear, you gently tug against the trailer parking brakes and then the tractor parking brakes; in each case the brakes should prevent the combination from moving.","topic":"Tug test","page":213,"id":"10-q30","chapter":10},{"q":"In what time should you be able to complete a Class 4 restricted (taxi) pre-trip inspection?","choices":["Less than 30 minutes","Less than 45 minutes","Less than 20 minutes","Less than 15 minutes"],"answerIndex":3,"explanation":"The Class 4 restricted passenger-vehicle pre-trip inspection should take less than 15 minutes; a Class 4 unrestricted bus inspection should take less than 20 minutes.","topic":"Class 4 restricted inspection","page":229,"id":"10-q31","chapter":10},{"q":"Which of these is part of the Class 4 restricted passenger-vehicle pre-trip inspection?","choices":["An air brake system test","Draining the supply reservoir","Checking the trunk for the spare tire and jack, and that any propane tank is secure and not leaking","A tug test against the trailer parking brakes"],"answerIndex":2,"explanation":"The Class 4 restricted inspection covers under hood, the passenger compartment, a circle check (including the trunk — spare tire, jack, and any propane tank secure and not leaking) and brake response tests; it has no air brake system test.","topic":"Class 4 restricted inspection","page":232,"id":"10-q32","chapter":10},{"q":"During the bus (Class 2/4 unrestricted) passenger compartment check, what should you do at the emergency exits?","choices":["Ensure they're secure, and open them where feasible to check that the emergency alarm sounds","Seal them shut so passengers can't open them","Only check them from outside the bus","Remove the alarm fuse to prevent false alarms"],"answerIndex":0,"explanation":"Ensure emergency exits are secure and open them (where feasible) to ensure the emergency alarm sounds; also check that the rear emergency exit door opens and closes from the outside.","topic":"Bus inspection","page":228,"id":"10-q33","chapter":10},{"q":"A sign ahead of a steep downgrade directs commercial vehicles into a brake-check pullout. What must you do?","choices":["Slow down and continue if your brakes feel normal","Stop only if your vehicle is loaded","Stop only if you haven't checked your brakes in the last three hours","Stop in the pullout area and inspect the braking system (and load security) before proceeding"],"answerIndex":3,"explanation":"You must stop the vehicle in the pullout area and inspect the braking system before proceeding, checking load security at the same time. You may be fined for failing to stop for a pre-hill brake inspection.","topic":"Pre-hill inspections","page":232,"id":"10-q34","chapter":10},{"q":"At a pre-hill inspection, must you check pushrod travel if your vehicle has automatic slack adjusters?","choices":["No — automatic slack adjusters keep travel within limits","Yes — you must check pushrod travel even with automatic slack adjusters","Only if the low-air warning has activated","Only on vehicles with more than three axles"],"answerIndex":1,"explanation":"At a pre-hill inspection check that the compressor maintains full reservoir pressure, no audible air leaks, glad hands and air lines are secure, drums and hubs aren't overheated, and pushrod travel is within limits — even if the vehicle is equipped with automatic slack adjusters.","topic":"Pre-hill inspections","page":233,"id":"10-q35","chapter":10},{"q":"If your vehicle has hydraulic brakes, what should you check before starting down a hill?","choices":["Governor cut-in and cut-out pressures","That the spring brakes have popped out","Adequate pedal reserve, brake drums not overheated, and no hydraulic fluid leaks","That the trailer air supply valve is closed"],"answerIndex":2,"explanation":"With hydraulic brakes, check before descending that there's adequate pedal reserve, brake drums aren't overheated, and there are no hydraulic fluid leaks.","topic":"Pre-hill inspections","page":233,"id":"10-q36","chapter":10},{"q":"How can you monitor the condition of your braking system while driving (in-service)?","choices":["Check air pressure gauges frequently, watch for the low-air warning indicator, and feel the braking response on brake applications","Pump the brakes hard every 15 minutes","Listen for the governor cutting in at highway speed","Pull the trailer supply valve briefly at each stop"],"answerIndex":0,"explanation":"Stay aware of the braking system at all times by checking the air pressure gauges frequently, checking the dashboard low-air warning indicator, and feeling the braking response when you apply the brakes.","topic":"In-service brake checks","page":233,"id":"10-q37","chapter":10},{"q":"During an en route inspection stop, you notice smoke coming from an oil-filled hub. What should you do?","choices":["Continue at reduced speed to the next repair facility","Pour water on the hub to cool it and continue","Continue only if the hub is cool enough to touch by the time you leave","Don't continue driving the vehicle"],"answerIndex":3,"explanation":"Don't continue driving a vehicle if there's smoke coming from an oil-filled hub, or where the hub is too hot to touch.","topic":"En route inspections","page":234,"id":"10-q38","chapter":10},{"q":"What is required at the end of the final trip of the day?","choices":["Refuelling the vehicle and draining all reservoirs only","A post-trip inspection and a trip inspection report noting any defects found","A full Class 1 pre-trip inspection including the air brake system test","Nothing, if the morning's pre-trip found no defects"],"answerIndex":1,"explanation":"At the end of the final trip of the day you must inspect the vehicle and complete a trip inspection report noting any defects; it may be added to the pre-trip inspection report completed for the same vehicle earlier that day.","topic":"Post-trip inspections","page":234,"id":"10-q39","chapter":10},{"q":"What should you check about lights and reflectors every time you inspect your vehicle?","choices":["Only that the headlights and brake lights work","Only that the lenses are the correct colour","Proper colour, operation, mounting and visibility","Only lights required for night driving"],"answerIndex":2,"explanation":"Examine lights and reflectors at every inspection to ensure they're in good condition — check for proper colour, operation, mounting and visibility, per the Motor Vehicle Act Regulations.","topic":"Lights and reflectors","page":234,"id":"10-q40","chapter":10},{"q":"Commercial trailers must have reflective markings to the rear and sides when their overall width is:","choices":["2.05 m or more","1.8 m or more","2.6 m or more","3.0 m or more"],"answerIndex":0,"explanation":"Commercial trailers with an overall width of 2.05 m or more are required to have reflective markings to the rear and sides, which help improve the visibility of large commercial vehicles.","topic":"Lights and reflectors","page":235,"id":"10-q41","chapter":10}]},"11":{"title":"signs, signals and road markings","cards":[{"front":"What are the three ways to read a road sign?","back":"By its shape, its colour and the message printed on it. Understanding these three ways of classifying signs helps you figure out the meaning of signs that are new to you.","topic":"Reading signs","id":"11-c0","chapter":11},{"front":"What are regulatory signs, and what happens if you disregard one?","back":"Regulatory signs tell you about driving laws and regulations. It is an offence under the B.C. Motor Vehicle Act to disregard them, and drivers who don't follow their instructions may receive penalties. Examples include stop, yield, speed limit, do not enter, one way, keep right, no stopping and no-passing signs.","topic":"Regulatory signs","id":"11-c1","chapter":11},{"front":"What do a stop sign and a yield sign require you to do?","back":"Stop sign (a red octagon): stop completely and continue only when safe. Yield sign (a downward-pointing triangle): give the right-of-way to other vehicles and crossing pedestrians.","topic":"Regulatory signs","id":"11-c2","chapter":11},{"front":"What does a posted speed limit sign mean?","back":"It shows the maximum legal speed when the road is bare and dry and visibility is good. A separate sign can indicate that a lower speed limit is ahead.","topic":"Regulatory signs","id":"11-c3","chapter":11},{"front":"What colour are school zone signs, and when is a school zone speed tab in effect?","back":"School zone signs are fluorescent yellow-green. If the tab underneath only indicates the speed limit, that limit is in effect from 8 a.m. to 5 p.m. on school days. The tab may also state its own hours (for example, a 30 km/h limit in effect 8 a.m. to 5 p.m. on school days).","topic":"School and playground","id":"11-c4","chapter":11},{"front":"When is a playground zone speed limit in effect?","back":"A playground zone's 30 km/h limit is in effect every day from dawn to dusk. A separate 'playground nearby' warning sign means be prepared to slow down.","topic":"School and playground","id":"11-c5","chapter":11},{"front":"Where are lane use signs mounted, and what must you do in a designated lane?","back":"Lane use signs are mounted above the lane, or at the side of the lane before the intersection. If you're in a designated lane you must follow the direction indicated by the arrows, and you may not move into or out of a designated lane while you are in an intersection.","topic":"Lane use signs","id":"11-c6","chapter":11},{"front":"What is the difference between a lane use sign and a turn control sign?","back":"Lane use signs are mounted above or beside the lane before the intersection and show which lanes may be used to turn or go straight. Turn control signs are mounted directly above the intersection, and you must follow the direction of the arrow.","topic":"Turn control signs","id":"11-c7","chapter":11},{"front":"How are reserved lanes marked?","back":"A white diamond painted on the road surface marks reserved lanes, with thick solid or broken lines. Reserved lane signs are also placed over or beside lanes reserved for certain vehicles such as buses or high occupancy vehicles (HOVs); other HOV signs may state how many people must be in the vehicle.","topic":"Reserved lanes","id":"11-c8","chapter":11},{"front":"What shape and colour are most warning signs, and what are object markers?","back":"Most warning signs are yellow and diamond-shaped — they warn of possible hazards ahead (curves, steep hills, merging traffic, slippery road, etc.). Object markers are mounted on obstructions and tell you to keep right, keep left, or keep right or left.","topic":"Warning signs","id":"11-c9","chapter":11},{"front":"What do the three lane control signals mean?","back":"Green arrow: drive in this lane. Red X: do not drive in this lane. Yellow X: move out of this lane and into a lane with a green arrow — but if the lane control signals over all of the lanes are flashing yellow, slow down and proceed with caution.","topic":"Lane control signals","id":"11-c10","chapter":11},{"front":"What do flashing red, flashing yellow and flashing green traffic lights mean?","back":"Flashing red: stop, then continue only when it is safe. Flashing yellow: slow down and proceed with caution. Flashing green: a pedestrian-controlled light — go only if the intersection is clear.","topic":"Traffic lights","id":"11-c11","chapter":11},{"front":"What can you do at a steady red light? At a flashing green arrow with a steady red light?","back":"Steady red: stop — after coming to a full stop you may turn right, or turn left onto a one-way street, unless a sign forbids it. Flashing green arrow with steady red: a left turn is allowed, but through traffic must stop for the red light.","topic":"Traffic lights","id":"11-c12","chapter":11},{"front":"What do yellow lines and white lines on the road each separate?","back":"Yellow lines divide traffic moving in opposite directions — if there's a yellow line to your left, oncoming traffic is on the other side of it. White lines separate lanes of traffic moving in the same direction, and also mark crosswalks, stopping positions and the right shoulders of highways.","topic":"Road markings","id":"11-c13","chapter":11},{"front":"What do the different yellow line patterns allow?","back":"Broken line: passing is allowed when safe. Single yellow line: passing is allowed with extra caution. Broken line beside a solid line: you may pass only when it's safe and the broken line is on your side. Double solid line: no passing allowed. Double broken yellow line: the lane is reversible — a lane control signal shows whether you may use it.","topic":"Road markings","id":"11-c14","chapter":11},{"front":"What is a two-way left-turn lane and a painted island?","back":"A two-way left-turn lane is shared by drivers travelling in opposite directions for left turns (the markings may be reversed — solid lines inside the broken lines). A painted island must be kept to your right — do not drive on or over it.","topic":"Road markings","id":"11-c15","chapter":11}],"questions":[{"q":"Disregarding a regulatory sign, such as a stop or speed limit sign, is:","choices":["An offence under the B.C. Motor Vehicle Act that may bring penalties","Only a problem if a crash results","A matter left to each municipality's discretion","Legal for commercial vehicles with a permit"],"answerIndex":0,"explanation":"Regulatory signs tell you about driving laws and regulations, and it is an offence under the B.C. Motor Vehicle Act to disregard them.","topic":"Regulatory signs","page":238,"id":"11-q0","chapter":11},{"q":"A posted maximum speed limit sign applies when:","choices":["Traffic is light, regardless of weather","The road is bare and dry and visibility is good","You are driving downhill","It is raining or snowing"],"answerIndex":1,"explanation":"The speed limit sign shows the maximum legal speed when the road is bare and dry and visibility is good — in poorer conditions you should drive slower.","topic":"Regulatory signs","page":238,"id":"11-q1","chapter":11},{"q":"An eight-sided red sign requires you to:","choices":["Slow down and yield to traffic on your left","Sound your horn before proceeding","Stop completely and continue only when safe","Stop only if other vehicles are approaching"],"answerIndex":2,"explanation":"A stop sign means stop completely — continue only when safe. A yield sign, by contrast, means give the right-of-way to other vehicles and crossing pedestrians.","topic":"Regulatory signs","page":238,"id":"11-q2","chapter":11},{"q":"A rectangular regulatory sign showing a snowflake and tire symbols means:","choices":["Slippery road ahead","Snow plows may be working ahead","Chains are never required on this route","Winter tires or chains must be used when the sign is displayed"],"answerIndex":3,"explanation":"This regulatory sign means winter tires or chains must be used when the sign is displayed.","topic":"Regulatory signs","page":238,"id":"11-q3","chapter":11},{"q":"School zone signs are what colour?","choices":["Fluorescent yellow-green","Orange","Blue and white","Red and white"],"answerIndex":0,"explanation":"School zone signs (and the school crosswalk ahead warning sign) are fluorescent yellow-green.","topic":"School and playground","page":237,"id":"11-q4","chapter":11},{"q":"A school zone sign has a tab underneath showing only a speed limit. When is that limit in effect?","choices":["24 hours a day, every day","From 8 a.m. to 5 p.m. on school days","From dawn to dusk every day","Only when children are visible"],"answerIndex":1,"explanation":"If the tab under a school zone sign only indicates the speed limit, that limit is in effect from 8 a.m. to 5 p.m. on school days.","topic":"School and playground","page":239,"id":"11-q5","chapter":11},{"q":"When is a playground zone's 30 km/h speed limit in effect?","choices":["From 8 a.m. to 5 p.m. on school days","Only on weekends and holidays","Every day from dawn to dusk","Only when the playground is occupied"],"answerIndex":2,"explanation":"A playground zone's 30 km/h limit is in effect every day from dawn to dusk — unlike a school zone tab, which applies from 8 a.m. to 5 p.m. on school days.","topic":"School and playground","page":239,"id":"11-q6","chapter":11},{"q":"You are driving in a lane marked by a lane use sign. While in the intersection, you may:","choices":["Move out of the designated lane if you signal first","Change lanes if no vehicle is beside you","Move into a designated lane to turn","Not move into or out of the designated lane"],"answerIndex":3,"explanation":"If you're in a designated lane you must follow the direction indicated by the arrows, and you may not move into or out of a designated lane while you are in an intersection.","topic":"Lane use signs","page":239,"id":"11-q7","chapter":11},{"q":"Where are turn control signs mounted?","choices":["Directly above the intersection","At the side of the road well before the intersection","On the far curb beyond the intersection","On the pavement surface"],"answerIndex":0,"explanation":"Turn control signs are mounted directly above the intersection and you must follow the direction of the arrow. Lane use signs, by contrast, are mounted above or beside the lane before the intersection.","topic":"Turn control signs","page":240,"id":"11-q8","chapter":11},{"q":"A lane reserved for certain vehicles such as buses or HOVs is marked on the road surface with:","choices":["A yellow zigzag line","A white diamond","A red square","Double solid white lines only"],"answerIndex":1,"explanation":"A white diamond painted on the road surface marks reserved lanes; HOV lanes are marked with thick solid or broken lines and white diamond symbols, and signs state which vehicles may use the lane.","topic":"Reserved lanes","page":240,"id":"11-q9","chapter":11},{"q":"Most warning signs, which alert you to possible hazards ahead, are:","choices":["Green and rectangular","Red and octagonal","Yellow and diamond-shaped","Blue and square"],"answerIndex":2,"explanation":"Most warning signs are yellow and diamond-shaped. They warn of possible hazards ahead such as curves, merging traffic, steep hills and slippery roads.","topic":"Warning signs","page":241,"id":"11-q10","chapter":11},{"q":"A yellow diamond-shaped sign showing a truck on a sloped ramp means:","choices":["Truck parking area ahead","Trucks must use the left lane","Weigh scale ahead","Steep hill ahead — slow down"],"answerIndex":3,"explanation":"This warning sign means a steep hill is ahead and you should slow down — especially important for heavy commercial vehicles.","topic":"Warning signs","page":241,"id":"11-q11","chapter":11},{"q":"Object markers with striped panels are mounted on:","choices":["Obstructions, showing you to keep right or left","School buses","Slow-moving vehicles","Railway crossing gates only"],"answerIndex":0,"explanation":"Object markers are mounted on obstructions — pay special attention to them. Depending on the marker, keep right, keep left, or keep right or left.","topic":"Object markers","page":242,"id":"11-q12","chapter":11},{"q":"In a construction zone you must:","choices":["Pass equipment closely so traffic keeps moving","Obey traffic-control persons, travel within the posted speed, stay well back from equipment and pass only when safe","Follow normal highway speed limits at all times","Ignore the signs when no workers are visible"],"answerIndex":1,"explanation":"Construction signs warn of construction and maintenance work. You must obey traffic-control persons, travel within the posted speed, stay well back from all equipment and pass only when it is safe.","topic":"Construction signs","page":243,"id":"11-q13","chapter":11},{"q":"At a railway crossing with a lowered gate, you must stay stopped until:","choices":["The train has passed the crossing","The lights stop flashing, even if the gate is still moving","The gate is fully raised","Ten seconds have passed"],"answerIndex":2,"explanation":"At a railway crossing you must stay stopped until the gate is fully raised. Remember, you must always yield to trains.","topic":"Railway signs","page":244,"id":"11-q14","chapter":11},{"q":"A yellow X lane control signal is displayed over your lane, and the signals over all lanes are flashing yellow. You should:","choices":["Stop immediately in your lane","Speed up to clear the lane","Treat it the same as a red X","Slow down and proceed with caution"],"answerIndex":3,"explanation":"A yellow X means move into a lane with a green arrow — but when the lane control signals over all of the lanes are flashing yellow, slow down and proceed with caution. A red X means do not drive in that lane.","topic":"Lane control signals","page":244,"id":"11-q15","chapter":11},{"q":"After coming to a full stop at a steady red light, you may:","choices":["Turn right, or turn left onto a one-way street, unless a sign forbids it","Proceed straight through if the intersection is clear","Turn left onto a two-way street","Not turn in any direction until the light turns green"],"answerIndex":0,"explanation":"At a steady red light you must stop; after a full stop you may turn right or turn left onto a one-way street unless a sign forbids it.","topic":"Traffic lights","page":245,"id":"11-q16","chapter":11},{"q":"What does a flashing green light at an intersection mean?","choices":["An advance left turn is coming","It is a pedestrian-controlled light — go only if the intersection is clear","The light is about to turn yellow","Buses only may proceed"],"answerIndex":1,"explanation":"A flashing green light is a pedestrian-controlled light — go only if the intersection is clear. A flashing red means stop and continue only when safe; a flashing yellow means slow down and proceed with caution.","topic":"Traffic lights","page":245,"id":"11-q17","chapter":11},{"q":"You face a flashing green arrow together with a steady red light. What is permitted?","choices":["All traffic may proceed with caution","Nothing — all traffic must remain stopped","A left turn is allowed; through traffic must stop for the red light","Right turns only"],"answerIndex":2,"explanation":"A flashing green arrow with a steady red light allows the left turn shown by the arrow, while through traffic must stop for the red light.","topic":"Traffic lights","page":245,"id":"11-q18","chapter":11},{"q":"A steady white rectangular light at an intersection signal means:","choices":["All vehicles may proceed straight through","The signal is out of order — treat as a four-way stop","Pedestrians only may cross","It is a transit priority signal — only buses may go on this signal"],"answerIndex":3,"explanation":"The steady white rectangular light is a transit priority signal — only buses may go on this signal.","topic":"Traffic lights","page":245,"id":"11-q19","chapter":11},{"q":"What colour are the lines that divide traffic moving in opposite directions?","choices":["Yellow","White","Orange","Red"],"answerIndex":0,"explanation":"Yellow lines divide traffic moving in opposite directions — if there's a yellow line to your left, oncoming traffic is on the other side of it. White lines separate lanes moving in the same direction.","topic":"Road markings","page":246,"id":"11-q20","chapter":11},{"q":"The centre of the road is marked with a broken yellow line beside a solid yellow line. You may pass:","choices":["Never, in either direction","Only when it is safe and the broken line is on your side","Whenever the solid line is on your side","Only between dawn and dusk"],"answerIndex":1,"explanation":"With a broken line and a solid line, you may pass only when it is safe and the broken line is on your side. A double solid yellow line means no passing is allowed.","topic":"Road markings","page":246,"id":"11-q21","chapter":11},{"q":"A lane marked on both sides by double broken yellow lines is:","choices":["A bus-only lane","A painted island — do not drive on it","A reversible lane — a lane control signal shows whether you may use it","A two-way left-turn lane"],"answerIndex":2,"explanation":"A double broken yellow line marks a reversible lane; the lane control signal will show whether you may use the lane. A two-way left-turn lane is shared by opposite directions for left turns.","topic":"Road markings","page":246,"id":"11-q22","chapter":11},{"q":"A solid white line between lanes of traffic travelling in the same direction means:","choices":["Lane changing is encouraged","The lane is reserved for HOVs","The lane ends ahead","Do not change lanes"],"answerIndex":3,"explanation":"A solid white line means do not change lanes; a broken white line means lane changing is allowed when safe.","topic":"Road markings","page":247,"id":"11-q23","chapter":11},{"q":"In a bicycle lane, marked with an outline of a bicycle, cyclists must:","choices":["Travel in the same direction as the traffic beside them","Ride facing oncoming traffic","Yield to vehicles entering the lane","Dismount at every intersection"],"answerIndex":0,"explanation":"A bicycle lane is for cyclists only, and cyclists must travel in the same direction as the traffic beside them. The lane is marked with an outline of a bicycle and sometimes with a diamond.","topic":"Reserved lanes","page":248,"id":"11-q24","chapter":11},{"q":"When you approach a painted island on the roadway, you must:","choices":["Drive over it only when turning left","Keep to the right and not drive on or over it","Stop before it and yield","Use it as a passing lane when clear"],"answerIndex":1,"explanation":"Keep to the right of a painted island and do not drive on or over it. Also note it is illegal to drive over freshly painted, wet pavement markings.","topic":"Road markings","page":248,"id":"11-q25","chapter":11}]}},"extras":{"examinersTips":{"general":["Make sure that the vehicle you're using can pass a safety inspection. Check that all the lights work (particularly trailer brake lights and turn signals), and that the air brake system is in good condition. Bring appropriate tools.","Know your vehicle: practise the pre-trip inspection. Make sure you can find all the items you'll be inspecting as part of the pre-trip. Have someone watch you conduct the pre-trip inspection and tick off the items you're checking, to make sure you complete everything and can explain what you're doing.","Make sure you're familiar with driving the vehicle you are using for your road test, particularly its handling and turning characteristics and gearshift operation. As part of the road test, you'll be assessed on your ability to shift gears smoothly.","Drive posted speed limits. Don't keep up to speeding traffic. Watch for school zones and playgrounds.","Make full stops for stop signs, and stop in the correct position. When it's safe to move out, pull out slowly, scanning the intersection.","Use the correct traffic lane. Make proper turns as described in this guide.","Mirror check and, if possible, shoulder check whenever you change lanes or direction.","Keep a safe distance from other vehicles.","Scan intersections before driving through, even if the light is green when you approach.","Observe when backing up.","Be familiar with commercial vehicle procedures for crossing railway tracks."],"class1":[],"class2":[],"class3":[],"class4":[]},"knowledgeTestFacts":["You need to take knowledge tests whenever you apply for a new licence.","All knowledge tests referred to in this guide are conducted only in English. You must be able to complete these tests without assistance.","The licensing process to obtain a Class 1, 2, 3 or 4 driver's licence, a heavy trailer endorsement, house trailer endorsement or an air brake endorsement is conducted entirely in English. You must be able to communicate in both spoken and written English without assistance.","The knowledge tests are all multiple choice.","The answers to all the knowledge test questions are in this guide.","One of the knowledge tests is a traffic signs test. To prepare, review the signs shown in chapter 11 (signs, signals and road markings) as well as the signs shown in other chapters of the guide.","If you do not qualify on the knowledge test you will need to wait seven days before another attempt can be made.","For road tests, the re-test waiting period is 14 days after a first attempt, 30 days after a second attempt, and 60 days for any subsequent attempts.","A Class 1 road test takes about two hours. Class 2, 3, 4 and heavy trailer endorsement road tests take less than two hours.","All road tests consist of a pre-trip inspection, an air brake pre-trip inspection (if your vehicle is equipped with air brakes), and a road test.","Plan to arrive at the office at least 15 minutes early. You'll have to pay a fee if you don't show up for your scheduled road test and don't provide either 48 hours notice or a valid reason for not attending.","Knowledge and road test fees vary depending on which tests you will be taking; the fees are listed at icbc.com.","An applicant who fails to qualify on the air brake knowledge test after three attempts must complete or repeat an approved 7-hour air brake training course.","The air brake knowledge test results are only valid for one year. Drivers who haven't had the air brake endorsement placed on their driver's licence within one year of passing the air brake knowledge test will need to re-take it.","Every time you go to a driver licensing office, you'll need to take one piece of primary ID and one piece of secondary ID. Photocopies are not accepted (except a photocopy certified as a true copy by the government agency that issued it).","If you hold a higher class out-of-province licence, some tests may be waived; contact your nearest driver licensing office for details."]},"lessons":{"1":{"chapter":1,"title":"getting your driver's licence","objectives":["List B.C.'s driver licence classes and identify which vehicles each class lets you drive","Identify which vehicles require an air brake endorsed driver's licence","Describe the steps to get a commercial driver's licence, an air brake endorsement or a heavy trailer endorsement","State the prerequisites (age, driving record, medical) for applying for a Class 1, 2, 3 or 4 licence","Explain what happens during the road test, including the pre-trip inspection"],"sections":[{"title":"Licence classes and what each allows","points":["Class 1 covers semi-trailer trucks and all other vehicles or combinations except motorcycles.","Class 2 covers buses, including school buses; trailers over 4,600 kg allowed only if bus and trailers have no air brakes.","Class 3 covers trucks with more than two axles, like dump trucks, plus tow cars and mobile truck cranes.","Class 4 unrestricted covers buses up to 25 persons including driver, taxis, limousines, ride-hailing vehicles and ambulances.","Class 4 restricted covers taxis, limousines, ride-hailing and special vehicles up to 10 persons including the driver.","Heavy trailer endorsement (code 20) allows trailers over 4,600 kg if neither truck nor trailer has air brakes.","You must hold a full-privilege Class 5 or equivalent before applying for a commercial licence or trailer endorsement."],"mustKnow":["Minimum age: 19 for Class 1, 2 and 4; 18 for Class 3 and heavy/house trailer endorsements","Class 2 and 3 trailer limit: trailers or towed vehicles may not exceed 4,600 kg (may exceed only if no air brakes)","Class 4 unrestricted bus limit: maximum seating capacity of 25 persons (including the driver)","Class 4 restricted: up to 10 persons including the driver","House trailer endorsement is code 07 (formerly code 51); heavy trailer endorsement is code 20"],"check":[{"q":"What is the minimum age to apply for a Class 3 licence?","choices":["16","18","19","21"],"answerIndex":1,"explanation":"Class 3 has a minimum age of 18, while Classes 1, 2 and 4 require age 19."},{"q":"A Class 4 unrestricted licence lets you drive a bus with a maximum seating capacity of how many persons, including the driver?","choices":["10","16","25","36"],"answerIndex":2,"explanation":"Class 4 unrestricted covers buses with a maximum seating capacity of 25 persons including the driver."}]},{"title":"Medical fitness, vision and keeping your licence","points":["Commercial applicants must declare medical conditions and have a doctor complete a Driver's Medical Examination form for RoadSafetyBC.","Commercial drivers must meet a higher vision standard than Class 5 drivers; vision is screened at a driver licensing office.","Vision checks cover visual acuity, peripheral vision, depth perception, double vision and colour perception (red, green, amber).","If you need glasses or contact lenses to meet the standard, you must wear them during vision screening.","RoadSafetyBC requires regular medical exams as long as you hold a commercial licence; missing the form can cancel your licence.","RoadSafetyBC can also require re-examination: vision screening, knowledge test, or a road test with pre-trip inspection."],"mustKnow":["Routine medical reports are due at ages 25, 30, 35, 40 and 45; then 48, 51, 54, 57, 60 and 63; then every year from age 66","The doctor's fee for the routine medical form is not covered by MSP of B.C., ICBC or RoadSafetyBC","Colour perception test: ability to distinguish red, green and amber"],"check":[{"q":"From what age must commercial drivers submit a Driver's Medical Examination Report every year?","choices":["60","63","65","66"],"answerIndex":3,"explanation":"The manual states the medical form is required every year upon reaching the age of 66."},{"q":"Who pays the doctor's fee for completing the routine medical form?","choices":["ICBC","The Medical Services Plan of B.C.","The driver","RoadSafetyBC"],"answerIndex":2,"explanation":"The fee is not covered by MSP, ICBC or RoadSafetyBC, so the driver pays it."}]},{"title":"Air brake endorsement, heavy trailer endorsement and MELT","points":["Operating air brake vehicles on a highway (except construction vehicles) requires an air brake endorsement (code 15).","The endorsement is also required for most vehicles with air-over-hydraulic brakes; code 15 appears under licence restrictions.","To get code 15: complete an air brake course, pass the knowledge test, then pass an air brake pre-trip inspection test — no road test.","A certified air brake course adds 4 hours of practical pre-trip training and may exempt you from ICBC's pre-trip test.","All new Class 1 applicants must take MELT; air brake training is included, so no separate course is needed for Class 1.","MELT is a one-time requirement; Class 3 or 2 applicants instead need air brake experience or a course before the road test.","Drivers with a licence issued outside Canada must take B.C.'s MELT; some Canadian experience can waive it."],"mustKnow":["Air brake courses are a minimum of 7 hours in length","Air brake knowledge test results are only valid for one year","Failing the air brake knowledge test after three attempts means completing or repeating an approved 7-hour course","MELT became a requirement for all new Class 1 applicants on October 18, 2021","MELT waived with more than 24 consecutive months of Canadian Class 1 experience (licence not expired more than three years)"],"check":[{"q":"How long are air brake knowledge test results valid?","choices":["Six months","One year","Two years","Three years"],"answerIndex":1,"explanation":"If the endorsement isn't placed on your licence within one year of passing, you must re-take the test."},{"q":"What is the minimum length of an air brake course?","choices":["7 hours","4 hours","12 hours","121.5 hours"],"answerIndex":0,"explanation":"Air brake courses are a minimum of 7 hours; certified courses add 4 hours of practical training."}]},{"title":"Applying step-by-step and knowledge tests","points":["Prerequisites: full-privilege Class 5 or 6 (or equivalent), acceptable driving record, minimum age, no outstanding fines, and medical standards.","Acceptable record means fewer than four penalty-point offences in two years and zero motor-vehicle Criminal Code convictions in three years.","Apply at a driver licensing office with primary and secondary ID, pay the fee, and take the knowledge and road signs tests.","The learner's licence lets you practise with a supervisor seated beside you (or immediately behind and to the right).","With a learner's licence in a bus, taxi, ride-hailing vehicle or ambulance, only your supervisor and same-class learners may ride.","All knowledge tests are multiple choice, conducted only in English, and every answer is in this guide.","After passing the road test you get a temporary licence and a medical form your doctor sends to RoadSafetyBC."],"mustKnow":["Driving record: fewer than four offences carrying penalty points in the previous two years","Driving record: zero motor-vehicle-related Criminal Code convictions in the previous three years","The learner's licence is valid for one year","The supervisor must be at least 19 years old and hold the appropriate licence class for the vehicle","Heavy trailer endorsement supervisor: at least 19 years old and holds a Class 1, 2 or 3 driver's licence"],"check":[{"q":"How long is a commercial learner's licence valid?","choices":["Six months","Two years","One year","Ninety days"],"answerIndex":2,"explanation":"The learner's licence is valid f
